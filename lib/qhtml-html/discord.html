<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Discord Context Menu</title><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}body,html{background:#1e1f22}body{font-family:"gg sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color:#dbdee1;display:flex;justify-content:center;align-items:flex-start;padding:20px 0;min-height:100vh}.iphone-frame{position:relative;width:400px;min-height:844px;display:flex;flex-direction:column;border-radius:44px;overflow:visible;background:#313338;box-shadow:0 25px 60px -12px rgba(0,0,0,.7)}.blurred-background{position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:44px;overflow:hidden;background:radial-gradient(circle at 80% 15%,rgba(88,101,242,.15),transparent 50%),radial-gradient(circle at 20% 85%,rgba(88,101,242,.1),transparent 55%),#313338;filter:blur(24px)}.bg-header{height:90px;background:#2b2d31;display:flex;align-items:flex-end;padding:10px 16px;gap:12px;border-bottom:1px solid #1e1f22}.bg-avatar{width:38px;height:38px;border-radius:50%;background:#5865f2}.bg-title{width:100px;height:14px;background:#1e1f22;border-radius:6px;margin-bottom:12px}.bg-bubble-green{position:absolute;right:16px;background:#5865f2;border-radius:16px;opacity:.9}.foreground-layer{position:relative;z-index:2;width:100%;min-height:844px;display:flex;flex-direction:column;padding:0 12px 20px 12px}.status-bar{height:48px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:13.5px;font-weight:600;letter-spacing:-.2px;margin-bottom:240px;position:relative;color:#dbdee1}.status-left{display:flex;align-items:center;gap:5px;white-space:nowrap}.signal-bars{display:flex;align-items:flex-end;gap:1.5px;height:10px;margin-right:2px}.bar{width:3px;background:#dbdee1;border-radius:1px}.bar:first-child{height:3px}.bar:nth-child(2){height:5px}.bar:nth-child(3){height:8px}.bar:nth-child(4){height:10px;opacity:.35}.status-center{position:absolute;left:50%;transform:translateX(-50%);font-weight:700;font-size:14px}.status-right{display:flex;align-items:center;gap:5px;font-size:13px}.battery-icon{width:22px;height:11px;border:1px solid rgba(219,222,225,.4);border-radius:3.5px;padding:1px;display:flex;align-items:center;position:relative;margin-left:2px}.battery-level{width:85%;height:100%;background:#23a55a;border-radius:1.5px}.battery-icon::after{content:"";position:absolute;right:-3px;width:1.5px;height:4px;background:rgba(219,222,225,.4);border-radius:0 1px 1px 0}.emoji{width:26px;height:26px;display:block;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}.emoji.inline{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.2em;margin:0 1px}.reaction-bar{align-self:flex-start;background:#2b2d31;border-radius:16px;padding:6px 10px 6px 12px;display:flex;align-items:center;gap:11px;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.4)}.reaction-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center}.btn-add-reaction{width:27px;height:27px;border-radius:50%;background:rgba(88,101,242,.2);display:flex;align-items:center;justify-content:center;margin-left:3px}.btn-add-reaction svg{width:15px;height:15px;stroke:#5865F2;stroke-width:2.4;stroke-linecap:round;fill:none}.message-bubble{align-self:flex-start;background:#2b2d31;border-radius:16px;padding:8px 10px;max-width:300px;position:relative;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.3)}.message-media{margin-bottom:6px;border-radius:12px;overflow:hidden;max-width:100%}.message-media img{width:100%;height:auto;max-height:260px;object-fit:cover;display:block;border-radius:12px}.message-text{font-size:16px;line-height:1.35;color:#dbdee1;word-break:break-word;padding:0 4px}.message-text:empty{display:none}.message-time{text-align:right;font-size:11px;color:#949ba4;margin-top:4px;margin-left:20px;padding-right:2px}.context-menu{width:265px;background:#111214;border:1px solid #1e1f22;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}.menu-item{display:flex;justify-content:space-between;align-items:center;padding:11.5px 16px;font-size:15px;font-weight:500;color:#dbdee1;position:relative}.menu-item:not(:last-child)::after{content:"";position:absolute;bottom:0;left:16px;right:0;height:.5px;background:#1e1f22}.menu-item svg{width:19px;height:19px;stroke:#5865F2;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.menu-item.danger{color:#da373c}.menu-item.danger svg{stroke:#DA373C}</style></head><body><div class="iphone-frame"><div class="blurred-background"><div class="bg-header"><div class="bg-avatar"></div><div class="bg-title"></div></div><div class="bg-bubble-green" style="top:130px;width:180px;height:120px"></div><div class="bg-bubble-green" style="top:420px;width:230px;height:60px"></div><div class="bg-bubble-green" style="top:500px;width:210px;height:80px"></div><div class="bg-bubble-green" style="top:600px;width:230px;height:60px"></div></div><div class="foreground-layer"><div class="status-bar"><div class="status-left"><div class="signal-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><span>{{carrier}}</span></div><div class="status-center">{{clock}}</div><div class="status-right"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:2px"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> <span>{{battery}}</span><div class="battery-icon"><div class="battery-level"></div></div></div></div><div class="reaction-bar"><div class="reaction-btn"><img class="emoji" alt="{{reaction1Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction1Codepoint}}.png"></div><div class="reaction-btn"><img class="emoji" alt="{{reaction2Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction2Codepoint}}.png"></div><div class="reaction-btn"><img class="emoji" alt="{{reaction3Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction3Codepoint}}.png"></div><div class="reaction-btn"><img class="emoji" alt="{{reaction4Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction4Codepoint}}.png"></div><div class="reaction-btn"><img class="emoji" alt="{{reaction5Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction5Codepoint}}.png"></div><div class="reaction-btn"><img class="emoji" alt="{{reaction6Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction6Codepoint}}.png"></div><div class="btn-add-reaction"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div></div><div class="message-bubble">{{media}}<div class="message-text">{{message}}</div><div class="message-time">{{messageTime}}</div></div><div class="context-menu"><div class="menu-item"><span>{{menuStar}}</span><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="menu-item"><span>{{menuReply}}</span><svg viewBox="0 0 24 24"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></div><div class="menu-item"><span>{{menuForward}}</span><svg viewBox="0 0 24 24"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg></div><div class="menu-item"><span>{{menuCopy}}</span><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></div><div class="menu-item"><span>{{menuSpeak}}</span><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="menu-item"><span>{{menuReport}}</span><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="menu-item danger"><span>{{menuDelete}}</span><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div></div></div></div></body></html>
