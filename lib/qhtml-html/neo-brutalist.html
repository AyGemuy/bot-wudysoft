<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neo-Brutalist Pop — Context Menu</title>
  <style>
    @import url(https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap);

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased
    }

    body,
    html {
      background: #000
    }

    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 0;
      min-height: 100vh
    }

    .iphone-frame {
      position: relative;
      width: 400px;
      min-height: 844px;
      background: #f6f0e2;
      border: 3px solid #111;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 12px 12px 0 #c6f24e, 22px 22px 0 rgba(255, 92, 56, .55)
    }

    .blurred-background {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: #f6f0e2
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(17, 17, 17, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(17, 17, 17, .07) 1px, transparent 1px);
      background-size: 32px 32px
    }

    .bg-chat {
      position: absolute;
      inset: 0
    }

    .bg-header {
      height: 90px;
      display: flex;
      align-items: flex-end;
      padding: 10px 16px;
      gap: 12px;
      border-bottom: 2px solid rgba(17, 17, 17, .16)
    }

    .bg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(17, 17, 17, .06);
      border: 2px solid rgba(17, 17, 17, .22)
    }

    .bg-title {
      width: 100px;
      height: 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      background: rgba(17, 17, 17, .14)
    }

    .bg-bubble {
      position: absolute;
      right: 16px;
      border-radius: 18px;
      border: 2px solid rgba(17, 17, 17, .16);
      background: rgba(17, 17, 17, .045)
    }

    .bg-bubble.accent {
      background: rgba(198, 242, 78, .35);
      border-color: rgba(17, 17, 17, .28)
    }

    .foreground-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 844px;
      display: flex;
      flex-direction: column;
      padding: 0 12px 20px 12px
    }

    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -.2px;
      margin-bottom: 240px;
      position: relative;
      color: #111
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap
    }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 10px;
      margin-right: 2px
    }

    .bar {
      width: 3px;
      background: #111;
      border-radius: 1px
    }

    .bar:first-child {
      height: 3px
    }

    .bar:nth-child(2) {
      height: 5px
    }

    .bar:nth-child(3) {
      height: 8px
    }

    .bar:nth-child(4) {
      height: 10px;
      opacity: .25
    }

    .status-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 14px
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px
    }

    .battery-icon {
      width: 24px;
      height: 12px;
      border: 2px solid #111;
      border-radius: 4px;
      padding: 1.5px;
      display: flex;
      align-items: center;
      position: relative;
      margin-left: 2px
    }

    .battery-level {
      width: 85%;
      height: 100%;
      background: #c6f24e;
      border-radius: 1.5px
    }

    .battery-icon::after {
      content: "";
      position: absolute;
      right: -4px;
      width: 2px;
      height: 5px;
      background: #111;
      border-radius: 0 1px 1px 0
    }

    .emoji {
      width: 26px;
      height: 26px;
      display: block;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none
    }

    .reaction-bar {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 6px 12px;
      margin-bottom: 12px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 18px;
      box-shadow: 5px 5px 0 #111;
      transform: rotate(-1.2deg)
    }

    .reaction-btn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s cubic-bezier(.2, .8, .3, 1)
    }

    .reaction-btn:hover {
      transform: translateY(-3px) scale(1.1)
    }

    .btn-add-reaction {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      background: #c6f24e;
      border: 2px solid #111
    }

    .btn-add-reaction svg {
      width: 15px;
      height: 15px;
      stroke: #111;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none
    }

    .message-bubble {
      align-self: flex-start;
      position: relative;
      max-width: 300px;
      margin-bottom: 12px;
      padding: 12px 16px 8px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 18px 18px 18px 6px;
      box-shadow: 6px 6px 0 #111
    }

    .message-text {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 500;
      color: #111;
      word-break: break-word
    }

    .message-time {
      text-align: right;
      font-size: 11px;
      font-weight: 600;
      color: rgba(17, 17, 17, .45);
      margin-top: 5px;
      margin-left: 20px
    }

    .context-menu {
      width: 265px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 8px 8px 0 #111
    }

    .menu-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 14px;
      background: #c6f24e;
      border-bottom: 3px solid #111;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #111
    }

    .menu-head .dots {
      letter-spacing: 3px;
      font-size: 12px
    }

    .menu-item {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 15.5px;
      font-weight: 600;
      color: #111;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease, padding-left .15s ease, color .15s ease
    }

    .menu-item:not(:last-child)::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #111
    }

    .menu-item svg {
      width: 19px;
      height: 19px;
      stroke: #111;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: transform .15s ease, stroke .15s ease
    }

    .menu-item:hover {
      background: #ffe98a;
      padding-left: 20px
    }

    .menu-item:hover svg {
      transform: scale(1.12) rotate(-4deg)
    }

    .menu-item.danger {
      color: #ff3b30
    }

    .menu-item.danger svg {
      stroke: #FF3B30
    }

    .menu-item.danger:hover {
      background: #ff5c38;
      color: #fff
    }

    .menu-item.danger:hover svg {
      stroke: #fff;
      transform: scale(1.12) rotate(4deg)
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="iphone-frame">
    <div class="blurred-background">
      <div class="bg-grid"></div>
      <div class="bg-chat">
        <div class="bg-header">
          <div class="bg-avatar"></div>
          <div class="bg-title"></div>
        </div>
        <div class="bg-bubble accent" style="top:130px;width:180px;height:120px"></div>
        <div class="bg-bubble" style="top:420px;width:230px;height:60px"></div>
        <div class="bg-bubble" style="top:500px;width:210px;height:80px"></div>
        <div class="bg-bubble accent" style="top:600px;width:230px;height:60px"></div>
      </div>
    </div>
    <div class="foreground-layer">
      <div class="status-bar">
        <div class="status-left">
          <div class="signal-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div><span>{{carrier}}</span>
        </div>
        <div class="status-center">{{clock}}</div>
        <div class="status-right"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" style="margin-right:2px">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg> <span>{{battery}}</span>
          <div class="battery-icon">
            <div class="battery-level"></div>
          </div>
        </div>
      </div>
      <div class="reaction-bar">
        <div class="reaction-btn"><img class="emoji" alt="{{reaction1Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction1Codepoint}}.png"></div>
        <div class="reaction-btn"><img class="emoji" alt="{{reaction2Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction2Codepoint}}.png"></div>
        <div class="reaction-btn"><img class="emoji" alt="{{reaction3Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction3Codepoint}}.png"></div>
        <div class="reaction-btn"><img class="emoji" alt="{{reaction4Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction4Codepoint}}.png"></div>
        <div class="reaction-btn"><img class="emoji" alt="{{reaction5Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction5Codepoint}}.png"></div>
        <div class="reaction-btn"><img class="emoji" alt="{{reaction6Alt}}" src="https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.1.2/img/apple/64/{{reaction6Codepoint}}.png"></div>
        <div class="btn-add-reaction"><svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg></div>
      </div>
      <div class="message-bubble">
        <div class="message-text">{{message}}</div>
        <div class="message-time">{{messageTime}}</div>
      </div>
      <div class="context-menu">
        <div class="menu-head"><span>Actions</span><span class="dots">•••</span></div>
        <div class="menu-item"><span>{{menuStar}}</span><svg viewBox="0 0 24 24">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
          </svg></div>
        <div class="menu-item"><span>{{menuReply}}</span><svg viewBox="0 0 24 24">
            <polyline points="9 17 4 12 9 7" />
            <path d="M20 18v-2a4 4 0 0 0-4-4H4" />
          </svg></div>
        <div class="menu-item"><span>{{menuForward}}</span><svg viewBox="0 0 24 24">
            <polyline points="15 17 20 12 15 7" />
            <path d="M4 18v-2a4 4 0 0 1 4-4h12" />
          </svg></div>
        <div class="menu-item"><span>{{menuCopy}}</span><svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg></div>
        <div class="menu-item"><span>{{menuSpeak}}</span><svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          </svg></div>
        <div class="menu-item"><span>{{menuReport}}</span><svg viewBox="0 0 24 24">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg></div>
        <div class="menu-item danger"><span>{{menuDelete}}</span><svg viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg></div>
      </div>
    </div>
  </div>
</body>

</html>
