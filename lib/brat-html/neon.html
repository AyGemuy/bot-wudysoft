<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Neon Glitch Impact 512</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --cyan: #00fff0;
      --magenta: #ff00e5;
      --white: #ffffff
    }

    body,
    html {
      height: 100%;
      background: #03030a;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 55%, rgba(0, 255, 240, .08) 0, transparent 60%), radial-gradient(circle at 50% 45%, rgba(255, 0, 229, .06) 0, transparent 55%), linear-gradient(135deg, #08081a 0, #02020a 100%);
      border-radius: 14px;
      border: 1px solid rgba(0, 255, 240, .25);
      box-shadow: 0 0 80px rgba(0, 255, 240, .15), 0 0 40px rgba(255, 0, 229, .1), inset 0 0 100px rgba(0, 255, 240, .04);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 255, 240, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, .07) 1px, transparent 1px);
      background-size: 32px 32px;
      animation: gridScroll 6s linear infinite;
      pointer-events: none;
      z-index: 1
    }

    @keyframes gridScroll {
      0% {
        background-position: 0 0
      }

      100% {
        background-position: 0 32px
      }
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0, 0, 0, .22) 2px, rgba(0, 0, 0, .22) 3px);
      pointer-events: none;
      z-index: 15;
      animation: scanMove 8s linear infinite
    }

    @keyframes scanMove {
      0% {
        background-position: 0 0
      }

      100% {
        background-position: 0 100px
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: Orbitron, 'Arial Black', sans-serif;
      font-weight: 900;
      letter-spacing: .02em;
      white-space: nowrap;
      line-height: 1;
      will-change: transform;
      z-index: 5
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform
    }

    .stage.run .word-left .fly {
      animation: flyLeft .5s cubic-bezier(.55, 0, .95, .55) forwards
    }

    .stage.run .word-right .fly {
      animation: flyRight .5s cubic-bezier(.55, 0, .95, .55) forwards
    }

    @keyframes flyLeft {
      0% {
        transform: translate(-512px, 0);
        filter: blur(3px)
      }

      70% {
        filter: blur(1px)
      }

      100% {
        transform: translate(14px, 0);
        filter: blur(0)
      }
    }

    @keyframes flyRight {
      0% {
        transform: translate(512px, 0);
        filter: blur(3px)
      }

      70% {
        filter: blur(1px)
      }

      100% {
        transform: translate(-14px, 0);
        filter: blur(0)
      }
    }

    .word-text {
      display: inline-block;
      color: var(--white);
      will-change: transform, filter, text-shadow
    }

    .word-left .word-text {
      text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan), 0 0 8px var(--cyan), 0 0 18px var(--cyan), 0 0 36px var(--cyan), 0 0 60px rgba(0, 255, 240, .5)
    }

    .word-right .word-text {
      text-shadow: -2px 0 var(--cyan), 2px 0 var(--magenta), 0 0 8px var(--magenta), 0 0 18px var(--magenta), 0 0 36px var(--magenta), 0 0 60px rgba(255, 0, 229, .5)
    }

    .stage.impact .word-text {
      animation: neonPulse 2.4s ease-in-out infinite, recoil .4s ease-out
    }

    @keyframes recoil {
      0% {
        transform: scale(1.22)
      }

      45% {
        transform: scale(.95)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes neonPulse {

      0%,
      100% {
        filter: brightness(1)
      }

      50% {
        filter: brightness(1.5)
      }
    }

    .stage.impact {
      animation: shake .5s cubic-bezier(.36, .07, .19, .97), glitchShift .45s steps(5) 50ms
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      10% {
        transform: translate(-8px, 6px) rotate(-.5deg)
      }

      20% {
        transform: translate(8px, -6px) rotate(.5deg)
      }

      30% {
        transform: translate(-6px, 4px) rotate(-.3deg)
      }

      40% {
        transform: translate(6px, -4px) rotate(.3deg)
      }

      55% {
        transform: translate(-4px, 3px)
      }

      75% {
        transform: translate(3px, -2px)
      }

      90% {
        transform: translate(-1px, 1px)
      }
    }

    @keyframes glitchShift {
      0% {
        filter: none
      }

      20% {
        filter: hue-rotate(90deg) saturate(2) contrast(1.3)
      }

      40% {
        filter: hue-rotate(-90deg) saturate(2) contrast(1.3)
      }

      60% {
        filter: hue-rotate(180deg) saturate(2) contrast(1.5)
      }

      80% {
        filter: hue-rotate(-40deg) saturate(1.6)
      }

      100% {
        filter: none
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #fff 0, rgba(0, 255, 240, .7) 20%, rgba(255, 0, 229, .4) 40%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen
    }

    .stage.impact .flash {
      animation: flash .5s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      8% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .shockwave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40
    }

    .sw-cyan {
      border: 4px solid var(--cyan);
      box-shadow: 0 0 30px var(--cyan), inset 0 0 30px var(--cyan)
    }

    .sw-magenta {
      border: 4px solid var(--magenta);
      box-shadow: 0 0 30px var(--magenta), inset 0 0 30px var(--magenta);
      animation-delay: 80ms !important
    }

    .stage.impact .sw-cyan,
    .stage.impact .sw-magenta {
      animation: shockwave 1s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes shockwave {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 10px
      }

      100% {
        transform: translate(-50%, -50%) scale(30);
        opacity: 0;
        border-width: 1px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .65) 100%)
    }
  </style>
</head>

    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="shockwave sw-cyan"></div>
    <div class="shockwave sw-magenta"></div>
    <div class="flash"></div>
    <div class="vignette"></div>
  </div>
