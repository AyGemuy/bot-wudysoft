<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Liquid Chrome 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #0a0a0f;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1a1a2e 0, #0a0a0f 75%);
      border-radius: 16px;
      border: 1px solid rgba(192, 192, 192, .15);
      box-shadow: 0 0 100px rgba(192, 192, 192, .08), 0 0 40px rgba(255, 0, 229, .06), inset 0 0 120px rgba(0, 0, 0, .5);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 0deg, transparent 0, rgba(0, 255, 240, .12) 15%, rgba(255, 0, 229, .1) 30%, transparent 45%, rgba(192, 192, 192, .15) 60%, transparent 75%, rgba(0, 255, 240, .08) 90%, transparent 100%);
      animation: auroraSpin 12s linear infinite;
      z-index: 0;
      filter: blur(40px)
    }

    @keyframes auroraSpin {
      to {
        transform: rotate(360deg)
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: Syne, sans-serif;
      font-weight: 800;
      letter-spacing: -.03em;
      white-space: nowrap;
      line-height: .9;
      z-index: 5;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform
    }

    .stage.run .word-left .fly {
      animation: chromeInLeft .6s cubic-bezier(.22, 1, .36, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: chromeInRight .6s cubic-bezier(.22, 1, .36, 1) forwards
    }

    @keyframes chromeInLeft {
      0% {
        transform: translate(-512px, 0) scaleX(1.6);
        filter: blur(12px) brightness(2);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(14px, 0) scaleX(1);
        filter: blur(0) brightness(1);
        opacity: 1
      }
    }

    @keyframes chromeInRight {
      0% {
        transform: translate(512px, 0) scaleX(1.6);
        filter: blur(12px) brightness(2);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0) scaleX(1);
        filter: blur(0) brightness(1);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      background: linear-gradient(180deg, #fff 0, #e8e8e8 15%, #b0b0b0 30%, #fff 48%, #fff 52%, #909090 60%, #d0d0d0 75%, #fff 90%, #a0a0a0 100%);
      background-size: 100% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 2px 0 rgba(255, 255, 255, .3)) drop-shadow(0 0 20px rgba(192, 192, 192, .25));
      animation: chromeSheen 3.5s ease-in-out infinite;
      will-change: background-position, transform, filter
    }

    @keyframes chromeSheen {

      0%,
      100% {
        background-position: 0 0
      }

      50% {
        background-position: 0 100%
      }
    }

    .stage.impact .word-text {
      animation: chromeSheen 3.5s ease-in-out infinite, chromeRecoil .5s cubic-bezier(.34, 1.56, .64, 1), chromeFlare .6s ease-out
    }

    @keyframes chromeRecoil {
      0% {
        transform: scale(1.25)
      }

      45% {
        transform: scale(.94)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes chromeFlare {
      0% {
        filter: drop-shadow(0 0 60px rgba(255, 255, 255, 1)) drop-shadow(0 0 100px rgba(0, 255, 240, .8)) brightness(2.5) saturate(1.8)
      }

      60% {
        filter: drop-shadow(0 0 30px rgba(192, 192, 192, .6)) drop-shadow(0 0 60px rgba(255, 0, 229, .3)) brightness(1.3)
      }

      100% {
        filter: drop-shadow(0 2px 0 rgba(255, 255, 255, .3)) drop-shadow(0 0 20px rgba(192, 192, 192, .25)) brightness(1) saturate(1)
      }
    }

    .stage.impact {
      animation: chromePulse .55s ease-out
    }

    @keyframes chromePulse {
      0% {
        transform: scale(1)
      }

      30% {
        transform: scale(1.025)
      }

      100% {
        transform: scale(1)
      }
    }

    .c-ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      border: 3px solid transparent;
      background: linear-gradient(135deg, rgba(255, 255, 255, .9), rgba(192, 192, 192, .6), rgba(0, 255, 240, .5), rgba(255, 0, 229, .4)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      box-shadow: 0 0 30px rgba(192, 192, 192, .5)
    }

    .c-ripple.r2 {
      animation-delay: .12s !important;
      border-width: 2px
    }

    .c-ripple.r3 {
      animation-delay: .24s !important;
      border-width: 1px
    }

    .stage.impact .c-ripple {
      animation: chromeRipple 1.1s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes chromeRipple {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(22);
        opacity: 0
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .6) 100%)
    }

    .sparkle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 18;
      opacity: 0;
      transition: opacity .3s
    }

    .stage.impact .sparkle-layer {
      animation: sparkleFlash .8s ease-out
    }

    @keyframes sparkleFlash {
      0% {
        opacity: 0
      }

      15% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }
  </style>
</head>

<body>

  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="c-ripple"></div>
    <div class="c-ripple r2"></div>
    <div class="c-ripple r3"></div>
    <div class="vignette"></div>
  </div>
