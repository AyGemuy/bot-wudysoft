<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Glass Shatter 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #050510;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0a0a1e 0, #050510 70%);
      border-radius: 12px;
      border: 1px solid rgba(150, 200, 255, .2);
      box-shadow: 0 0 80px rgba(100, 180, 255, .15), inset 0 0 100px rgba(100, 180, 255, .05);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(1px 1px at 15% 25%, #fff, transparent), radial-gradient(1px 1px at 75% 15%, #fff, transparent), radial-gradient(1px 1px at 85% 55%, #fff, transparent), radial-gradient(1px 1px at 25% 85%, #fff, transparent), radial-gradient(1px 1px at 65% 95%, #fff, transparent);
      opacity: .6;
      z-index: 1;
      animation: twinkle 3s ease-in-out infinite
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .3
      }

      50% {
        opacity: .8
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: .04em;
      white-space: nowrap;
      line-height: .9;
      z-index: 5;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform, opacity, filter
    }

    .stage.run .word-left .fly {
      animation: flyL .5s cubic-bezier(.55, 0, .35, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: flyR .5s cubic-bezier(.55, 0, .35, 1) forwards
    }

    @keyframes flyL {
      0% {
        transform: translate(-512px, 0);
        filter: blur(10px);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(14px, 0);
        filter: blur(0);
        opacity: 1
      }
    }

    @keyframes flyR {
      0% {
        transform: translate(512px, 0);
        filter: blur(10px);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0);
        filter: blur(0);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      background: linear-gradient(180deg, #fff 0, #a0e0ff 50%, #6080ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 0 15px rgba(100, 200, 255, .6));
      will-change: transform, opacity, filter
    }

    .stage.impact .word-text {
      animation: shatterHurt .55s ease-out forwards
    }

    @keyframes shatterHurt {
      0% {
        transform: scale(1.15);
        filter: drop-shadow(0 0 50px #fff) brightness(2.5)
      }

      30% {
        transform: scale(1);
        filter: drop-shadow(0 0 25px #88ddff) brightness(1.6);
        opacity: 1
      }

      60% {
        opacity: .5
      }

      100% {
        transform: scale(1);
        opacity: 0;
        filter: drop-shadow(0 0 0) brightness(1)
      }
    }

    .stage.impact {
      animation: shake .5s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      10% {
        transform: translate(-10px, 6px) rotate(-1deg)
      }

      20% {
        transform: translate(10px, -6px) rotate(1deg)
      }

      30% {
        transform: translate(-7px, 4px)
      }

      40% {
        transform: translate(7px, -4px)
      }

      60% {
        transform: translate(-3px, 2px)
      }

      80% {
        transform: translate(2px, -1px)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #fff 0, #a0e0ff 25%, transparent 65%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen
    }

    .stage.impact .flash {
      animation: flash .5s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      8% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .shockwave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(160, 224, 255, .9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 60px rgba(160, 224, 255, .8), inset 0 0 30px rgba(160, 224, 255, .6)
    }

    .stage.impact .shockwave {
      animation: sw 1.1s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes sw {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 10px
      }

      100% {
        transform: translate(-50%, -50%) scale(28);
        opacity: 0;
        border-width: 1px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="shockwave"></div>
    <div class="flash"></div>
  </div>
