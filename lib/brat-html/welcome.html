<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Game Welcome Type</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Audiowide&family=Zen+Dots&family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #05060a;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: radial-gradient(circle at 50% 45%, #10131f 0, #080a12 60%, #04050a 100%);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .8), inset 0 0 100px rgba(80, 110, 200, .06);
      overflow: hidden;
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .02) 0 1px, transparent 1px 3px);
      mix-blend-mode: screen;
      opacity: .6;
      pointer-events: none;
      z-index: 1
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, .55) 100%);
      pointer-events: none;
      z-index: 6
    }

    .word {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      opacity: 0;
      transition: opacity .2s ease;
      transform: translateZ(0)
    }

    .stage.run .word,
    .stage.settle .word,
    .stage.shining .word {
      opacity: 1
    }

    .ch {
      display: inline-block;
      text-align: center;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      background-size: 250% 100%;
      background-position: 0 0;
      filter: drop-shadow(0 0 14px var(--glow));
      will-change: transform, opacity, filter, background-position;
      backface-visibility: hidden
    }

    .ch.font-0 {
      font-family: Orbitron, sans-serif;
      font-weight: 800;
      --glow: rgba(90, 170, 255, .75);
      background-image: linear-gradient(100deg, rgba(150, 200, 255, .55) 0, rgba(150, 200, 255, .55) 40%, rgba(255, 255, 255, .98) 50%, rgba(150, 200, 255, .55) 60%, rgba(150, 200, 255, .55) 100%)
    }

    .ch.font-1 {
      font-family: Audiowide, sans-serif;
      font-weight: 400;
      --glow: rgba(255, 90, 180, .75);
      background-image: linear-gradient(100deg, rgba(255, 160, 210, .55) 0, rgba(255, 160, 210, .55) 40%, rgba(255, 255, 255, .98) 50%, rgba(255, 160, 210, .55) 60%, rgba(255, 160, 210, .55) 100%)
    }

    .ch.font-2 {
      font-family: 'Zen Dots', sans-serif;
      font-weight: 400;
      --glow: rgba(80, 255, 180, .75);
      background-image: linear-gradient(100deg, rgba(150, 255, 210, .55) 0, rgba(150, 255, 210, .55) 40%, rgba(255, 255, 255, .98) 50%, rgba(150, 255, 210, .55) 60%, rgba(150, 255, 210, .55) 100%)
    }

    .ch.font-3 {
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      --glow: rgba(255, 200, 90, .75);
      background-image: linear-gradient(100deg, rgba(255, 220, 150, .55) 0, rgba(255, 220, 150, .55) 40%, rgba(255, 255, 255, .98) 50%, rgba(255, 220, 150, .55) 60%, rgba(255, 220, 150, .55) 100%)
    }

    .stage.run .ch {
      animation: slamIn 1s cubic-bezier(.2, .9, .25, 1) both;
      animation-delay: calc(var(--i) * 60ms)
    }

    @keyframes slamIn {
      0% {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.15);
        opacity: 0;
        filter: blur(30px) brightness(3) drop-shadow(0 0 0 transparent)
      }

      55% {
        opacity: 1;
        filter: blur(0) brightness(1.6) drop-shadow(0 0 22px var(--glow))
      }

      72% {
        transform: translate(0, 0) rotate(0) scale(1.13);
        filter: blur(0) brightness(1.3) drop-shadow(0 0 20px var(--glow))
      }

      86% {
        transform: scale(.96);
        filter: brightness(1.05) drop-shadow(0 0 16px var(--glow))
      }

      100% {
        transform: translate(0, 0) rotate(0) scale(1);
        opacity: 1;
        filter: blur(0) brightness(1) drop-shadow(0 0 14px var(--glow))
      }
    }

    .stage.shining .ch {
      animation: shineSweep .9s ease-out both;
      animation-delay: calc(var(--i) * 25ms)
    }

    @keyframes shineSweep {
      0% {
        background-position: 0 0
      }

      100% {
        background-position: 100% 0
      }
    }

    .stage.settle .ch {
      animation: float 3.6s ease-in-out infinite, glowPulse 2.4s ease-in-out infinite;
      animation-delay: calc(var(--i) * -.32s), calc(var(--i) * -.18s)
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        filter: drop-shadow(0 0 14px var(--glow))
      }

      50% {
        filter: drop-shadow(0 0 30px var(--glow)) brightness(1.28)
      }
    }

    .stage.settle .ch.glitch {
      animation: glitchFlicker .42s both
    }

    @keyframes glitchFlicker {
      0% {
        transform: translate(0, 0);
        filter: drop-shadow(0 0 14px var(--glow))
      }

      20% {
        transform: translate(-4px, 2px);
        filter: drop-shadow(0 0 34px #fff) brightness(2.6)
      }

      40% {
        transform: translate(5px, -2px);
        filter: drop-shadow(-3px 0 0 #ff2f6a) drop-shadow(3px 0 0 #29b6ff) brightness(1.6)
      }

      60% {
        transform: translate(-3px, -1px);
        filter: drop-shadow(0 0 26px #fff) brightness(2)
      }

      80% {
        transform: translate(2px, 2px);
        filter: drop-shadow(0 0 18px var(--glow)) brightness(1.2)
      }

      100% {
        transform: translate(0, 0);
        filter: drop-shadow(0 0 14px var(--glow))
      }
    }

    .stage.settle .ch.swapping {
      animation: swapPop .5s cubic-bezier(.34, 1.56, .64, 1) both
    }

    @keyframes swapPop {
      0% {
        transform: scale(1) rotate(0);
        filter: drop-shadow(0 0 14px var(--glow))
      }

      35% {
        transform: scale(1.32) rotate(10deg);
        filter: drop-shadow(0 0 38px #fff) brightness(2.6)
      }

      65% {
        transform: scale(.9) rotate(-6deg);
        filter: drop-shadow(0 0 22px var(--glow)) brightness(.85)
      }

      100% {
        transform: scale(1) rotate(0);
        filter: drop-shadow(0 0 14px var(--glow))
      }
    }

    .stage.settle .ch.wave {
      animation: wavePulse .9s cubic-bezier(.34, 1.56, .64, 1) both;
      animation-delay: calc(var(--i) * 42ms)
    }

    @keyframes wavePulse {
      0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 14px var(--glow)) brightness(1)
      }

      40% {
        transform: translateY(-12px) scale(1.16);
        filter: drop-shadow(0 0 32px var(--glow)) brightness(1.8)
      }

      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 14px var(--glow)) brightness(1)
      }
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word" id="word"></div>
  </div>

</html>
