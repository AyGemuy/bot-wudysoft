<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Ink Diffusion 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #e8ddc8;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #f5ecd7 0, #e8ddc8 100%);
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(80, 60, 30, .3), inset 0 0 60px rgba(120, 90, 40, .08);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: .22;
      mix-blend-mode: multiply;
      z-index: 1;
      pointer-events: none
    }

    .stage::after {
      content: '墨';
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      background: #8b1a1a;
      color: #f5ecd7;
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      border-radius: 3px;
      z-index: 3;
      opacity: .85;
      box-shadow: 0 3px 8px rgba(80, 0, 0, .35)
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
      letter-spacing: -.02em;
      white-space: nowrap;
      line-height: .9;
      z-index: 5;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform, opacity, filter
    }

    .stage.run .word-left .fly {
      animation: spreadL .7s ease-out forwards
    }

    .stage.run .word-right .fly {
      animation: spreadR .7s ease-out forwards
    }

    @keyframes spreadL {
      0% {
        transform: translate(-80px, 0) scale(.4);
        filter: blur(20px);
        opacity: 0
      }

      40% {
        opacity: .9
      }

      100% {
        transform: translate(14px, 0) scale(1);
        filter: blur(0);
        opacity: 1
      }
    }

    @keyframes spreadR {
      0% {
        transform: translate(80px, 0) scale(.4);
        filter: blur(20px);
        opacity: 0
      }

      40% {
        opacity: .9
      }

      100% {
        transform: translate(-14px, 0) scale(1);
        filter: blur(0);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      color: #1a1410;
      text-shadow: 1px 2px 3px rgba(50, 30, 10, .2);
      will-change: transform, color, filter
    }

    .stage.impact .word-text {
      animation: bleedOut 1.6s ease-out forwards
    }

    @keyframes bleedOut {
      0% {
        color: #1a1410;
        filter: blur(0);
        transform: scale(1)
      }

      15% {
        color: #1a1410;
        filter: blur(0);
        transform: scale(1.05)
      }

      100% {
        color: rgba(26, 20, 16, 0);
        filter: blur(15px);
        transform: scale(1.3)
      }
    }

    .stage.impact {
      animation: inkPulse 1.5s ease-out
    }

    @keyframes inkPulse {
      0% {
        transform: scale(1)
      }

      30% {
        transform: scale(1.012)
      }

      100% {
        transform: scale(1)
      }
    }

    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(26, 20, 16, .7);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 15
    }

    .stage.impact .ripple {
      animation: inkRipple 1.8s cubic-bezier(.2, .8, .4, 1) forwards
    }

    .stage.impact .r2 {
      animation-delay: .2s !important
    }

    .stage.impact .r3 {
      animation-delay: .4s !important
    }

    @keyframes inkRipple {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: .9;
        border-width: 3px
      }

      100% {
        transform: translate(-50%, -50%) scale(28);
        opacity: 0;
        border-width: .5px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="ripple"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
  </div>
  <script>
    ! function() {

        o = r.querySelector(".fly"),
        l = i.querySelector(".fly"),
        c = document.getElementById("textLeft"),

          var t = function() {

              function() {

                  for (var e = Math.random() * Math.PI * 2, a = 12 * Math.random() + 2, n = { x: 256 + 30 * (Math.random() - .5), y: 256 + 30 * (Math.random() - .5), vx: Math.cos(e) * a, vy: Math.sin(e) * a, life: 1, decay: .007 + .01 * Math.random(), size: 12 + 22 * Math.random(), grow: 1.006 + .01 * Math.random(), children: [] }, r = 3 + Math.floor(4 * Math.random()), i = 0; i < r; i++) n.children.push({ dx: 40 * (Math.random() - .5), dy: 40 * (Math.random() - .5), rFactor: .4 + .6 * Math.random() });
                  h.push(n)
                }
                for (var o = 0; o < 130; o++) {

                  s.push({ x: 256, y: 256, vx: Math.cos(l) * c, vy: Math.sin(l) * c - 2, life: 1, decay: .014 + .018 * Math.random(), size: 1.5 + 4 * Math.random() })
                }
              }(), setTimeout(m, 3800)
          };
          o.addEventListener("animationend", t, { once: !0 })
        })
      }

      function u() {
        (function() {
          var t = function(t) {
            var e = String(t).trim().split(/\s+/).filter(Boolean);
            if (!e.length) return ["", ""];
            if (1 === e.length) { var a = e[0]; if (a.length < 2) return [a, a]; var n = Math.ceil(a.length / 2); return [a.slice(0, n), a.slice(n)] }

            }

          var a = function(t, e) {
            if (!t && !e) return 175;
            f.font = 'italic 900 100px "Playfair Display", serif';
            var a = t ? f.measureText(t).width || 1 : 0,
              n = e ? f.measureText(e).width || 1 : 0;
            return Math.min(46e3 / (a + n || 1), 175)
          }(t[0], t[1]);
          r.style.fontSize = a + "px", i.style.fontSize = a + "px"
        })(), m()
      }! function t() {
        n.clearRect(0, 0, 512, 512), n.fillStyle = "#1a1410";
        for (var e = h.length - 1; e >= 0; e--) {

          if (a.x += a.vx, a.y += a.vy, a.vx *= .93, a.vy *= .93, a.vy += .1, a.life -= a.decay, a.size *= a.grow, a.life <= 0) h.splice(e, 1);

  </script>
</body>

</html>
