<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Brutal Slap 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #111;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, sans-serif
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #ffeb3b;
      border: 6px solid #000;
      box-shadow: 12px 12px 0 #000;
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0, transparent 48%, #ff4081 48%, #ff4081 52%, transparent 52%);
      z-index: 0
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 0, 0, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 0, 0, .06) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 1;
      pointer-events: none
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Archivo Black', sans-serif;
      font-weight: 900;
      letter-spacing: -.04em;
      white-space: nowrap;
      line-height: .85;
      z-index: 5;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform
    }

    .stage.run .word-left .fly {
      animation: slapLeft .42s cubic-bezier(.34, 1.56, .64, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: slapRight .42s cubic-bezier(.34, 1.56, .64, 1) forwards
    }

    @keyframes slapLeft {
      0% {
        transform: translate(-512px, 0) rotate(-18deg) scale(1.4);
        opacity: 0
      }

      60% {
        opacity: 1
      }

      100% {
        transform: translate(14px, 0) rotate(0) scale(1);
        opacity: 1
      }
    }

    @keyframes slapRight {
      0% {
        transform: translate(512px, 0) rotate(18deg) scale(1.4);
        opacity: 0
      }

      60% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0) rotate(0) scale(1);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      color: #000;
      -webkit-text-stroke: 0;
      text-shadow: 4px 4px 0 rgba(0, 0, 0, .15);
      will-change: transform, filter
    }

    .stage.impact .word-text {
      animation: brutalRecoil .45s cubic-bezier(.34, 1.56, .64, 1), stickerSettle .6s ease-out .1s forwards
    }

    @keyframes brutalRecoil {
      0% {
        transform: scale(1.25) rotate(-2deg)
      }

      40% {
        transform: scale(.92) rotate(1deg)
      }

      100% {
        transform: scale(1) rotate(0)
      }
    }

    @keyframes stickerSettle {
      0% {
        text-shadow: 4px 4px 0 rgba(0, 0, 0, .15)
      }

      100% {
        text-shadow: 6px 6px 0 #000
      }
    }

    .stage.impact {
      animation: brutalShake .5s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes brutalShake {

      0%,
      100% {
        transform: translate(0, 0) rotate(0)
      }

      10% {
        transform: translate(-10px, 8px) rotate(-1deg)
      }

      20% {
        transform: translate(10px, -8px) rotate(1deg)
      }

      30% {
        transform: translate(-8px, 6px) rotate(-.7deg)
      }

      40% {
        transform: translate(8px, -6px) rotate(.7deg)
      }

      55% {
        transform: translate(-5px, 4px)
      }

      75% {
        transform: translate(4px, -3px)
      }

      90% {
        transform: translate(-2px, 1px)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: overlay
    }

    .stage.impact .flash {
      animation: brutalFlash .4s ease-out
    }

    @keyframes brutalFlash {
      0% {
        opacity: 0
      }

      6% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .shock-block {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 6px solid #000;
      background: #00e5ff;
      transform: translate(-50%, -50%) scale(0) rotate(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 6px 6px 0 #000
    }

    .shock-block.s2 {
      background: #ff4081;
      box-shadow: -6px 6px 0 #000;
      animation-delay: .1s !important
    }

    .stage.impact .shock-block {
      animation: blockGrow .9s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes blockGrow {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(0);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(18) rotate(45deg);
        opacity: 0
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="shock-block"></div>
    <div class="shock-block s2"></div>
    <div class="flash"></div>
    <div class="grain"></div>
  </div>
