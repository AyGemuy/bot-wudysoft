<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Sakura Split 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #191114;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      border-radius: 6px;
      isolation: isolate;
      background: radial-gradient(circle at 80% 16%, rgba(255, 255, 255, .95) 0, rgba(255, 255, 255, 0) 42%), radial-gradient(circle at 14% 88%, rgba(255, 200, 220, .85) 0, rgba(255, 200, 220, 0) 52%), linear-gradient(158deg, #fff7f3 0, #fce7ee 48%, #f3d2e2 100%);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55), inset 0 0 60px rgba(190, 110, 150, .12)
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: .16;
      mix-blend-mode: multiply;
      z-index: 14;
      pointer-events: none
    }

    .moon {
      position: absolute;
      top: -56px;
      right: -56px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      z-index: 1;
      background: radial-gradient(circle at 42% 42%, #fff 0, #fff2f7 52%, rgba(255, 235, 245, 0) 72%);
      filter: blur(3px);
      animation: breathe 7.5s ease-in-out infinite
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1);
        opacity: .8
      }

      50% {
        transform: scale(1.09);
        opacity: 1
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      white-space: nowrap;
      line-height: .9;
      z-index: 6;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform, opacity, filter
    }

    .word-text {
      display: inline-block;
      color: #3d1f2e;
      text-shadow: 0 2px 14px rgba(214, 83, 126, .22);
      transform-origin: center 50%;
      will-change: transform, filter, opacity
    }

    .stage.run .word-left .fly {
      animation: flyL .85s cubic-bezier(.2, .9, .25, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: flyR .85s cubic-bezier(.2, .9, .25, 1) forwards
    }

    @keyframes flyL {
      0% {
        transform: translate(-150px, 14px) rotate(-9deg);
        filter: blur(12px);
        opacity: 0
      }

      40% {
        opacity: 1
      }

      100% {
        transform: translate(0, 0) rotate(0);
        filter: blur(0);
        opacity: 1
      }
    }

    @keyframes flyR {
      0% {
        transform: translate(150px, -14px) rotate(9deg);
        filter: blur(12px);
        opacity: 0
      }

      40% {
        opacity: 1
      }

      100% {
        transform: translate(0, 0) rotate(0);
        filter: blur(0);
        opacity: 1
      }
    }

    .stage.impact .word-left .word-text {
      animation: splitL .95s cubic-bezier(.22, 1.2, .4, 1) forwards
    }

    .stage.impact .word-right .word-text {
      animation: splitR .95s cubic-bezier(.22, 1.2, .4, 1) forwards
    }

    @keyframes splitL {
      0% {
        transform: translate(0, 0) rotate(0) scale(1);
        filter: blur(0) brightness(1);
        opacity: 1
      }

      18% {
        transform: translate(0, 0) scale(1.07);
        filter: brightness(1.3);
        opacity: 1
      }

      100% {
        transform: translate(-38px, -12px) rotate(-2.5deg) scale(1);
        filter: blur(1.4px) brightness(1);
        opacity: .18
      }
    }

    @keyframes splitR {
      0% {
        transform: translate(0, 0) rotate(0) scale(1);
        filter: blur(0) brightness(1);
        opacity: 1
      }

      18% {
        transform: translate(0, 0) scale(1.07);
        filter: brightness(1.3);
        opacity: 1
      }

      100% {
        transform: translate(38px, 12px) rotate(2.5deg) scale(1);
        filter: blur(1.4px) brightness(1);
        opacity: .18
      }
    }

    .bloom {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 340px;
      height: 340px;
      margin: -170px 0 0 -170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .95) 0, rgba(255, 205, 226, .65) 38%, rgba(255, 205, 226, 0) 70%);
      opacity: 0;
      transform: scale(.4);
      pointer-events: none;
      z-index: 4
    }

    .stage.impact .bloom {
      animation: bloom .95s ease-out forwards
    }

    @keyframes bloom {
      0% {
        transform: scale(.4);
        opacity: 0
      }

      25% {
        transform: scale(1);
        opacity: .95
      }

      100% {
        transform: scale(1.55);
        opacity: 0
      }
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 1.5px solid rgba(214, 83, 126, .55);
      transform: scale(.15);
      opacity: 0;
      pointer-events: none;
      z-index: 8
    }

    .ring-2 {
      border-width: 1px;
      border-color: rgba(255, 255, 255, .9)
    }

    .stage.impact .ring {
      animation: ripple 1.15s cubic-bezier(.2, .7, .3, 1) forwards
    }

    .stage.impact .ring-2 {
      animation: ripple 1.35s cubic-bezier(.2, .7, .3, 1) .12s forwards
    }

    @keyframes ripple {
      0% {
        transform: scale(.15);
        opacity: 0
      }

      14% {
        opacity: .95
      }

      100% {
        transform: scale(6.2);
        opacity: 0
      }
    }

    .sheen {
      position: absolute;
      left: -10%;
      right: -10%;
      top: 50%;
      height: 2px;
      transform: translateY(-50%) scaleX(0);
      transform-origin: center;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      filter: blur(.6px);
      background: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, .95) 22%, #ffc7dd 50%, rgba(255, 255, 255, .95) 78%, transparent 100%);
      box-shadow: 0 0 24px rgba(255, 150, 185, .95), 0 0 64px rgba(255, 195, 220, .8)
    }

    .stage.impact .sheen {
      animation: sheen .78s cubic-bezier(.25, .8, .35, 1) forwards
    }

    @keyframes sheen {
      0% {
        transform: translateY(-50%) scaleX(0);
        opacity: 0
      }

      20% {
        opacity: 1
      }

      100% {
        transform: translateY(-50%) scaleX(1);
        opacity: 0
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      mix-blend-mode: overlay
    }

    .stage.impact .flash {
      animation: flash .2s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      45% {
        opacity: .85
      }

      100% {
        opacity: 0
      }
    }

    .stage.impact {
      animation: softShake .5s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes softShake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      35% {
        transform: translate(2px, -2px) rotate(.25deg)
      }

      70% {
        transform: translate(-2px, 2px) rotate(-.25deg)
      }
    }

    .badge {
      position: absolute;
      bottom: 26px;
      right: 26px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #d6537e;
      font-family: 'Shippori Mincho', serif;
      font-size: 24px;
      line-height: 1;
      z-index: 12;
      box-shadow: 0 6px 18px rgba(214, 83, 126, .28), inset 0 0 0 1px rgba(214, 83, 126, .16);
      animation: badgeFloat 5s ease-in-out infinite
    }

    @keyframes badgeFloat {

      0%,
      100% {
        transform: translateY(0) rotate(-5deg)
      }

      50% {
        transform: translateY(-5px) rotate(5deg)
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20
    }
  </style>
</head>

<body>

  <div class="stage" id="stage">
    <div class="moon"></div>
    <div class="bloom"></div>
    <div class="ring"></div>
    <div class="ring ring-2"></div>
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="sheen"></div>
    <div class="flash"></div>
    <div class="badge">花</div>
  </div>

</html>
