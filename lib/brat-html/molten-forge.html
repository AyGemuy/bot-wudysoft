<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Molten Forge 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #030202;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      border-radius: 4px;
      isolation: isolate;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .92), 0 0 0 1px rgba(255, 140, 40, .06) inset
    }

    .bg-base {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at 50% 110%, #2a0a02 0, #100302 55%, #050101 100%)
    }

    .coal {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .35;
      background-image: repeating-linear-gradient(37deg, rgba(255, 90, 20, .04) 0 2px, transparent 2px 8px), repeating-linear-gradient(-37deg, rgba(255, 90, 20, .035) 0 2px, transparent 2px 7px), repeating-linear-gradient(0deg, rgba(0, 0, 0, .5) 0 1px, transparent 1px 3px)
    }

    .fire-glow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 65%;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 100%, rgba(255, 110, 25, .42) 0, rgba(255, 60, 10, .18) 40%, rgba(255, 30, 0, 0) 72%);
      animation: fireFlicker 3.2s ease-in-out infinite alternate
    }

    @keyframes fireFlicker {
      0% {
        opacity: .75;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.04)
      }

      100% {
        opacity: .85;
        transform: scale(1.02) translateY(-2px)
      }
    }

    .heat-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 240px;
      margin: -120px 0 0 -210px;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(255, 160, 60, .18) 0, rgba(255, 100, 20, .08) 40%, transparent 68%);
      filter: blur(18px);
      animation: heatPulse 3.6s ease-in-out infinite
    }

    @keyframes heatPulse {

      0%,
      100% {
        opacity: .5;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.08)
      }
    }

    .cracks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(255, 100, 20, .9)) drop-shadow(0 0 12px rgba(255, 60, 0, .5));
      animation: crackPulse 3s ease-in-out infinite
    }

    @keyframes crackPulse {

      0%,
      100% {
        opacity: .55
      }

      50% {
        opacity: .95
      }
    }

    .ember-field {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden
    }

    .ember {
      position: absolute;
      bottom: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0, #fc4 35%, #ff6b1a 70%, #f20 100%);
      box-shadow: 0 0 6px #ff8a2a, 0 0 12px rgba(255, 80, 20, .6);
      opacity: 0;
      animation-name: emberRise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform, opacity
    }

    @keyframes emberRise {
      0% {
        transform: translate(0, 0);
        opacity: 0
      }

      8% {
        opacity: .95
      }

      15% {
        opacity: .5
      }

      22% {
        opacity: 1
      }

      85% {
        opacity: .7
      }

      100% {
        transform: translate(var(--drift), -560px);
        opacity: 0
      }
    }

    .bolt {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      z-index: 12;
      background: radial-gradient(circle at 35% 32%, #6a6a75 0, #3a3a45 30%, #1a1a22 65%, #050505 100%);
      box-shadow: 0 0 0 1px rgba(255, 140, 40, .18), 0 2px 4px rgba(0, 0, 0, .9), inset 0 -1px 1px rgba(255, 255, 255, .12)
    }

    .bolt.tl {
      top: 22px;
      left: 22px
    }

    .bolt.tr {
      top: 22px;
      right: 22px
    }

    .bolt.bl {
      bottom: 22px;
      left: 22px
    }

    .bolt.br {
      bottom: 22px;
      right: 22px
    }

    .word-wrap {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 0 44px;
      pointer-events: none
    }

    .word {
      font-family: Anton, sans-serif;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      line-height: .95;
      letter-spacing: .012em
    }

    .letter {
      display: inline-block;
      background: linear-gradient(180deg, #fff5d6 0, #ffd47a 14%, #fa4 32%, #ff6b1a 55%, #d43200 78%, #8a0f00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 0.6px rgba(255, 190, 100, .32);
      filter: drop-shadow(0 0 14px rgba(255, 130, 30, .55)) drop-shadow(0 0 32px rgba(255, 90, 20, .3)) drop-shadow(0 3px 4px rgba(0, 0, 0, .9));
      opacity: 0;
      transform: scale(.3) rotateZ(-18deg);
      transform-origin: center;
      will-change: transform, opacity;
      backface-visibility: hidden
    }

    .space {
      display: inline-block;
      width: .34em
    }

    .stage.run .letter {
      animation: letterForge .65s cubic-bezier(.2, 1.25, .3, 1) forwards, letterHeat 2.6s ease-in-out infinite;
      animation-delay: var(--d), calc(var(--d) + .85s)
    }

    @keyframes letterForge {
      0% {
        opacity: 0;
        transform: scale(.3) rotateZ(-18deg)
      }

      60% {
        opacity: 1
      }

      100% {
        opacity: 1;
        transform: scale(1) rotateZ(0)
      }
    }

    @keyframes letterHeat {

      0%,
      100% {
        transform: scale(1) translateY(0)
      }

      50% {
        transform: scale(1.025) translateY(-1.5px)
      }
    }

    .stage.impact .letter {
      animation: letterMelt .7s cubic-bezier(.4, 0, .3, 1) both;
      animation-delay: calc(.4s + var(--d) * .5)
    }

    @keyframes letterMelt {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0)
      }

      22% {
        opacity: 1;
        transform: scale(1.14) translateY(-4px)
      }

      100% {
        opacity: 0;
        transform: scale(.65) translateY(-44px)
      }
    }

    .hammer {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100px;
      height: 120px;
      margin-left: -50px;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-140px);
      will-change: transform, opacity
    }

    .hammer svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .8))
    }

    .stage.impact .hammer {
      animation: hammerStrike 1.2s cubic-bezier(.55, 0, .55, 1)
    }

    @keyframes hammerStrike {
      0% {
        transform: translateY(-140px);
        opacity: 0
      }

      10% {
        opacity: 1
      }

      40% {
        transform: translateY(190px)
      }

      50% {
        transform: translateY(190px)
      }

      100% {
        transform: translateY(-140px);
        opacity: 0
      }
    }

    .sparks {
      position: absolute;
      inset: 0;
      z-index: 16;
      pointer-events: none;
      overflow: hidden
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0, #fd7 30%, #ff6b1a 65%, #f20 100%);
      box-shadow: 0 0 8px #fa4, 0 0 18px rgba(255, 80, 20, .6);
      opacity: 0;
      will-change: transform, opacity
    }

    .stage.impact .spark {
      animation: sparkFly 1s cubic-bezier(.15, .6, .3, 1) forwards;
      animation-delay: calc(.4s + var(--delay, 0s))
    }

    @keyframes sparkFly {
      0% {
        transform: translate(-50%, -50%) scale(.6);
        opacity: 1
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(.2);
        opacity: 0
      }
    }

    .shock {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 70px;
      height: 70px;
      margin: -35px 0 0 -35px;
      border: 2px solid rgba(255, 180, 90, .92);
      border-radius: 50%;
      box-shadow: 0 0 42px rgba(255, 150, 40, .7), inset 0 0 32px rgba(255, 150, 40, .4);
      opacity: 0;
      z-index: 14;
      pointer-events: none
    }

    .stage.impact .shock {
      animation: shockOut .9s cubic-bezier(.2, .8, .3, 1) .4s forwards
    }

    @keyframes shockOut {
      0% {
        opacity: 0;
        transform: scale(.2)
      }

      14% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: scale(6.2)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 245, 210, .98) 0, rgba(255, 160, 60, .62) 18%, rgba(255, 80, 20, .28) 38%, transparent 62%)
    }

    .stage.impact .flash {
      animation: flashPop .5s ease-out .38s
    }

    @keyframes flashPop {
      0% {
        opacity: 0
      }

      22% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .stage.impact {
      animation: shake .5s cubic-bezier(.36, .07, .19, .97) .38s
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      20% {
        transform: translate(3px, -2px) rotate(.22deg)
      }

      40% {
        transform: translate(-3px, 2px) rotate(-.22deg)
      }

      60% {
        transform: translate(3px, -1px) rotate(.15deg)
      }

      80% {
        transform: translate(-2px, 1px) rotate(-.1deg)
      }
    }

    .plate {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      background: linear-gradient(180deg, #1a1410 0, #0a0705 100%);
      border: 1px solid rgba(255, 140, 40, .28);
      border-radius: 3px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 140, 40, .12);
      font-family: Oswald, sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: .32em;
      color: rgba(255, 175, 85, .85);
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap
    }

    .plate i {
      display: block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ff6b1a;
      box-shadow: 0 0 6px #ff6b1a
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 22;
      pointer-events: none;
      box-shadow: inset 0 0 130px rgba(0, 0, 0, .92)
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 23;
      pointer-events: none;
      opacity: .09;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="bg-base"></div>
    <div class="coal"></div>
    <div class="fire-glow"></div>
    <div class="heat-glow"></div><svg class="cracks" viewBox="0 0 512 512" preserveAspectRatio="none">
      <path d="M 8 72 L 56 102 L 104 84 L 158 122 L 214 96" stroke="#ff6b1a" stroke-width="1.4" fill="none" stroke-linecap="round" />

      <path d="M 20 430 L 68 402 L 112 442 L 168 412 L 220 444" stroke="#ff5511" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <path d="M 340 458 L 388 428 L 430 468 L 478 438 L 504 462" stroke="#ff5511" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <path d="M 256 500 L 268 468 L 246 440" stroke="#ff6b1a" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <path d="M 500 200 L 470 224 L 482 258" stroke="#ff6b1a" stroke-width="1.2" fill="none" stroke-linecap="round" />
    </svg>
    <div class="ember-field" id="embers"></div>
    <div class="bolt tl"></div>
    <div class="bolt tr"></div>
    <div class="bolt bl"></div>
    <div class="bolt br"></div>

        <defs>

          <linearGradient id="mGrad" x1="0" y1="0" x2="0" y2="1">

          </linearGradient>
        </defs>
        <rect x="43" y="28" width="14" height="86" fill="url(#hGrad)" rx="2" />
        <rect x="12" y="8" width="76" height="36" fill="url(#mGrad)" rx="4" />
        <rect x="12" y="22" width="76" height="3" fill="#000" opacity=".35" />
        <rect x="12" y="8" width="76" height="2" fill="#fff" opacity=".35" />
        <rect x="10" y="6" width="80" height="2" fill="#ff8a2a" opacity=".4" />
      </svg></div>
    <div class="sparks" id="sparks"></div>
    <div class="shock"></div>
    <div class="flash"></div>
    <div class="plate"><span>Forged</span><i></i><span>1600&deg;C</span><i></i><span>Steel</span></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  </script>
</body>
