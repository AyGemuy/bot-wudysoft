<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Iron Garage 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #050508;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      border-radius: 4px;
      isolation: isolate;
      background: #0a0a0f;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .03) inset
    }

    .weave {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-color: #0d0d12;
      background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 5px), repeating-linear-gradient(-45deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 5px);
      background-size: 11px 11px
    }

    .spot {
      position: absolute;
      width: 220px;
      height: 220px;
      z-index: 1;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 20, .16) 0, transparent 65%)
    }

    .spot-tl {
      top: -70px;
      left: -70px
    }

    .spot-br {
      bottom: -70px;
      right: -70px
    }

    .sweep {
      position: absolute;
      inset: -50%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 44%, rgba(255, 200, 100, .05) 49%, rgba(255, 200, 100, .12) 50%, rgba(255, 200, 100, .05) 51%, transparent 56%);
      animation: sweepMove 6s linear infinite
    }

    @keyframes sweepMove {
      0% {
        transform: translateX(-30%) translateY(-30%)
      }

      100% {
        transform: translateX(30%) translateY(30%)
      }
    }

    .gear {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      color: #1e1e28;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, .8))
    }

    .gear-1 {
      top: -30px;
      right: -30px;
      width: 180px;
      height: 180px;
      animation: spin 24s linear infinite
    }

    .gear-2 {
      bottom: -50px;
      left: -50px;
      width: 220px;
      height: 220px;
      animation: spin 32s linear infinite reverse
    }

    @keyframes spin {
      from {
        transform: rotate(0)
      }

      to {
        transform: rotate(360deg)
      }
    }

    .hazard-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 14px;
      z-index: 8;
      background: repeating-linear-gradient(45deg, #f2a900 0 10px, #0a0a0f 10px 20px);
      background-size: 28px 28px;
      animation: hazardScroll 1.5s linear infinite
    }

    @keyframes hazardScroll {
      from {
        background-position: 0 0
      }

      to {
        background-position: 28px 0
      }
    }

    .rivet {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      z-index: 9;
      background: radial-gradient(circle at 35% 35%, #555 0, #222 45%, #0a0a0f 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 1px 2px rgba(0, 0, 0, .8), inset 0 -1px 1px rgba(255, 255, 255, .1)
    }

    .rivet.tl {
      top: 26px;
      left: 26px
    }

    .rivet.tr {
      top: 26px;
      right: 26px
    }

    .rivet.bl {
      bottom: 26px;
      left: 26px
    }

    .rivet.br {
      bottom: 26px;
      right: 26px
    }

    .warn {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 2px;
      background: #1a0a00;
      border: 1px solid rgba(242, 169, 0, .4);
      font-family: Oswald, sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: .3em;
      color: #f2a900;
      text-transform: uppercase
    }

    .warn::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 8px #ff3b30;
      animation: blink 1s ease-in-out infinite
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .2
      }
    }

    .text-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 380px;
      height: 200px;
      margin: -100px 0 0 -190px;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse, rgba(242, 169, 0, .18) 0, transparent 65%);
      filter: blur(20px);
      animation: glowPulse 3s ease-in-out infinite
    }

    @keyframes glowPulse {

      0%,
      100% {
        opacity: .5;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.08)
      }
    }

    .word-wrap {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 0 40px;
      pointer-events: none
    }

    .word {
      font-family: Anton, sans-serif;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      line-height: .95;
      letter-spacing: .01em
    }

    .letter {
      display: inline-block;
      background: linear-gradient(180deg, #6a6a78 0, #c8c8d4 12%, #fff 28%, #a8a8b8 45%, #fff 52%, #6a6a78 68%, #2a2a35 85%, #1a1a24 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      -webkit-text-stroke: 0.5px rgba(255, 140, 20, .18);
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .75)) drop-shadow(0 0 20px rgba(242, 169, 0, .18));
      opacity: 0;
      transform: translateY(38px) scale(.7) rotateX(-45deg);
      transform-origin: center bottom;
      will-change: transform, opacity;
      backface-visibility: hidden
    }

    .space {
      display: inline-block;
      width: .35em
    }

    .stage.run .letter {
      animation: letterSlam .55s cubic-bezier(.2, 1.2, .3, 1) forwards, letterPulse 2.6s ease-in-out infinite;
      animation-delay: var(--d), calc(var(--d) + .7s)
    }

    @keyframes letterSlam {
      0% {
        opacity: 0;
        transform: translateY(38px) scale(.7) rotateX(-45deg)
      }

      60% {
        opacity: 1
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0)
      }
    }

    @keyframes letterPulse {

      0%,
      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .75)) drop-shadow(0 0 20px rgba(242, 169, 0, .18))
      }

      50% {
        transform: translateY(-2px) scale(1.006);
        filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .75)) drop-shadow(0 0 28px rgba(242, 169, 0, .35))
      }
    }

    .stage.impact .letter {
      animation: letterFire .7s cubic-bezier(.55, 0, .35, 1) forwards;
      animation-delay: var(--d)
    }

    @keyframes letterFire {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0);
        filter: drop-shadow(0 0 20px rgba(242, 169, 0, .3))
      }

      22% {
        opacity: 1;
        transform: translateY(-4px) scale(1.14) rotateX(0);
        filter: drop-shadow(0 0 60px rgba(255, 140, 20, .95))
      }

      100% {
        opacity: 0;
        transform: translateY(-50px) scale(.6) rotateX(60deg);
        filter: drop-shadow(0 0 30px rgba(255, 80, 20, .5))
      }
    }

    .rev {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 36px;
      height: 10px;
      z-index: 9;
      background: #14141c;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .85);
      pointer-events: none
    }

    .rev::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, transparent 0, transparent 11px, rgba(0, 0, 0, .55) 11px, rgba(0, 0, 0, .55) 12px)
    }

    .rev-fill {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #4ade80 0, #fbbf24 55%, #f97316 78%, #ef4444 100%);
      transform: scaleX(0);
      transform-origin: left center;
      box-shadow: 0 0 12px rgba(242, 169, 0, .55);
      will-change: transform
    }

    .stage.run .rev-fill {
      animation: revFill var(--runTime, 3000ms) cubic-bezier(.5, 0, .7, 1) forwards
    }

    @keyframes revFill {
      0% {
        transform: scaleX(0)
      }

      60% {
        transform: scaleX(.6)
      }

      90% {
        transform: scaleX(.95)
      }

      100% {
        transform: scaleX(1)
      }
    }

    #risers {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden
    }

    .riser {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #ffa040;
      box-shadow: 0 0 5px #ff6b00;
      opacity: 0;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite
    }

    @keyframes rise {
      0% {
        transform: translateY(0);
        opacity: 0
      }

      15% {
        opacity: .9
      }

      85% {
        opacity: .55
      }

      100% {
        transform: translateY(-460px);
        opacity: 0
      }
    }

    .sparks {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none
    }

    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0, #ffd166 40%, #ff3b30 100%);
      box-shadow: 0 0 8px #ff6b00, 0 0 16px rgba(255, 80, 0, .5);
      opacity: 0;
      will-change: transform, opacity
    }

    .stage.impact .spark {
      animation: sparkFly .9s cubic-bezier(.2, .6, .3, 1) forwards;
      animation-delay: var(--delay, 0s)
    }

    @keyframes sparkFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1
      }

      40% {
        opacity: 1
      }

      100% {
        transform: translate(var(--tx), var(--ty)) scale(.3);
        opacity: 0
      }
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 80px;
      height: 80px;
      margin: -40px 0 0 -40px;
      border-radius: 50%;
      border: 2px solid rgba(242, 169, 0, .85);
      box-shadow: 0 0 30px rgba(242, 169, 0, .6), inset 0 0 24px rgba(242, 169, 0, .3);
      opacity: 0;
      z-index: 14;
      pointer-events: none
    }

    .stage.impact .ring {
      animation: ringOut 1s cubic-bezier(.2, .8, .3, 1) forwards
    }

    @keyframes ringOut {
      0% {
        opacity: 0;
        transform: scale(.2)
      }

      15% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: scale(5.5)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 200, 100, .9) 0, rgba(255, 80, 20, .35) 30%, transparent 62%)
    }

    .stage.impact .flash {
      animation: flashPop .4s ease-out
    }

    @keyframes flashPop {
      0% {
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .stage.impact {
      animation: shake .45s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      25% {
        transform: translate(3px, -2px) rotate(.2deg)
      }

      50% {
        transform: translate(-3px, 2px) rotate(-.2deg)
      }

      75% {
        transform: translate(2px, -1px) rotate(.1deg)
      }
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 22;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(0, 0, 0, .85)
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 23;
      pointer-events: none;
      opacity: .09;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")
    }
  </style>
</head>

<body>

  <div class="stage" id="stage">
    <div class="weave"></div>
    <div class="spot spot-tl"></div>
    <div class="spot spot-br"></div>
    <div class="sweep"></div><svg class="gear gear-1" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="#14141c" stroke="#25252f" stroke-width="1" />
      <g fill="#25252f">
        <rect x="46" y="3" width="8" height="9" />
        <rect x="46" y="88" width="8" height="9" />
        <rect x="3" y="46" width="9" height="8" />
        <rect x="88" y="46" width="9" height="8" />
      </g>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#1c1c24" stroke-width="1.5" />
      <circle cx="50" cy="50" r="12" fill="none" stroke="#1c1c24" stroke-width="1.5" />
      <circle cx="50" cy="50" r="4" fill="#25252f" />
    </svg> <svg class="gear gear-2" viewBox="0 0 100 100">

      <g fill="#25252f">
        <rect x="46" y="3" width="8" height="9" />
        <rect x="46" y="88" width="8" height="9" />
        <rect x="3" y="46" width="9" height="8" />
        <rect x="88" y="46" width="9" height="8" />
        <rect x="13" y="13" width="8" height="8" transform="rotate(45 17 17)" />
        <rect x="79" y="13" width="8" height="8" transform="rotate(45 83 17)" />
        <rect x="13" y="79" width="8" height="8" transform="rotate(45 17 83)" />
        <rect x="79" y="79" width="8" height="8" transform="rotate(45 83 83)" />
      </g>
      <circle cx="50" cy="50" r="24" fill="none" stroke="#1c1c24" stroke-width="1.5" />
      <circle cx="50" cy="50" r="12" fill="none" stroke="#1c1c24" stroke-width="1.5" />
      <circle cx="50" cy="50" r="4" fill="#25252f" />
    </svg>
    <div class="hazard-top"></div>
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>
    <div class="warn">Caution</div>
    <div class="text-glow"></div>
    <div class="word-wrap">
      <div class="word" id="word"></div>
    </div>
    <div id="risers"></div>
    <div class="sparks" id="sparks"></div>
    <div class="ring"></div>
    <div class="flash"></div>
    <div class="rev"><span class="rev-fill"></span></div>
  </div>
