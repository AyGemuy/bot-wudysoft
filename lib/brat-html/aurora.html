<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Liquid Holographic Impact 512</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --pink: #ff5f9e;
      --purple: #a855f7;
      --blue: #60a5fa;
      --cyan: #22d3ee;
      --mint: #34d399;
      --amber: #fbbf24
    }

    body,
    html {
      height: 100%;
      background: #08060f;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0f0a1e 0, #08060f 70%);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 0 100px rgba(168, 85, 247, .15), 0 0 60px rgba(34, 211, 238, .08), inset 0 0 120px rgba(168, 85, 247, .05);
      isolation: isolate
    }

    .aurora {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .55;
      mix-blend-mode: screen;
      will-change: transform
    }

    .b1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--pink), transparent 70%);
      top: -120px;
      left: -140px;
      animation: drift1 14s ease-in-out infinite
    }

    .b2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      top: -100px;
      right: -160px;
      animation: drift2 17s ease-in-out infinite
    }

    .b3 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--purple), transparent 70%);
      bottom: -180px;
      left: 50%;
      transform: translateX(-50%);
      animation: drift3 20s ease-in-out infinite
    }

    @keyframes drift1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1)
      }

      50% {
        transform: translate(60px, 40px) scale(1.15)
      }
    }

    @keyframes drift2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1)
      }

      50% {
        transform: translate(-70px, 60px) scale(1.1)
      }
    }

    @keyframes drift3 {

      0%,
      100% {
        transform: translateX(-50%) translateY(0) scale(1)
      }

      50% {
        transform: translateX(-50%) translateY(-50px) scale(1.2)
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -.02em;
      white-space: nowrap;
      line-height: 1;
      will-change: transform;
      z-index: 5
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform
    }

    .stage.run .word-left .fly {
      animation: flyLeft .55s cubic-bezier(.55, 0, .35, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: flyRight .55s cubic-bezier(.55, 0, .35, 1) forwards
    }

    @keyframes flyLeft {
      0% {
        transform: translate(-512px, 0);
        opacity: 0
      }

      25% {
        opacity: 1
      }

      100% {
        transform: translate(14px, 0);
        opacity: 1
      }
    }

    @keyframes flyRight {
      0% {
        transform: translate(512px, 0);
        opacity: 0
      }

      25% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      background: linear-gradient(90deg, var(--pink) 0, var(--purple) 18%, var(--blue) 36%, var(--cyan) 54%, var(--mint) 72%, var(--pink) 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 95, 158, .45)) drop-shadow(0 0 40px rgba(168, 85, 247, .3));
      animation: hologram 4s linear infinite;
      will-change: background-position, transform, filter
    }

    @keyframes hologram {
      0% {
        background-position: 0 50%
      }

      100% {
        background-position: 300% 50%
      }
    }

    .stage.impact .word-text {
      animation: hologram 4s linear infinite, recoil .5s cubic-bezier(.34, 1.56, .64, 1), chromeFlash .55s ease-out
    }

    @keyframes recoil {
      0% {
        transform: scale(1.22)
      }

      45% {
        transform: scale(.94)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes chromeFlash {
      0% {
        filter: drop-shadow(0 0 50px rgba(255, 255, 255, 1)) drop-shadow(0 0 80px rgba(255, 220, 255, .9)) brightness(2.2) saturate(1.6)
      }

      60% {
        filter: drop-shadow(0 0 30px rgba(255, 95, 158, .8)) drop-shadow(0 0 60px rgba(168, 85, 247, .6)) brightness(1.5) saturate(1.3)
      }

      100% {
        filter: drop-shadow(0 0 18px rgba(255, 95, 158, .45)) drop-shadow(0 0 40px rgba(168, 85, 247, .3)) brightness(1) saturate(1)
      }
    }

    .stage.impact {
      animation: stagePulse .6s ease-out
    }

    @keyframes stagePulse {
      0% {
        transform: scale(1)
      }

      25% {
        transform: scale(1.03)
      }

      60% {
        transform: scale(.99)
      }

      100% {
        transform: scale(1)
      }
    }

    .ripple {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 12
    }

    .r1 {
      border: 3px solid rgba(255, 95, 158, .9);
      box-shadow: 0 0 40px rgba(255, 95, 158, .8), inset 0 0 30px rgba(255, 95, 158, .5)
    }

    .r2 {
      border: 3px solid rgba(34, 211, 238, .9);
      box-shadow: 0 0 40px rgba(34, 211, 238, .8), inset 0 0 30px rgba(34, 211, 238, .5);
      animation-delay: .15s !important
    }

    .r3 {
      border: 3px solid rgba(168, 85, 247, .9);
      box-shadow: 0 0 40px rgba(168, 85, 247, .8), inset 0 0 30px rgba(168, 85, 247, .5);
      animation-delay: .3s !important
    }

    .stage.impact .ripple {
      animation: rippleGrow 1.2s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes rippleGrow {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 8px
      }

      100% {
        transform: translate(-50%, -50%) scale(26);
        opacity: 0;
        border-width: 1px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .55) 100%)
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="aurora">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
