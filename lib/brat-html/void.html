<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Void Collapse 512</title>

      margin: 0;
      padding: 0

      background: #000;

      place-items: center;
      overflow: hidden

    .stage {

      height: 512px;
      overflow: hidden;

      100% {

      50% {

      }
    }

      z-index: 5;

      transform: translate(0, -50%)

        opacity: 0

        filter: blur(0);
        opacity: 1
      }
    }

    @keyframes flyR {
      0% {
        transform: translate(512px, 0);
        filter: blur(8px);
        opacity: 0
      }

      30% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0);
        filter: blur(0);
        opacity: 1
      }
    }

    .word-text {

      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(160, 100, 255, .7));
      will-change: opacity
    }

    .stage.impact .word-text {
      animation: collapse .75s cubic-bezier(.65, 0, .35, 1) forwards
    }

    @keyframes collapse {
      0% {
        opacity: 1
      }

      15% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .stage.impact {
      animation: voidPulse 1.4s ease-out
    }

    @keyframes voidPulse {
      0% {
        transform: scale(1)
      }

      30% {
        transform: scale(.96)
      }

      55% {
        transform: scale(1.08)
      }

      100% {
        transform: scale(1)
      }
    }

    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(circle, #fff 0, #d8b0ff 30%, #8840ff 60%, transparent 100%);
      box-shadow: 0 0 60px #8840ff, 0 0 120px #50c, 0 0 200px #206;
      pointer-events: none;
      z-index: 45
    }

    .stage.impact .core {
      animation: coreLife 1.4s cubic-bezier(.4, 0, .6, 1) forwards
    }

    @keyframes coreLife {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0
      }

      30% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1
      }

      55% {
        transform: translate(-50%, -50%) scale(4);
        opacity: 1
      }

      70% {
        transform: translate(-50%, -50%) scale(30);
        opacity: .8
      }

      100% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #fff 0, #d8b0ff 20%, transparent 55%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen
    }

    .stage.impact .flash {
      animation: flash 1.4s ease-out
    }

    @keyframes flash {

      0%,
      60% {
        opacity: 0
      }

      68% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(200, 150, 255, .9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 42;
      box-shadow: 0 0 40px rgba(200, 150, 255, .9)
    }

    .ring.r2 {
      animation-delay: .1s !important
    }

    .stage.impact .ring {
      animation: ringOut 1.2s cubic-bezier(.2, .8, .4, 1) .9s forwards
    }

    @keyframes ringOut {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 8px
      }

      100% {
        transform: translate(-50%, -50%) scale(28);
        opacity: 0;
        border-width: 1px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }
  </style>
</head>
