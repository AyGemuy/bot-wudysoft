<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Carbon Type</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #07070d;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      overflow: hidden;
      isolation: isolate;
      background: #07070d;
      box-shadow: 0 30px 100px rgba(0, 0, 0, .85)
    }

    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      filter: blur(70px);
      opacity: .55
    }

    .bg span {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen
    }

    .b1 {
      width: 320px;
      height: 320px;
      top: -40px;
      left: -50px;
      background: radial-gradient(circle, #3b2fdf 0, transparent 70%);
      animation: drift1 11s ease-in-out infinite
    }

    .b2 {
      width: 280px;
      height: 280px;
      bottom: -60px;
      right: -40px;
      background: radial-gradient(circle, #e0286f 0, transparent 70%);
      animation: drift2 13s ease-in-out infinite
    }

    .b3 {
      width: 220px;
      height: 220px;
      top: 45%;
      right: 30%;
      background: radial-gradient(circle, #00b894 0, transparent 70%);
      animation: drift1 15s ease-in-out infinite reverse
    }

    @keyframes drift1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1)
      }

      50% {
        transform: translate(50px, -30px) scale(1.15)
      }
    }

    @keyframes drift2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1.1)
      }

      50% {
        transform: translate(-40px, 30px) scale(.9)
      }
    }

    .window {
      position: relative;
      z-index: 2;
      width: 440px;
      border-radius: 14px;
      background: rgba(20, 20, 28, .85);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, .07);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .65), 0 1px 0 rgba(255, 255, 255, .06) inset, 0 0 0 1px rgba(0, 0, 0, .3);
      overflow: hidden;
      opacity: 0;
      transform: scale(.88) rotate(-2deg)
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      position: relative;
      background: rgba(255, 255, 255, .015)
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0)
    }

    .dot.red {
      background: #ff5f57;
      box-shadow: 0 0 6px rgba(255, 95, 87, .4)
    }

    .dot.yellow {
      background: #febc2e;
      box-shadow: 0 0 6px rgba(254, 188, 46, .4)
    }

    .dot.green {
      background: #28c840;
      box-shadow: 0 0 6px rgba(40, 200, 64, .4)
    }

    .title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, .32);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .05em;
      white-space: nowrap;
      opacity: 0
    }

    .content {
      padding: 30px 26px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 150px
    }

    .line-num {
      color: rgba(255, 255, 255, .14);
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      user-select: none;
      opacity: 0;
      transform: translateX(-8px);
      line-height: 1
    }

    .code-line {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
      overflow: hidden
    }

    .code {
      display: flex;
      align-items: center;
      white-space: nowrap;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700
    }

    .ch {
      display: inline-block;
      opacity: 0;
      color: #e5e5e5;
      will-change: transform, opacity, filter, color;
      backface-visibility: hidden
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: #61afef;
      margin-left: 3px;
      opacity: 0;
      box-shadow: 0 0 12px rgba(97, 175, 239, .9);
      border-radius: 1px;
      transform: translateY(1px)
    }

    .stage.run .window {
      animation: winIn .8s cubic-bezier(.2, .9, .3, 1.15) both
    }

    @keyframes winIn {
      0% {
        opacity: 0;
        transform: scale(.88) rotate(-2deg)
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0)
      }
    }

    .stage.run .dot {
      animation: dotPop .4s cubic-bezier(.34, 1.56, .64, 1) both
    }

    .stage.run .dot.red {
      animation-delay: .4s
    }

    .stage.run .dot.yellow {
      animation-delay: .5s
    }

    .stage.run .dot.green {
      animation-delay: .6s
    }

    @keyframes dotPop {
      0% {
        opacity: 0;
        transform: scale(0)
      }

      60% {
        opacity: 1;
        transform: scale(1.4)
      }

      100% {
        opacity: 1;
        transform: scale(1)
      }
    }

    .stage.run .title {
      animation: titleIn .5s ease-out .7s both
    }

    @keyframes titleIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.8)
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1)
      }
    }

    .stage.run .line-num {
      animation: lineIn .5s cubic-bezier(.34, 1.56, .64, 1) .85s both
    }

    @keyframes lineIn {
      0% {
        opacity: 0;
        transform: translateX(-8px)
      }

      100% {
        opacity: 1;
        transform: translateX(0)
      }
    }

    .stage.run .ch {
      animation: chIn .6s cubic-bezier(.34, 1.56, .64, 1) both;
      animation-delay: calc(var(--i) * 45ms + 950ms)
    }

    @keyframes chIn {
      0% {
        opacity: 0;
        transform: translateY(-16px) scale(1.6);
        filter: blur(6px) brightness(2)
      }

      55% {
        opacity: 1;
        filter: blur(0) brightness(1.3)
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0) brightness(1)
      }
    }

    .stage.settle .cursor {
      animation: cursorBlink .9s steps(1) infinite
    }

    @keyframes cursorBlink {

      0%,
      50% {
        opacity: 1
      }

      100%,
      51% {
        opacity: 0
      }
    }

    .shine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: linear-gradient(105deg, transparent 30%, rgba(97, 175, 239, 0) 40%, rgba(97, 175, 239, .18) 46%, rgba(255, 255, 255, .32) 50%, rgba(97, 175, 239, .18) 54%, rgba(97, 175, 239, 0) 60%, transparent 70%);
      transform: translateX(-140%);
      mix-blend-mode: screen
    }

    .stage.shining .shine {
      animation: shineSweep 1s cubic-bezier(.4, 0, .2, 1) forwards
    }

    @keyframes shineSweep {
      0% {
        transform: translateX(-140%)
      }

      100% {
        transform: translateX(140%)
      }
    }

    .ch.glitch {
      animation: colorGlitch .55s steps(2) both !important
    }

    @keyframes colorGlitch {
      0% {
        filter: brightness(1)
      }

      20% {
        filter: brightness(2.4) hue-rotate(50deg) saturate(2.2);
        text-shadow: -2px 0 #ff2f7d, 2px 0 #61afef
      }

      50% {
        filter: brightness(.55) saturate(.4);
        text-shadow: 3px 0 #00d4b4, -3px 0 #ff2f7d
      }

      80% {
        filter: brightness(1.9) hue-rotate(-35deg);
        text-shadow: -2px 0 #61afef, 2px 0 #ff2f7d
      }

      100% {
        filter: brightness(1);
        text-shadow: none
      }
    }

    .code.rgb {
      animation: rgbSplit .4s steps(2) both
    }

    @keyframes rgbSplit {
      0% {
        transform: translate(0);
        text-shadow: none
      }

      25% {
        transform: translate(-2px, 1px);
        text-shadow: 3px 0 rgba(255, 47, 125, .75), -3px 0 rgba(97, 175, 239, .75)
      }

      50% {
        transform: translate(2px, -1px);
        text-shadow: -3px 0 rgba(255, 47, 125, .75), 3px 0 rgba(97, 175, 239, .75)
      }

      75% {
        transform: translate(-1px, 0);
        text-shadow: 2px 0 rgba(97, 175, 239, .75), -2px 0 rgba(255, 47, 125, .75)
      }

      100% {
        transform: translate(0);
        text-shadow: none
      }
    }

    .stage.settle .code-line {
      animation: floatLine 4s ease-in-out infinite
    }

    @keyframes floatLine {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-2px)
      }
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="bg"><span class="b1"></span> <span class="b2"></span> <span class="b3"></span></div>
    <div class="window" id="win">
      <div class="titlebar"><span class="dot red"></span> <span class="dot yellow"></span> <span class="dot green"></span> <span class="title">snippet.ts — carbon.sh</span></div>
      <div class="content"><span class="line-num">1</span>
        <div class="code-line">
          <div class="code" id="code"></div><span class="cursor"></span>
        </div>
      </div>
    </div>
    <div class="shine"></div>
  </div>

</html>
