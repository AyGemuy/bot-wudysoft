<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>8-Bit Pixel Explosion 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #0a0a1e;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #0a0a1e;
      border-radius: 8px;
      border: 4px solid #1a1a3e;
      box-shadow: 0 0 80px rgba(0, 255, 240, .15), inset 0 0 100px rgba(0, 0, 0, .6);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 255, 240, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 240, .06) 1px, transparent 1px);
      background-size: 16px 16px;
      z-index: 1;
      pointer-events: none
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0, 0, 0, .25) 2px, rgba(0, 0, 0, .25) 3px);
      z-index: 22;
      pointer-events: none
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      letter-spacing: .02em;
      white-space: nowrap;
      line-height: 1.1;
      z-index: 5;
      will-change: transform;
      image-rendering: pixelated
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform, filter, opacity
    }

    .stage.run .word-left .fly {
      animation: pixelInL .5s steps(12) forwards
    }

    .stage.run .word-right .fly {
      animation: pixelInR .5s steps(12) forwards
    }

    @keyframes pixelInL {
      0% {
        transform: translate(-512px, 0);
        opacity: 0
      }

      20% {
        opacity: 1
      }

      100% {
        transform: translate(14px, 0);
        opacity: 1
      }
    }

    @keyframes pixelInR {
      0% {
        transform: translate(512px, 0);
        opacity: 0
      }

      20% {
        opacity: 1
      }

      100% {
        transform: translate(-14px, 0);
        opacity: 1
      }
    }

    .word-text {
      display: inline-block;
      color: #00fff0;
      text-shadow: 4px 0 #f0f, -4px 0 #ff0, 0 0 20px rgba(0, 255, 240, .8), 4px 4px 0 rgba(0, 0, 0, .5);
      will-change: transform, opacity, filter
    }

    .stage.impact .word-text {
      animation: pixelFade .35s steps(6) forwards
    }

    @keyframes pixelFade {
      0% {
        opacity: 1;
        filter: brightness(3) saturate(2)
      }

      20% {
        opacity: 1;
        filter: brightness(2)
      }

      100% {
        opacity: 0;
        filter: brightness(1)
      }
    }

    .stage.impact {
      animation: pixelShake .4s steps(8)
    }

    @keyframes pixelShake {
      0% {
        transform: translate(0, 0)
      }

      12% {
        transform: translate(-8px, 8px)
      }

      25% {
        transform: translate(8px, -8px)
      }

      37% {
        transform: translate(-6px, 4px)
      }

      50% {
        transform: translate(6px, -6px)
      }

      62% {
        transform: translate(-4px, 2px)
      }

      75% {
        transform: translate(4px, -4px)
      }

      87% {
        transform: translate(-2px, 2px)
      }

      100% {
        transform: translate(0, 0)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50
    }

    .stage.impact .flash {
      animation: pixelFlash .25s steps(4)
    }

    @keyframes pixelFlash {
      0% {
        opacity: 0
      }

      25% {
        opacity: 1
      }

      50% {
        opacity: .4
      }

      75% {
        opacity: .8
      }

      100% {
        opacity: 0
      }
    }

    .shock-box {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 4px solid #00fff0;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 30px rgba(0, 255, 240, .9)
    }

    .shock-box.s2 {
      border-color: #f0f;
      box-shadow: 0 0 30px rgba(255, 0, 255, .9);
      animation-delay: 80ms !important
    }

    .shock-box.s3 {
      border-color: #ff0;
      box-shadow: 0 0 30px rgba(255, 255, 0, .9);
      animation-delay: .16s !important
    }

    .stage.impact .shock-box {
      animation: boxGrow .9s steps(10) forwards
    }

    @keyframes boxGrow {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1
      }

      100% {
        transform: translate(-50%, -50%) scale(20);
        opacity: 0
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      image-rendering: pixelated
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="shock-box"></div>
    <div class="shock-box s2"></div>
    <div class="shock-box s3"></div>
    <div class="flash"></div>
  </div>
