<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Sonic Boom 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #050510;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, rgba(30, 80, 200, .15) 0, transparent 60%), radial-gradient(circle at 50% 50%, #0a0a20 0, #020208 100%);
      border-radius: 12px;
      border: 1px solid rgba(80, 180, 255, .2);
      box-shadow: 0 0 100px rgba(0, 150, 255, .15), inset 0 0 100px rgba(0, 100, 200, .08);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(1.5px 1.5px at 20% 30%, rgba(80, 200, 255, .6), transparent), radial-gradient(1.5px 1.5px at 80% 25%, rgba(80, 200, 255, .5), transparent), radial-gradient(1.5px 1.5px at 85% 70%, rgba(80, 200, 255, .5), transparent), radial-gradient(1.5px 1.5px at 15% 75%, rgba(80, 200, 255, .6), transparent), radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, .4), transparent), radial-gradient(1px 1px at 50% 90%, rgba(255, 255, 255, .4), transparent);
      z-index: 1;
      animation: dotPulse 2.5s ease-in-out infinite
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: .4
      }

      50% {
        opacity: .9
      }
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: Audiowide, sans-serif;
      font-weight: 400;
      letter-spacing: .03em;
      white-space: nowrap;
      line-height: .9;
      z-index: 5;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform, opacity, filter
    }

    .stage.run .word-left .fly {
      animation: sonicInL .55s cubic-bezier(.5, 0, .3, 1) forwards
    }

    .stage.run .word-right .fly {
      animation: sonicInR .55s cubic-bezier(.5, 0, .3, 1) forwards
    }

    @keyframes sonicInL {
      0% {
        transform: translate(-512px, 0) scaleX(2) skewX(-20deg);
        filter: blur(8px);
        opacity: 0
      }

      40% {
        opacity: 1;
        transform: translate(-200px, 0) scaleX(1.3) skewX(5deg);
        filter: blur(2px)
      }

      70% {
        transform: translate(-50px, 0) scaleX(1) skewX(-3deg);
        filter: blur(0)
      }

      100% {
        transform: translate(14px, 0) scaleX(1) skewX(0)
      }
    }

    @keyframes sonicInR {
      0% {
        transform: translate(512px, 0) scaleX(2) skewX(20deg);
        filter: blur(8px);
        opacity: 0
      }

      40% {
        opacity: 1;
        transform: translate(200px, 0) scaleX(1.3) skewX(-5deg);
        filter: blur(2px)
      }

      70% {
        transform: translate(50px, 0) scaleX(1) skewX(3deg);
        filter: blur(0)
      }

      100% {
        transform: translate(-14px, 0) scaleX(1) skewX(0)
      }
    }

    .word-text {
      display: inline-block;
      color: #fff;
      text-shadow: 0 0 8px #00c8ff, 0 0 20px #00c8ff, 0 0 40px #06f, 0 0 70px rgba(0, 102, 255, .6);
      will-change: transform, filter, opacity;
      animation: vibrate 80ms linear infinite
    }

    @keyframes vibrate {

      0%,
      100% {
        transform: translate(0, 0)
      }

      25% {
        transform: translate(-.7px, .5px)
      }

      50% {
        transform: translate(.5px, -.7px)
      }

      75% {
        transform: translate(.7px, .7px)
      }
    }

    .stage.impact .word-text {
      animation: vibrate 80ms linear infinite, sonicDistort .9s cubic-bezier(.4, 0, .6, 1)
    }

    @keyframes sonicDistort {
      0% {
        transform: scale(1);
        filter: brightness(1)
      }

      10% {
        transform: scale(1.15);
        filter: brightness(2.5) saturate(2)
      }

      30% {
        transform: scale(1) skewX(8deg);
        filter: brightness(2)
      }

      50% {
        transform: scale(1) skewX(-6deg);
        filter: brightness(1.7)
      }

      70% {
        transform: scale(1) skewX(3deg);
        filter: brightness(1.3)
      }

      100% {
        transform: scale(1) skewX(0);
        filter: brightness(1)
      }
    }

    .stage.impact {
      animation: bassPulse .9s cubic-bezier(.3, 0, .7, 1)
    }

    @keyframes bassPulse {
      0% {
        transform: scale(1)
      }

      15% {
        transform: scale(1.045)
      }

      35% {
        transform: scale(.97)
      }

      55% {
        transform: scale(1.03)
      }

      75% {
        transform: scale(.99)
      }

      100% {
        transform: scale(1)
      }
    }

    .stage.impact {
      animation: bassPulse .9s cubic-bezier(.3, 0, .7, 1), sonicShake .55s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes sonicShake {

      0%,
      100% {
        translate: 0 0
      }

      10% {
        translate: -6px 4px
      }

      20% {
        translate: 6px -4px
      }

      30% {
        translate: -5px 3px
      }

      40% {
        translate: 5px -3px
      }

      60% {
        translate: -3px 2px
      }

      80% {
        translate: 2px -1px
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, #fff 0, #00c8ff 25%, transparent 65%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen
    }

    .stage.impact .flash {
      animation: flash .5s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      8% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(0, 200, 255, .9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 30px rgba(0, 200, 255, .8)
    }

    .stage.impact .ring {
      animation: sonicRing 1.2s cubic-bezier(.2, .8, .4, 1) forwards
    }

    .stage.impact .ring.r2 {
      animation-delay: .1s !important
    }

    .stage.impact .ring.r3 {
      animation-delay: .2s !important
    }

    .stage.impact .ring.r4 {
      animation-delay: .3s !important
    }

    @keyframes sonicRing {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 5px
      }

      100% {
        transform: translate(-50%, -50%) scale(22);
        opacity: 0;
        border-width: .5px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }
  </style>
</head>

<body>
  <div id="kalimat-src" data-text="{{TEXT}}" hidden></div>
  <div class="stage" id="stage">
    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="flash"></div>
  </div>
  <script>

  </script>
</body>

</html>
