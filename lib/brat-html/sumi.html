<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Sumi Glitch 512</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #14110e;
      display: grid;
      place-items: center;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, #f8f2e6 0, #e8dfcd 62%, #dcd1ba 100%);
      border-radius: 6px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .6), inset 0 0 60px rgba(120, 90, 60, .12);
      isolation: isolate
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: .18;
      mix-blend-mode: multiply;
      z-index: 1;
      pointer-events: none
    }

    .stage::after {
      content: '斬';
      position: absolute;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      background: #c9302c;
      color: #f8f2e6;
      font-family: 'Shippori Mincho', serif;
      font-size: 28px;
      border-radius: 3px;
      z-index: 8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
      opacity: .92;
      transform-origin: 50% 50%
    }

    .stage.impact::after {
      animation: sealPulse .55s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes sealPulse {
      0% {
        transform: scale(1) rotate(0)
      }

      40% {
        transform: scale(1.18) rotate(-5deg)
      }

      100% {
        transform: scale(1) rotate(0)
      }
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(26, 22, 18, .055) 0 1px, transparent 1px 3px);
      opacity: .8;
      mix-blend-mode: multiply
    }

    .word {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      line-height: 1;
      transform: translateY(-2px);
      will-change: transform
    }

    .stage.settle .word {
      animation: breathe 3.4s ease-in-out infinite
    }

    @keyframes breathe {

      0%,
      100% {
        transform: translateY(-2px)
      }

      50% {
        transform: translateY(-7px)
      }
    }

    .layer {
      grid-area: 1/1;
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform, opacity
    }

    .layer.base {
      color: #1a1612;
      text-shadow: 1px 1px 0 rgba(100, 80, 60, .22)
    }

    .layer.r {
      color: #ff2f52;
      mix-blend-mode: multiply;
      opacity: .45;
      transform: translate(-4px, -3px)
    }

    .layer.c {
      color: #0aa2d8;
      mix-blend-mode: multiply;
      opacity: .4;
      transform: translate(4px, 3px)
    }

    .ch {
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity, filter;
      backface-visibility: hidden
    }

    .stage.run .layer .ch {
      animation: chIn .72s cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: calc(var(--i) * 28ms)
    }

    @keyframes chIn {
      0% {
        transform: translate(var(--dx, 0), var(--dy, 120px)) rotate(var(--rot, 10deg)) scale(.72);
        filter: blur(14px);
        opacity: 0
      }

      55% {
        opacity: 1
      }

      100% {
        transform: translate(0, 0) rotate(0) scale(1);
        filter: blur(0);
        opacity: 1
      }
    }

    .stage.impact .layer.r {
      animation: glitchR .62s cubic-bezier(.36, .07, .19, .97) 1
    }

    .stage.impact .layer.c {
      animation: glitchC .62s cubic-bezier(.36, .07, .19, .97) 1
    }

    @keyframes glitchR {
      0% {
        transform: translate(-4px, -3px);
        opacity: .45
      }

      9% {
        transform: translate(-20px, 5px) skewX(-9deg);
        opacity: .88
      }

      18% {
        transform: translate(11px, -7px) skewX(7deg);
        opacity: .7
      }

      30% {
        transform: translate(-26px, 2px);
        opacity: .92
      }

      44% {
        transform: translate(7px, 6px) skewX(-5deg);
        opacity: .6
      }

      60% {
        transform: translate(-11px, -4px);
        opacity: .76
      }

      78% {
        transform: translate(5px, 3px);
        opacity: .52
      }

      100% {
        transform: translate(-4px, -3px);
        opacity: .45
      }
    }

    @keyframes glitchC {
      0% {
        transform: translate(4px, 3px);
        opacity: .4
      }

      9% {
        transform: translate(22px, -5px) skewX(9deg);
        opacity: .85
      }

      18% {
        transform: translate(-12px, 7px) skewX(-7deg);
        opacity: .66
      }

      30% {
        transform: translate(28px, -2px);
        opacity: .9
      }

      44% {
        transform: translate(-8px, -6px) skewX(5deg);
        opacity: .58
      }

      60% {
        transform: translate(12px, 4px);
        opacity: .72
      }

      78% {
        transform: translate(-6px, -3px);
        opacity: .5
      }

      100% {
        transform: translate(4px, 3px);
        opacity: .4
      }
    }

    .stage.settle .layer.r {
      animation: microR 4.2s steps(1, end) infinite
    }

    .stage.settle .layer.c {
      animation: microC 4.2s steps(1, end) infinite
    }

    @keyframes microR {

      0%,
      100%,
      86% {
        transform: translate(-4px, -3px);
        opacity: .45
      }

      88% {
        transform: translate(-13px, 3px);
        opacity: .72
      }

      91% {
        transform: translate(6px, -4px);
        opacity: .58
      }

      94% {
        transform: translate(-4px, -3px);
        opacity: .45
      }
    }

    @keyframes microC {

      0%,
      100%,
      86% {
        transform: translate(4px, 3px);
        opacity: .4
      }

      88% {
        transform: translate(14px, -3px);
        opacity: .68
      }

      91% {
        transform: translate(-7px, 4px);
        opacity: .55
      }

      94% {
        transform: translate(4px, 3px);
        opacity: .4
      }
    }

    .ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(26, 22, 18, .55);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 4;
      pointer-events: none
    }

    .stage.impact .ring {
      animation: ringOut .85s cubic-bezier(.2, .8, .2, 1) forwards
    }

    @keyframes ringOut {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: .9;
        border-width: 7px
      }

      100% {
        transform: translate(-50%, -50%) scale(62);
        opacity: 0;
        border-width: 1px
      }
    }

    .shine {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .92) 50%, transparent 62%);
      transform: translateX(-140%);
      opacity: 0;
      mix-blend-mode: overlay
    }

    .stage.settle .shine {
      animation: shineSweep 1.15s cubic-bezier(.4, 0, .2, 1) .08s forwards
    }

    @keyframes shineSweep {
      0% {
        transform: translateX(-140%);
        opacity: 0
      }

      18% {
        opacity: 1
      }

      82% {
        opacity: 1
      }

      100% {
        transform: translateX(140%);
        opacity: 0
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: overlay
    }

    .stage.impact .flash {
      animation: flash .16s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      45% {
        opacity: .95
      }

      100% {
        opacity: 0
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      mix-blend-mode: multiply
    }
  </style>
</head>

<body>

  <div class="stage" id="stage">
    <div class="word" id="word">
      <div class="layer base" id="layerBase"></div>
      <div class="layer r" id="layerR"></div>
      <div class="layer c" id="layerC"></div>
    </div>
    <div class="ring"></div>
    <div class="scanlines"></div>
    <div class="shine"></div><canvas id="fx" width="512" height="512"></canvas>
    <div class="flash"></div>
  </div>
