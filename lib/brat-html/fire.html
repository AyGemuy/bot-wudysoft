<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Auto Word Impact 512</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body,
    html {
      height: 100%;
      background: #050505;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 55%, #1a0800 0, #050505 70%);
      border-radius: 14px;
      border: 1px solid rgba(255, 100, 0, .15);
      box-shadow: 0 0 80px rgba(255, 60, 0, .12), inset 0 0 100px rgba(255, 40, 0, .05)
    }

    .word {
      position: absolute;
      top: 50%;
      font-family: Anton, 'Arial Black', sans-serif;
      font-weight: 900;
      white-space: nowrap;
      line-height: 1;
      will-change: transform
    }

    .word-left {
      left: 50%;
      transform: translate(-100%, -50%)
    }

    .word-right {
      left: 50%;
      transform: translate(0, -50%)
    }

    .fly {
      display: inline-block;
      will-change: transform
    }

    .stage.run .word-left .fly {
      animation: flyLeft .45s cubic-bezier(.6, 0, .95, .55) forwards
    }

    .stage.run .word-right .fly {
      animation: flyRight .45s cubic-bezier(.6, 0, .95, .55) forwards
    }

    @keyframes flyLeft {
      from {
        transform: translate(-512px, 0)
      }

      to {
        transform: translate(14px, 0)
      }
    }

    @keyframes flyRight {
      from {
        transform: translate(512px, 0)
      }

      to {
        transform: translate(-14px, 0)
      }
    }

    .word-text {
      display: inline-block;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 60, 0, .5);
      will-change: transform, color, text-shadow
    }

    .stage.impact .word-text {
      animation: burn 2.2s ease-out forwards, recoil .4s ease-out
    }

    @keyframes recoil {
      0% {
        transform: scale(1.18)
      }

      45% {
        transform: scale(.95)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes burn {
      0% {
        color: #fff;
        text-shadow: 0 0 30px rgba(255, 80, 0, .7)
      }

      5% {
        color: #fff;
        text-shadow: 0 0 60px #ffdc64, 0 0 130px rgba(255, 120, 0, .9)
      }

      15% {
        color: #fff6a8;
        text-shadow: 0 0 70px #ffff78, 0 0 150px #ffc800
      }

      25% {
        color: #fc0;
        text-shadow: 0 0 60px #ffb400, 0 0 140px rgba(255, 80, 0, .9)
      }

      40% {
        color: #f60;
        text-shadow: 0 0 50px rgba(255, 80, 0, .9), 0 0 120px rgba(255, 20, 0, .7)
      }

      60% {
        color: #c20;
        text-shadow: 0 0 40px rgba(255, 40, 0, .7), 0 0 100px rgba(255, 0, 0, .5)
      }

      100% {
        color: #7a1800;
        text-shadow: 0 0 40px rgba(255, 50, 0, .6), 0 0 90px rgba(255, 10, 0, .3)
      }
    }

    .stage.impact {
      animation: shake .5s cubic-bezier(.36, .07, .19, .97)
    }

    @keyframes shake {

      0%,
      100% {
        transform: translate(0, 0)
      }

      10% {
        transform: translate(-8px, 6px) rotate(-.5deg)
      }

      20% {
        transform: translate(8px, -6px) rotate(.5deg)
      }

      30% {
        transform: translate(-6px, 4px) rotate(-.3deg)
      }

      40% {
        transform: translate(6px, -4px) rotate(.3deg)
      }

      55% {
        transform: translate(-4px, 3px)
      }

      75% {
        transform: translate(3px, -2px)
      }

      90% {
        transform: translate(-1px, 1px)
      }
    }

    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #fff 0, #fc6 25%, transparent 65%);
      opacity: 0;
      pointer-events: none;
      z-index: 50
    }

    .stage.impact .flash {
      animation: flash .5s ease-out
    }

    @keyframes flash {
      0% {
        opacity: 0
      }

      8% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .shockwave {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 6px solid rgba(255, 160, 0, .9);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 0 40px rgba(255, 120, 0, .8), inset 0 0 40px rgba(255, 80, 0, .6)
    }

    .stage.impact .shockwave {
      animation: shockwave 1s cubic-bezier(.2, .8, .4, 1) forwards
    }

    @keyframes shockwave {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 1;
        border-width: 10px
      }

      100% {
        transform: translate(-50%, -50%) scale(30);
        opacity: 0;
        border-width: 1px
      }
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .5) 100%)
    }
  </style>
</head>

<body>

    <div class="word word-left">
      <div class="fly"><span class="word-text" id="textLeft"></span></div>
    </div>
    <div class="word word-right">
      <div class="fly"><span class="word-text" id="textRight"></span></div>
    </div><canvas id="fx" width="512" height="512"></canvas>
    <div class="shockwave"></div>
    <div class="flash"></div>
    <div class="vignette"></div>
  </div>
