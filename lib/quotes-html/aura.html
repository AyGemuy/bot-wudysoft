<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      width: 1200px;
      height: 630px;
      background: #08080c;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 70px 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 15% 20%, rgba(255, 75, 130, .45) 0, transparent 45%), radial-gradient(circle at 85% 80%, rgba(99, 102, 241, .45) 0, transparent 50%), radial-gradient(circle at 50% 50%, rgba(236, 72, 153, .2) 0, transparent 60%), #090a10
    }

    .grain {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase
    }

    .tag {
      font-size: 15px;
      color: rgba(255, 255, 255, .5);
      font-weight: 600;
      letter-spacing: 2px
    }

    .quote-container {
      z-index: 2;
      margin: auto 0
    }

    .quote-text {
      font-family: 'Instrument Serif', serif;
      font-size: 58px;
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: -.5px;
      color: #fbfbfb;
      text-shadow: 0 4px 20px rgba(0, 0, 0, .5)
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, .12);
      padding-top: 24px
    }

    .author {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff80b5, #9089fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .watermark {
      font-size: 15px;
      color: rgba(255, 255, 255, .4);
      font-weight: 600
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="grain"></div>
    <div class="header">
      <div class="badge">{{EMOJI}} {{CATEGORY}}</div>
      <div class="tag">DAILY INSPIRATION</div>
    </div>
    <div class="quote-container">
      <div class="quote-text">“{{QUOTE}}”</div>
    </div>
    <div class="footer">
      <div class="author">{{BOT_NAME}}</div>
      <div class="watermark">Aura Minimalist • 2026</div>
    </div>
  </div>
</body>

</html>
