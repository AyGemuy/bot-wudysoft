<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      width: 1200px;
      height: 630px;
      background: #000;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at 50% 120%, #2e1065 0, #09090b 70%)
    }

    .island-card {
      width: 1060px;
      height: 490px;
      padding: 56px 70px;
      border-radius: 44px;
      background: rgba(22, 22, 30, .65);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 35px 80px rgba(0, 0, 0, .7), inset 0 1px 1px rgba(255, 255, 255, .25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .capsule-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .12);
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc
    }

    .sensor-pill {
      width: 70px;
      height: 16px;
      border-radius: 999px;
      background: #000;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, .15)
    }

    .quote-body {
      margin: auto 0
    }

    .quote-text {
      font-size: 46px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -1px;
      color: #fff
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .user-brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px
    }

    .meta-text h4 {
      font-size: 16px;
      font-weight: 700;
      color: #fff
    }

    .meta-text p {
      font-size: 12px;
      color: #94a3b8
    }

    .action-hint {
      padding: 10px 24px;
      background: #fff;
      color: #000;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="island-card">
      <div class="top-bar">
        <div class="capsule-badge">{{EMOJI}} {{CATEGORY}}</div>
        <div class="sensor-pill"></div>
      </div>
      <div class="quote-body">
        <div class="quote-text">“{{QUOTE}}”</div>
      </div>
      <div class="bottom-bar">
        <div class="user-brand">
          <div class="avatar">⚡</div>
          <div class="meta-text">
            <h4>{{BOT_NAME}}</h4>
            <p>Curated Daily Feed</p>
          </div>
        </div>
        <div class="action-hint">Explore</div>
      </div>
    </div>
  </div>
</body>

</html>
