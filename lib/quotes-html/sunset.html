<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      width: 1200px;
      height: 630px;
      background: #0f0a0a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .card {
      width: 100%;
      height: 100%;
      padding: 70px 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 10% 90%, rgba(249, 115, 22, .4) 0, transparent 50%), radial-gradient(circle at 90% 10%, rgba(244, 63, 94, .35) 0, transparent 50%), #0e0909;
      position: relative
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .tag {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #fb923c;
      text-transform: uppercase
    }

    .category {
      font-size: 16px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1)
    }

    .quote-box {
      margin: auto 0
    }

    .quote-text {
      font-family: 'Instrument Serif', serif;
      font-size: 60px;
      line-height: 1.25;
      color: #fff7ed;
      font-style: italic
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, .1);
      padding-top: 20px
    }

    .sign {
      font-size: 17px;
      font-weight: 700;
      color: #fdba74
    }

    .date {
      font-size: 14px;
      color: rgba(255, 255, 255, .4)
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="tag">ESSENCE OF THOUGHTS</div>
      <div class="category">{{EMOJI}} {{CATEGORY}}</div>
    </div>
    <div class="quote-box">
      <div class="quote-text">“{{QUOTE}}”</div>
    </div>
    <div class="footer">
      <div class="sign">{{BOT_NAME}} Edition</div>
      <div class="date">Editorial Series</div>
    </div>
  </div>
</body>

</html>
