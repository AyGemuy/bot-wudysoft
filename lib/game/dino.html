<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Dino Bot — Endless Runner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body,
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0b141a;
      touch-action: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9edef;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      touch-action: none;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    
    let W = 0, H = 0, groundY = 0;
    
    // State Game
    const game = { 
      phase: "menu", // menu, playing, over
      lives: 3, 
      distance: 0, 
      coins: 0, 
      timeLeft: 30, 
      speed: 6.5, 
      groundOffset: 0, 
      groundOffset2: 0, 
      player: { bottomY: 0, vy: 0, onGround: true, legPhase: 0, runCycle: 0, invincible: 0, squash: 0, w: 66, h: 76 }, 
      obstacles: [], 
      coinsList: [], 
      particles: [], 
      floaties: [], 
      dust: [], 
      clouds: [], 
      hills: [], 
      spawnTimer: 0, 
      coinTimer: 0, 
      shake: 0, 
      flash: 0, 
      flashColor: "rgba(6,207,156,.35)",
      win: false
    };

    const clamp = (t, e, a) => Math.max(e, Math.min(a, t));
    const rand = (t, e) => t + Math.random() * (e - t);

    // UI Hitbox untuk Tombol Main Lagi
    let btnRestart = { x: 0, y: 0, w: 180, h: 50 };

    // ==========================================
    // RESIZE & LAYOUT
    // ==========================================
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      
      groundY = H - Math.max(220, .26 * H);
      const scale = clamp(W / 1200, .72, 1.1);
      game.player.w = Math.round(66 * scale);
      game.player.h = Math.round(76 * scale);

      if (game.phase === "menu" || game.phase === "over") {
        game.player.bottomY = groundY;
      }

      buildHills();
      buildClouds();

      btnRestart.x = W / 2 - btnRestart.w / 2;
      btnRestart.y = H / 2 + 50;

      draw();
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 200));

    function buildHills() { 
      game.hills = []; 
      for (let i = 0; i < 6; i++) 
        game.hills.push({ x: i / 6 * W * 1.4 - 100, w: rand(200, 380), h: rand(60, 130), speed: rand(.18, .28) }) 
    }

    function buildClouds() { 
      game.clouds = []; 
      for (let i = 0; i < 5; i++) 
        game.clouds.push({ x: rand(0, W), y: rand(70, .55 * groundY), w: rand(70, 130), h: rand(14, 22), speed: rand(.15, .35), alpha: rand(.05, .12) }) 
    }

    // ==========================================
    // AUDIO (Web Audio API)
    // ==========================================
    let audioCtx = null, masterGain = null;
    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.35;
        masterGain.connect(audioCtx.destination);
      }
    }

    function sfxJump() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(760, t + .09);
      g.gain.setValueAtTime(1e-4, t); g.gain.exponentialRampToValueAtTime(.22, t + .008); g.gain.exponentialRampToValueAtTime(1e-4, t + .14);
      o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + .16);
    }

    function sfxCoin() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      [880, 1320].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), st = t + .05 * i;
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(1e-4, st); g.gain.exponentialRampToValueAtTime(.16, st + .008); g.gain.exponentialRampToValueAtTime(1e-4, st + .13);
        o.connect(g); g.connect(masterGain); o.start(st); o.stop(st + .15);
      });
    }

    function sfxCrash() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime, o = audioCtx.createOscillator(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(45, t + .32);
      f.type = "lowpass"; f.frequency.value = 900;
      g.gain.setValueAtTime(1e-4, t); g.gain.exponentialRampToValueAtTime(.28, t + .01); g.gain.exponentialRampToValueAtTime(1e-4, t + .36);
      o.connect(f); f.connect(g); g.connect(masterGain); o.start(t); o.stop(t + .4);
    }

    // ==========================================
    // PARTICLES & EFFECTS
    // ==========================================
    function spawnParticles(x, y, color, count = 12, scale = 1) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, speed = (1.4 + 4 * Math.random()) * scale;
        game.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.4, life: 1, size: 2 + 3.5 * Math.random(), color });
      }
    }

    function spawnFloatText(x, y, text, color) { game.floaties.push({ x, y, text, color, life: 1 }) }
    function spawnDust(x, y, dir = -1) { game.dust.push({ x, y, vx: dir * rand(1.5, 3.5), vy: -rand(.6, 2.2), life: 1, size: rand(3, 7) }) }

    function updateParticles(dt) {
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .24 * dt; p.vx *= .985; p.life -= .028 * dt;
        if (p.life <= 0) game.particles.splice(i, 1);
      }
      for (let i = game.floaties.length - 1; i >= 0; i--) {
        const f = game.floaties[i];
        f.y -= 1.1 * dt; f.life -= .022 * dt;
        if (f.life <= 0) game.floaties.splice(i, 1);
      }
      for (let i = game.dust.length - 1; i >= 0; i--) {
        const d = game.dust[i];
        d.x += d.vx * dt; d.y += d.vy * dt; d.vy += .16 * dt; d.vx *= .94; d.life -= .04 * dt;
        if (d.life <= 0) game.dust.splice(i, 1);
      }
    }

    // ==========================================
    // GAME LOGIC
    // ==========================================
    function startGame() {
      game.phase = "playing";
      game.lives = 3;
      game.distance = 0;
      game.coins = 0;
      game.timeLeft = 30;
      game.speed = 6.5;
      game.groundOffset = 0;
      game.groundOffset2 = 0;
      game.obstacles = [];
      game.coinsList = [];
      game.particles = [];
      game.floaties = [];
      game.dust = [];
      game.spawnTimer = 1;
      game.coinTimer = 1.2;
      game.shake = 0;
      game.flash = 0;
      game.win = false;

      const p = game.player;
      p.bottomY = groundY; p.vy = 0; p.onGround = true; p.invincible = 0; p.squash = 0; p.legPhase = 0;
    }

    function endGame() {
      game.phase = "over";
      game.win = game.timeLeft <= 0;
      if (game.win) {
        spawnParticles(W/2, H/2, "#06cf9c", 40, 1.5);
      } else {
        game.shake = 20;
        game.flash = 0.5;
        game.flashColor = "rgba(241,92,109,.55)";
        spawnParticles(W/2, H/2, "#f15c6d", 30, 1.5);
      }
    }

    function doJump() {
      if (game.phase === "menu") { startGame(); return; }
      if (game.phase === "over") return;
      
      const p = game.player;
      if (p.onGround) {
        p.vy = -16; p.onGround = false; p.squash = -.28;
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        sfxJump();
        for (let i = 0; i < 6; i++) spawnDust(0.16 * W, groundY, -1);
      }
    }

    function updatePlayer(dt) {
      const p = game.player;
      
      if (!p.onGround) {
        p.vy += 1 * dt;
        p.bottomY += p.vy * dt;
        if (p.bottomY >= groundY) {
          p.bottomY = groundY; p.vy = 0; p.onGround = true; p.squash = .32;
          for (let i = 0; i < 5; i++) spawnDust(0.16 * W, groundY, -1);
        }
      }

      if (p.squash < 0) p.squash = Math.min(0, p.squash + .05 * dt);
      if (p.squash > 0) p.squash = Math.max(0, p.squash - .05 * dt);

      p.legPhase += .32 * dt * (game.speed / 6.5);
      if (p.legPhase > Math.PI * 2) p.legPhase -= Math.PI * 2;
      
      if (p.invincible > 0) p.invincible = Math.max(0, p.invincible - dt / 60);
    }

    function updateWorld(dt) {
      const elapsed = dt / 60;
      const progress = 30 - game.timeLeft;
      
      game.speed = 6.5 + Math.min(8, .28 * progress);
      const scroll = game.speed * dt;
      
      game.distance += game.speed * dt * .055;
      game.groundOffset = (game.groundOffset + scroll) % 34;
      game.groundOffset2 = (game.groundOffset2 + .55 * scroll) % 90;

      // Update Backgrounds
      for (const c of game.clouds) {
        c.x -= c.speed * dt;
        if (c.x + c.w < -20) { c.x = W + rand(20, 200); c.y = rand(70, .55 * groundY); c.w = rand(70, 130); c.h = rand(14, 22); c.alpha = rand(.05, .12); }
      }
      for (const h of game.hills) {
        h.x -= h.speed * dt * (game.speed / 6.5);
        if (h.x + h.w < -50) { h.x = W + rand(40, 260); h.w = rand(200, 380); h.h = rand(60, 130); }
      }

      // Spawn Obstacles
      game.spawnTimer -= elapsed;
      if (game.spawnTimer <= 0) {
        spawnObstacle();
        game.spawnTimer = clamp(.95 - .042 * (game.speed - 6.5), .68, 1.05) + rand(-.08, .22);
      }

      // Spawn Coins
      game.coinTimer -= elapsed;
      if (game.coinTimer <= 0) {
        spawnCoin();
        if (Math.random() < .3) spawnCoin();
        game.coinTimer = rand(.7, 1.6);
      }

      // Update Obstacles & Coins
      for (let i = game.obstacles.length - 1; i >= 0; i--) {
        const obs = game.obstacles[i];
        obs.x -= scroll;
        if (obs.type === "bird") { obs.wingPhase += .28 * dt; obs.bob += .06 * dt; }
        if (obs.x + obs.w < -40) game.obstacles.splice(i, 1);
      }
      for (let i = game.coinsList.length - 1; i >= 0; i--) {
        const c = game.coinsList[i];
        c.x -= scroll; c.phase += .09 * dt;
        if (c.x + c.r < -40) game.coinsList.splice(i, 1);
      }

      // Timer
      game.timeLeft -= elapsed;
      if (game.timeLeft <= 0) { game.timeLeft = 0; endGame(); return; }

      checkCollisions();
    }

    function spawnObstacle() {
      let canSpawn = true;
      for (const o of game.obstacles) {
        if (o.x > W - 520) { canSpawn = false; break; }
      }
      
      const r = Math.random();
      let type = r < .18 && canSpawn && game.distance > 120 ? "bird" : r < .55 ? "cactus_small" : r < .82 ? "cactus_large" : "rock";
      
      let w, h, y;
      if (type === "cactus_small") { w = clamp(.026 * W, 22, 34); h = clamp(.075 * H, 42, 62); y = groundY - h; }
      else if (type === "cactus_large") { w = clamp(.034 * W, 30, 46); h = clamp(.11 * H, 62, 92); y = groundY - h; }
      else if (type === "rock") { w = clamp(.042 * W, 38, 62); h = clamp(.055 * H, 32, 48); y = groundY - h; }
      else if (type === "bird") { w = clamp(.038 * W, 34, 52); h = clamp(.045 * H, 26, 38); y = groundY - h - clamp(.1 * H, 70, 120); }
      
      game.obstacles.push({ type, x: W + 40, y, w, h, wingPhase: 0, bob: Math.random() * Math.PI * 2 });
    }

    function spawnCoin() {
      const y = Math.random() < .55 ? groundY - clamp(.055 * H, 32, 50) : groundY - clamp(.16 * H, 100, 170);
      game.coinsList.push({ x: W + 30, y, r: clamp(.011 * W, 11, 16), phase: Math.random() * Math.PI * 2 });
    }

    function checkCollisions() {
      const p = game.player;
      const px = .16 * W, pyTop = p.bottomY - p.h, pyBot = p.bottomY;
      const hitX = px - .3 * p.w, hitY = pyTop + .12 * p.h;
      const hitW = .6 * p.w, hitH = .86 * p.h;

      if (p.invincible <= 0) {
        for (let i = game.obstacles.length - 1; i >= 0; i--) {
          const o = game.obstacles[i];
          const ox = o.x + .14 * o.w, oy = o.y + .1 * o.h;
          const ow = .72 * o.w, oh = .84 * o.h;
          
          if (hitX < ox + ow && hitX + hitW > ox && hitY < oy + oh && hitY + hitH > oy) {
            game.obstacles.splice(i, 1);
            crash();
            return;
          }
        }
      }

      for (let i = game.coinsList.length - 1; i >= 0; i--) {
        const c = game.coinsList[i];
        const cx = px, cy = (pyTop + pyBot) / 2;
        
        if (Math.hypot(cx - c.x, cy - c.y) < .5 * p.w + c.r) {
          game.coinsList.splice(i, 1);
          game.coins++;
          spawnParticles(c.x, c.y, "#ffb74d", 10, .85);
          spawnFloatText(c.x, c.y - 10, "+1", "#ffb74d");
          game.flash = .14;
          game.flashColor = "rgba(255,183,77,.32)";
          sfxCoin();
        }
      }
    }

    function crash() {
      const p = game.player;
      p.invincible = 1.5;
      game.lives--;
      game.shake = 16;
      game.flash = .55;
      game.flashColor = "rgba(241,92,109,.55)";
      
      const px = .16 * W, py = p.bottomY - p.h / 2;
      spawnParticles(px, py, "#f15c6d", 26, 1.6);
      spawnParticles(px, py, "#ffb74d", 10, 1.1);
      spawnFloatText(px, py - 40, "CRASH!", "#f15c6d");
      sfxCrash();

      if (game.lives <= 0) endGame();
    }

    // ==========================================
    // DRAWING
    // ==========================================
    function rr(x, y, w, h, r) { 
      ctx.beginPath(); 
      if (typeof ctx.roundRect === "function") ctx.roundRect(x, y, w, h, r); 
      else {
        r = Math.min(r, w/2, h/2);
        ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
        ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
        ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
        ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
      }
    }

    function drawDino(x, bottomY, w, h, legPhase, jumping, squash, isGhost) {
      const sw = w * (1 - .55 * squash);
      const sh = h * (1 + .55 * squash);
      const dx = x - sw / 2;
      const dy = bottomY - sh;
      const bodyH = .52 * sh;
      const bellyY = dy + .3 * sh;
      
      const cMain = "#06cf9c", cDark = "#008069", cEye = "#0b141a";

      ctx.save();
      
      // Bayangan
      if (!jumping) {
        ctx.fillStyle = "rgba(0,0,0,.22)";
        ctx.beginPath(); ctx.ellipse(x, groundY + 3, .45 * sw, 5, 0, 0, Math.PI*2); ctx.fill();
      }

      // Ekor
      ctx.fillStyle = cMain;
      ctx.beginPath(); ctx.moveTo(dx + .1 * sw, bellyY + .1 * bodyH); ctx.lineTo(dx - .24 * sw, bellyY + .42 * bodyH); ctx.lineTo(dx + .1 * sw, bellyY + .94 * bodyH); ctx.closePath(); ctx.fill();

      // Badan bawah
      ctx.fillStyle = cMain; rr(dx + .06 * sw, bellyY, .72 * sw, bodyH, 8); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.14)"; rr(dx + .14 * sw, bellyY + .15 * bodyH, .42 * sw, .26 * bodyH, 5); ctx.fill();

      // Kepala
      const headW = .56 * sw, headH = .42 * sh;
      const hx = dx + .36 * sw, hy = dy + .02 * sh;
      ctx.fillStyle = cMain; rr(dx + .42 * sw, bellyY - .05 * sh, .28 * sw, .34 * sh, 5); ctx.fill();
      rr(hx, hy, headW, headH, 8); ctx.fill();
      rr(hx + .62 * headW, hy + .42 * headH, .42 * headW, .42 * headH, 5); ctx.fill();

      // Mata
      if (isGhost) {
        ctx.strokeStyle = cEye; ctx.lineWidth = Math.max(1.5, .028 * sw);
        ctx.beginPath(); ctx.moveTo(hx + .56 * headW, hy + .36 * headH); ctx.lineTo(hx + .8 * headW, hy + .36 * headH); ctx.stroke();
      } else {
        ctx.fillStyle = cEye; ctx.beginPath(); ctx.arc(hx + .68 * headW, hy + .36 * headH, Math.max(2, .045 * sw), 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.arc(hx + .71 * headW, hy + .3 * headH, Math.max(.8, .016 * sw), 0, Math.PI*2); ctx.fill();
      }

      // Punggung
      ctx.fillStyle = cDark;
      for (let i = 0; i < 3; i++) {
        const sx = dx + sw * (.2 + .16 * i), sy = bellyY;
        ctx.beginPath(); ctx.moveTo(sx, sy + 2); ctx.lineTo(sx + .06 * sw, sy - .055 * sh); ctx.lineTo(sx + .12 * sw, sy + 2); ctx.closePath(); ctx.fill();
      }

      // Kaki
      ctx.fillStyle = cMain;
      if (jumping) {
        rr(dx + .22 * sw, bottomY - .2 * sh, .16 * sw, .2 * sh, 4); ctx.fill();
        rr(dx + .48 * sw, bottomY - .16 * sh, .16 * sw, .16 * sh, 4); ctx.fill();
      } else {
        const swing = Math.sin(legPhase);
        const a = .24 * sh + swing * sh * .05;
        const b = .24 * sh - swing * sh * .05;
        rr(dx + .22 * sw, bottomY - a, .15 * sw, a, 4); ctx.fill();
        rr(dx + .48 * sw, bottomY - b, .15 * sw, b, 4); ctx.fill();
        ctx.fillStyle = cDark;
        rr(dx + .18 * sw, bottomY - 5, .22 * sw, 5, 2); ctx.fill();
        rr(dx + .44 * sw, bottomY - 5, .22 * sw, 5, 2); ctx.fill();
      }

      // Tangan
      ctx.fillStyle = cMain; rr(dx + .66 * sw, bellyY + .3 * bodyH, .18 * sw, .14 * sh, 4); ctx.fill();
      ctx.restore();
    }

    function drawCactus(o, large) {
      const { x, y, w, h } = o;
      ctx.fillStyle = "#f15c6d";
      rr(x + .3 * w, y, .4 * w, h, 6); ctx.fill();
      ctx.fillStyle = "#ff8a9a"; rr(x + .36 * w, y + 4, .1 * w, h - 8, 4); ctx.fill();
      
      const c1 = y + h * (large ? .28 : .32);
      const c2 = y + h * (large ? .5 : .56);
      
      ctx.fillStyle = "#f15c6d";
      rr(x, c1, .32 * w, .24 * w, 5); ctx.fill();
      rr(x, c1 - .16 * h, .2 * w, .28 * h, 5); ctx.fill();
      rr(x + .68 * w, c2, .32 * w, .24 * w, 5); ctx.fill();
      rr(x + .8 * w, c2 - .2 * h, .2 * w, .32 * h, 5); ctx.fill();
      
      ctx.fillStyle = "#c5002f"; rr(x + .28 * w, y + h - 4, .44 * w, 4, 2); ctx.fill();
    }

    function drawRock(o) {
      const { x, y, w, h } = o;
      ctx.fillStyle = "#7986cb";
      ctx.beginPath(); ctx.moveTo(x + .1 * w, y + h); ctx.lineTo(x, y + .62 * h); ctx.lineTo(x + .22 * w, y + .1 * h); ctx.lineTo(x + .55 * w, y); ctx.lineTo(x + .88 * w, y + .2 * h); ctx.lineTo(x + w, y + .7 * h); ctx.lineTo(x + .9 * w, y + h); ctx.closePath(); ctx.fill();
      
      ctx.fillStyle = "#a4aede";
      ctx.beginPath(); ctx.moveTo(x + .3 * w, y + .16 * h); ctx.lineTo(x + .54 * w, y + .08 * h); ctx.lineTo(x + .42 * w, y + .42 * h); ctx.closePath(); ctx.fill();
      
      ctx.fillStyle = "#4a5685";
      ctx.beginPath(); ctx.moveTo(x + .6 * w, y + .5 * h); ctx.lineTo(x + .95 * w, y + .6 * h); ctx.lineTo(x + .92 * w, y + .92 * h); ctx.lineTo(x + .7 * w, y + .85 * h); ctx.closePath(); ctx.fill();
    }

    function drawBird(o) {
      const { x, y, w, h, wingPhase, bob } = o;
      const color = "#e08c1e";
      const offsetY = 3 * Math.sin(bob);
      
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2 + offsetY);
      
      const wing = .7 * Math.sin(wingPhase);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(.1 * -w, 0); ctx.lineTo(.52 * -w, .55 * -h * wing - .2 * h); ctx.lineTo(.3 * -w, .1 * h); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(.1 * w, 0); ctx.lineTo(.52 * w, .55 * -h * wing - .2 * h); ctx.lineTo(.3 * w, .1 * h); ctx.closePath(); ctx.fill();
      
      ctx.fillStyle = "#ffb74d";
      ctx.beginPath(); ctx.ellipse(0, 0, .3 * w, .32 * h, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(.24 * w, .1 * -h, .2 * h, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(.4 * w, .1 * -h); ctx.lineTo(.56 * w, .04 * -h); ctx.lineTo(.4 * w, 0); ctx.closePath(); ctx.fill();
      
      ctx.fillStyle = "#0b141a";
      ctx.beginPath(); ctx.arc(.26 * w, .14 * -h, Math.max(1.4, .055 * h), 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function drawCoin(x, y, r, phase) {
      const scaleX = .72 + .28 * Math.abs(Math.sin(phase));
      ctx.save();
      ctx.translate(x, y);
      ctx.shadowColor = "rgba(255,183,77,.85)";
      ctx.shadowBlur = 20;
      ctx.scale(scaleX, 1);
      
      const grad = ctx.createRadialGradient(-.3*r, -.3*r, .1*r, 0, 0, r);
      grad.addColorStop(0, "#ffe082"); grad.addColorStop(.6, "#ffb74d"); grad.addColorStop(1, "#e08c1e");
      
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, .65*r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(0, 0, .2*r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function drawUI() {
      // Kiri Atas: Nyawa & Jarak & Koin
      ctx.save();
      ctx.fillStyle = "rgba(11, 20, 26, 0.75)";
      ctx.beginPath(); ctx.roundRect(20, 20, 240, 44, 14); ctx.fill();
      
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      
      // Nyawa
      ctx.fillStyle = "#f15c6d";
      ctx.fillText("❤️".repeat(Math.max(0, game.lives)) + "🖤".repeat(Math.max(0, 3 - game.lives)), 32, 43);
      
      // Jarak
      ctx.fillStyle = "#ffb74d";
      ctx.fillText(`${Math.floor(game.distance)}m`, 130, 43);
      
      // Koin
      ctx.fillStyle = "#06cf9c";
      ctx.fillText(`🪙 ${game.coins}`, 200, 43);
      ctx.restore();

      // Timer Bar (Tengah Atas)
      if (game.phase === "playing") {
        const pct = clamp(game.timeLeft / 30, 0, 1);
        const barW = Math.min(300, W * 0.4);
        const barX = (W - barW) / 2;
        const barY = 30;
        
        ctx.fillStyle = "rgba(255,255,255,.1)";
        ctx.beginPath(); ctx.roundRect(barX, barY, barW, 6, 3); ctx.fill();
        
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, "#f15c6d"); grad.addColorStop(0.5, "#ffb74d"); grad.addColorStop(1, "#06cf9c");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.roundRect(barX, barY, barW * pct, 6, 3); ctx.fill();
      }

      // Countdown Merah jika sisa waktu <= 5 detik
      if (game.phase === "playing" && game.timeLeft <= 5) {
        const alpha = .35 + .35 * Math.sin(Date.now() / 80);
        ctx.font = '800 110px -apple-system, sans-serif';
        ctx.fillStyle = `rgba(241,92,109,${alpha})`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(241,92,109,.9)"; ctx.shadowBlur = 40;
        ctx.fillText(Math.ceil(game.timeLeft), W / 2, H * 0.3);
        ctx.shadowBlur = 0;
      }
    }

    function drawOverlay() {
      if (game.phase !== "menu" && game.phase !== "over") return;
      
      ctx.save();
      ctx.fillStyle = "rgba(11, 20, 26, 0.85)";
      ctx.fillRect(0, 0, W, H);
      
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      if (game.phase === "menu") {
        ctx.font = "64px -apple-system, sans-serif";
        ctx.fillText("🦖", W / 2, H / 2 - 80);
        
        ctx.fillStyle = "#e9edef";
        ctx.font = "bold 28px -apple-system, sans-serif";
        ctx.fillText("DINO BOT", W / 2, H / 2 - 10);
        
        ctx.fillStyle = "#8696a0";
        ctx.font = "15px -apple-system, sans-serif";
        ctx.fillText("Ketuk layar untuk mulai berlari", W / 2, H / 2 + 30);
      } else {
        const isWin = game.win;
        ctx.font = "64px -apple-system, sans-serif";
        ctx.fillText(isWin ? "🏆" : "💥", W / 2, H / 2 - 80);
        
        ctx.fillStyle = isWin ? "#06cf9c" : "#f15c6d";
        ctx.font = "bold 32px -apple-system, sans-serif";
        ctx.fillText(isWin ? "SELAMAT!" : "GAME OVER", W / 2, H / 2 - 10);
        
        ctx.fillStyle = "#e9edef";
        ctx.font = "18px -apple-system, sans-serif";
        ctx.fillText(`Jarak: ${Math.floor(game.distance)}m · Koin: ${game.coins}`, W / 2, H / 2 + 30);
        
        // Tombol Main Lagi
        ctx.beginPath();
        ctx.roundRect(btnRestart.x, btnRestart.y, btnRestart.w, btnRestart.h, 16);
        ctx.fillStyle = "#00a884";
        ctx.fill();
        
        ctx.fillStyle = "#0b141a";
        ctx.font = "bold 16px -apple-system, sans-serif";
        ctx.fillText("MAIN LAGI", W / 2, btnRestart.y + btnRestart.h / 2 + 1);
      }
      ctx.restore();
    }

    function draw() {
      ctx.save();
      
      // Efek Guncangan
      if (game.shake > 0) {
        ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
      }
      
      ctx.clearRect(-20, -20, W + 40, H + 40);
      
      // Background Gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#0d1a21"); bg.addColorStop(0.55, "#0b141a"); bg.addColorStop(1, "#060d12");
      ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);

      // Efek Cahaya Tengah
      const glow = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.35, W*0.9);
      glow.addColorStop(0, "rgba(6,207,156,.055)"); glow.addColorStop(1, "rgba(6,207,156,0)");
      ctx.fillStyle = glow; ctx.fillRect(-20, -20, W + 40, groundY + 20);

      // Bintang-bintang
      ctx.fillStyle = "rgba(255,255,255,.15)";
      for (let i = 0; i < 40; i++) {
        const sx = (137 * i + 23) % W;
        const sy = (79 * i + 11) % (H * 0.5);
        ctx.fillRect(sx, sy, 1.4, 1.4);
      }

      // Bulan
      const mx = W * 0.82, my = H * 0.18;
      const moonGlow = ctx.createRadialGradient(mx, my, 0, mx, my, 120);
      moonGlow.addColorStop(0, "rgba(255,255,255,.12)"); moonGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = moonGlow; ctx.beginPath(); ctx.arc(mx, my, 120, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI*2); ctx.fill();

      // Awan
      for (const c of game.clouds) {
        ctx.fillStyle = `rgba(200,220,240,${c.alpha})`;
        ctx.beginPath(); ctx.ellipse(c.x + c.w/2, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(c.x + c.w*.35, c.y - c.h*.3, c.w*.3, c.h*.55, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(c.x + c.w*.65, c.y - c.h*.2, c.w*.25, c.h*.5, 0, 0, Math.PI*2); ctx.fill();
      }

      // Bukit
      for (const h of game.hills) {
        ctx.fillStyle = "rgba(6,207,156,.045)";
        ctx.beginPath(); ctx.moveTo(h.x, groundY); ctx.quadraticCurveTo(h.x + h.w*.5, groundY - h.h*1.6, h.x + h.w, groundY); ctx.closePath(); ctx.fill();
      }

      // Tanah
      const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
      groundGrad.addColorStop(0, "rgba(6,207,156,.10)"); groundGrad.addColorStop(1, "rgba(6,207,156,.01)");
      ctx.fillStyle = groundGrad; ctx.fillRect(-20, groundY, W + 40, H - groundY + 20);

      // Garis Tanah
      ctx.strokeStyle = "rgba(6,207,156,.75)"; ctx.lineWidth = 2.5;
      ctx.shadowColor = "rgba(6,207,156,.8)"; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(-20, groundY); ctx.lineTo(W + 20, groundY); ctx.stroke();
      ctx.shadowBlur = 0;

      // Garis Dashed
      ctx.strokeStyle = "rgba(6,207,156,.30)"; ctx.lineWidth = 2;
      ctx.setLineDash([10, 24]); ctx.lineDashOffset = -game.groundOffset;
      ctx.beginPath(); ctx.moveTo(-20, groundY + 10); ctx.lineTo(W + 20, groundY + 10); ctx.stroke();
      ctx.setLineDash([]);

      // Debu Tanah
      ctx.fillStyle = "rgba(6,207,156,.22)";
      for (let i = 0; i < 30; i++) {
        const dx = (97 * i + -1 * game.groundOffset2) % (W + 100) - 50;
        const dy = groundY + 22 + (i % 3) * 14;
        ctx.fillRect(dx, dy, 3, 2);
      }

      // Efek Kecepatan (Motion Lines)
      if (game.phase === "playing" && game.speed > 8) {
        const intensity = (game.speed - 8) / 6;
        ctx.strokeStyle = `rgba(6,207,156,${.1 * intensity})`;
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 8; i++) {
          const ly = H * 0.15 + (71 * i) % (H * 0.8);
          const lx = W - ((performance.now() * game.speed * 0.6 + 140 * i) % (W + 200));
          ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 90 * intensity, ly); ctx.stroke();
        }
      }

      // Game Objects
      for (const c of game.coinsList) drawCoin(c.x, c.y, c.r, c.phase);
      for (const o of game.obstacles) {
        if (o.type === "cactus_small") drawCactus(o, false);
        else if (o.type === "cactus_large") drawCactus(o, true);
        else if (o.type === "rock") drawRock(o);
        else if (o.type === "bird") drawBird(o);
      }

      // Player (Dino)
      const p = game.player;
      const px = 0.16 * W;
      const isGhost = p.invincible > 0 && Math.floor(14 * p.invincible) % 2 === 0;
      
      if (game.phase === "menu" || game.phase === "over") {
        drawDino(px, groundY, p.w, p.h, 0, false, 0, false);
      } else {
        if (isGhost) {
          ctx.save(); ctx.globalAlpha = 0.4; drawDino(px, p.bottomY, p.w, p.h, p.legPhase, !p.onGround, p.squash, true); ctx.restore();
        } else {
          if (p.invincible <= 0) {
            ctx.save(); ctx.shadowColor = "rgba(6,207,156,.55)"; ctx.shadowBlur = 26;
            ctx.fillStyle = "#06cf9c"; rr(px - 0.4 * p.w, p.bottomY - 0.9 * p.h, 0.8 * p.w, 0.8 * p.h, 12); ctx.fill();
            ctx.restore();
          }
          drawDino(px, p.bottomY, p.w, p.h, p.legPhase, !p.onGround, p.squash, false);
        }
      }

      // Efek Partikel
      for (const d of game.dust) {
        ctx.globalAlpha = .5 * Math.max(0, d.life);
        ctx.fillStyle = "#06cf9c"; ctx.beginPath(); ctx.arc(d.x, d.y, d.size * d.life, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const p of game.particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const f of game.floaties) {
        ctx.globalAlpha = Math.max(0, f.life);
        ctx.font = '800 22px -apple-system, sans-serif';
        ctx.fillStyle = f.color; ctx.textAlign = "center";
        ctx.shadowColor = f.color; ctx.shadowBlur = 16;
        ctx.fillText(f.text, f.x, f.y);
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;

      // Flash Screen
      if (game.flash > 0) {
        ctx.fillStyle = game.flashColor.replace(/[\d.]+\)$/, (0.55 * game.flash) + ")");
        ctx.fillRect(-20, -20, W + 40, H + 40);
      }

      ctx.restore();

      // UI di atas segalanya
      drawUI();
      drawOverlay();
    }

    // ==========================================
    // GAME LOOP
    // ==========================================
    let lastTime = performance.now();

    function update(dt) {
      if (game.phase === "playing") {
        updatePlayer(dt);
        updateWorld(dt);
      } else {
        // Idle animation
        game.player.legPhase += .12 * dt;
      }

      if (game.shake > 0) game.shake = Math.max(0, game.shake - .7 * dt);
      if (game.flash > 0) game.flash = Math.max(0, game.flash - .035 * dt);
      
      updateParticles(dt);
    }

    function loop(now) {
      const dt = Math.min(2.5, (now - lastTime) / 16.667);
      lastTime = now;
      
      update(dt);
      draw();
      
      requestAnimationFrame(loop);
    }

    // ==========================================
    // INPUT HANDLING
    // ==========================================
    function handlePointerDown(e) {
      if (e.cancelable) e.preventDefault();
      
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Cek Klik Tombol Restart
      if (game.phase === "over") {
        if (x >= btnRestart.x && x <= btnRestart.x + btnRestart.w && 
            y >= btnRestart.y && y <= btnRestart.y + btnRestart.h) {
          startGame();
          return;
        }
      }

      // Kontrol Game
      if (game.phase === "menu") {
        startGame();
      } else if (game.phase === "playing") {
        doJump();
      }
    }

    window.addEventListener("pointerdown", handlePointerDown, { passive: false });
    
    // Keyboard support (Spasi / Panah Atas)
    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "w", "W"].includes(e.code) || ["Space", "ArrowUp", "w", "W"].includes(e.key)) {
        e.preventDefault();
        if (game.phase === "menu") startGame();
        else if (game.phase === "playing") doJump();
      }
    }, { passive: false });

    // Mencegah context menu / zoom gestures
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });

    // ==========================================
    // INISIALISASI
    // ==========================================
    resize();
    game.player.bottomY = groundY;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
