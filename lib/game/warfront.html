<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#070a0e">
  <title>Warfront Commando - 2D War Zone</title>
  <style>
    *,
    ::after,
    ::before {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2.2vw, 24px);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #eaf2ff;
      background: radial-gradient(1200px 700px at 15% -10%, rgba(239, 68, 68, .22), transparent 62%), radial-gradient(1000px 700px at 88% 0, rgba(245, 158, 11, .18), transparent 60%), radial-gradient(900px 800px at 50% 120%, rgba(59, 130, 246, .16), transparent 62%), #070a0e;
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative
    }

    body::before {
      content: "";
      position: fixed;
      inset: -25vmax;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(38vmax 38vmax at 18% 14%, rgba(220, 38, 38, .28), transparent 60%), radial-gradient(34vmax 34vmax at 82% 20%, rgba(245, 158, 11, .22), transparent 60%), radial-gradient(40vmax 40vmax at 50% 92%, rgba(15, 23, 42, .5), transparent 62%);
      filter: blur(28px);
      animation: drift 26s ease-in-out infinite alternate
    }

    @keyframes drift {
      0% {
        transform: translate3d(-1.5%, 0, 0) scale(1)
      }

      100% {
        transform: translate3d(1.5%, -2%, 0) scale(1.1)
      }
    }

    .glass {
      background: linear-gradient(158deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .028) 46%, rgba(255, 255, 255, .07));
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 20px;
      backdrop-filter: blur(22px) saturate(175%);
      -webkit-backdrop-filter: blur(22px) saturate(175%);
      box-shadow: 0 18px 46px rgba(0, 0, 0, .58), inset 0 1px 0 rgba(255, 255, 255, .2), inset 0 -1px 0 rgba(255, 255, 255, .05)
    }

    .app {
      width: min(100%, 880px);
      display: flex;
      flex-direction: column;
      gap: clamp(9px, 1.5vw, 15px);
      margin: auto
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: clamp(9px, 1.5vw, 15px) clamp(12px, 2vw, 20px);
      border-radius: 22px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.6vw, 13px);
      min-width: 0
    }

    .logo {
      flex: none;
      width: clamp(38px, 7.5vw, 50px);
      height: clamp(38px, 7.5vw, 50px);
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: clamp(19px, 3.8vw, 26px);
      background: linear-gradient(140deg, #ef4444, #f59e0b);
      box-shadow: 0 10px 30px rgba(239, 68, 68, .45), inset 0 1px 0 rgba(255, 255, 255, .55)
    }

    .brand-txt {
      min-width: 0
    }

    .brand-txt h1 {
      margin: 0;
      font-size: clamp(13px, 2.4vw, 18px);
      font-weight: 800;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .brand-txt p {
      margin: 2px 0 0;
      font-size: clamp(9.5px, 1.6vw, 12px);
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .status {
      flex: none;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: clamp(9px, 1.5vw, 11px);
      font-weight: 800;
      letter-spacing: .12em;
      color: #cbd5e1;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      white-space: nowrap
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 1.6s ease-in-out infinite
    }

    .status.ready .dot {
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8
    }

    .status.play .dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444
    }

    .status.over .dot {
      background: #64748b;
      box-shadow: 0 0 10px #64748b;
      animation: none
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .35;
        transform: scale(.72)
      }
    }

    .stage {
      position: relative;
      padding: clamp(5px, 1vw, 9px);
      border-radius: 26px;
      overflow: hidden
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 26px;
      background: linear-gradient(140deg, rgba(255, 255, 255, .14), transparent 30%, transparent 70%, rgba(255, 255, 255, .06));
      mix-blend-mode: overlay
    }

    #gameCanvas {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 20px;
      background: #090d14;
      touch-action: none
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(7px, 1.3vw, 12px)
    }

    .stat {
      padding: clamp(8px, 1.4vw, 13px) 6px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center
    }

    .stat-label {
      font-size: clamp(8px, 1.5vw, 10px);
      font-weight: 800;
      letter-spacing: .16em;
      color: #94a3b8;
      text-transform: uppercase
    }

    .stat strong {
      font-size: clamp(14px, 3.2vw, 22px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      color: #f87171;
      text-shadow: 0 0 20px rgba(239, 68, 68, .55);
      line-height: 1.15
    }

    .stat:nth-child(2) strong {
      color: #fbbf24;
      text-shadow: 0 0 20px rgba(251, 191, 36, .55)
    }

    .stat:nth-child(3) strong {
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, .45)
    }

    .hint {
      margin: 0;
      padding: clamp(9px, 1.5vw, 13px) clamp(12px, 2vw, 18px);
      border-radius: 16px;
      font-size: clamp(10px, 1.7vw, 12.5px);
      line-height: 1.55;
      color: #94a3b8;
      text-align: center
    }

    .hint kbd {
      display: inline-block;
      padding: 1px 7px;
      margin: 0 1px;
      border-radius: 7px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .35);
      font-family: inherit;
      font-size: .92em;
      font-weight: 700;
      color: #f1f5f9
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1.35fr;
      gap: clamp(8px, 1.3vw, 12px)
    }

    .ctrl {
      position: relative;
      min-height: clamp(52px, 8.5vh, 68px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .15);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(11.5px, 2.1vw, 14px);
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      overflow: hidden;
      background: linear-gradient(158deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .035));
      backdrop-filter: blur(16px) saturate(165%);
      -webkit-backdrop-filter: blur(16px) saturate(165%);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .24);
      transition: transform .1s ease, box-shadow .22s ease, filter .22s ease
    }

    .ctrl span {
      position: relative;
      z-index: 1
    }

    .ctrl::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255, 255, 255, .22), transparent 55%);
      opacity: .6;
      pointer-events: none
    }

    .ctrl.fire {
      border-color: rgba(239, 68, 68, .5);
      background: linear-gradient(140deg, #ef4444, #dc2626 45%, #b91c1c 100%);
      box-shadow: 0 14px 34px rgba(220, 38, 38, .45), inset 0 1px 0 rgba(255, 255, 255, .55)
    }

    .ctrl.jump {
      border-color: rgba(245, 158, 11, .5);
      background: linear-gradient(140deg, #f59e0b, #d97706 45%, #b45309 100%);
      box-shadow: 0 14px 34px rgba(217, 119, 6, .45), inset 0 1px 0 rgba(255, 255, 255, .55)
    }

    .ctrl:active {
      transform: translateY(2px) scale(.985);
      filter: brightness(1.1)
    }

    @media (hover:hover) {
      .ctrl:hover {
        filter: brightness(1.12)
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 7, 12, .75);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%)
    }

    .overlay.show {
      display: flex;
      animation: fadeIn .22s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal {
      width: min(94vw, 400px);
      padding: clamp(22px, 4vw, 30px);
      border-radius: 26px;
      text-align: center;
      animation: pop .3s cubic-bezier(.2, .9, .3, 1.2)
    }

    @keyframes pop {
      from {
        transform: translateY(14px) scale(.94);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .modalIcon {
      width: 74px;
      height: 74px;
      margin: 0 auto 12px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 36px;
      background: linear-gradient(140deg, rgba(239, 68, 68, .4), rgba(245, 158, 11, .26));
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: 0 14px 40px rgba(239, 68, 68, .4), inset 0 1px 0 rgba(255, 255, 255, .28)
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: clamp(20px, 4.2vw, 25px);
      letter-spacing: .06em;
      font-weight: 800
    }

    .modal .final {
      margin: 0 0 4px;
      font-size: clamp(12px, 2.2vw, 14px);
      color: #94a3b8
    }

    .modal .final b {
      color: #f87171;
      font-variant-numeric: tabular-nums;
      font-size: 1.25em
    }

    .modal .best {
      margin: 0 0 20px;
      font-size: clamp(10px, 1.8vw, 12px);
      color: #fbbf24;
      letter-spacing: .08em;
      font-weight: 700
    }

    .btn-restart {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(13px, 2.4vw, 15px);
      letter-spacing: .05em;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(140deg, #ef4444, #dc2626 40%, #ea580c);
      box-shadow: 0 16px 38px rgba(220, 38, 38, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: transform .1s ease, filter .2s ease
    }

    .btn-restart:active {
      transform: scale(.975);
      filter: brightness(1.1)
    }

    @media (max-width:440px) {
      .topbar {
        border-radius: 18px
      }

      .hint {
        display: none
      }

      .brand-txt p {
        display: none
      }
    }

    @media (max-height:640px) {
      .hint {
        display: none
      }

      .ctrl {
        min-height: 48px
      }
    }
  </style>
</head>

  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="logo">🎖️</div>
        <div class="brand-txt">
          <h1>Warfront: Commando Run</h1>
          <p>Tembak musuh &amp; lewati rintangan tempur</p>
        </div>
      </div>
      <div class="status ready" id="statusBox"><span class="dot"></span><span id="statusLabel">SIAP TEMPUR</span></div>
    </header>
    <div class="stage glass"><canvas id="gameCanvas" width="640" height="360"></canvas></div>
    <div class="hud">
      <div class="stat glass"><span class="stat-label">Skor Tempur</span> <strong id="scoreVal">00000</strong></div>
      <div class="stat glass"><span class="stat-label">Rekor</span> <strong id="highScoreVal">00000</strong></div>
      <div class="stat glass"><span class="stat-label">Eliminasi</span> <strong id="killVal">000</strong></div>

    <p class="hint glass"><kbd>Spasi</kbd> / <kbd>↑</kbd> lompat &nbsp;•&nbsp; <kbd>↓</kbd> merayap &nbsp;•&nbsp; <kbd>F</kbd> / <kbd>X</kbd> tembak senapan</p>

      <div class="modalIcon">💥</div>
      <h2>GUGUR DI MEDAN TEMPUR</h2>

      <p class="best" id="bestDesc">REKOR TERTINGGI: 0</p><button class="btn-restart" id="btnRestart">🔄 TEMPUR LAGI</button>
    </div>
  </div>
