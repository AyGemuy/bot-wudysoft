<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Piano Bot — Piano Virtual</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      overscroll-behavior: none; background: #0b141a; touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9edef; user-select: none; -webkit-user-select: none;
      position: fixed; inset: 0;
    }
    canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // ============================================================
    // AUDIO (unchanged synthesis from original)
    // ============================================================
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const KEY_MAP = {
      z:60, s:61, x:62, d:63, c:64, v:65, g:66, b:67, h:68, n:69, j:70, m:71,
      q:72, 2:73, w:74, 3:75, e:76, r:77, 5:78, t:79, 6:80, y:81, 7:82, u:83
    };
    const LABEL_BY_MIDI = {};
    for (const [k, v] of Object.entries(KEY_MAP)) LABEL_BY_MIDI[v] = k.toUpperCase();
    const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);

    let audioCtx = null, masterGain = null, compressor = null,
        reverbNode = null, wetGain = null, audioReady = false;

    function createReverbIR(dur = 2, decay = 2.8) {
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * dur);
      const buf = audioCtx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < len; i++)
          data[i] = (2 * Math.random() - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }

    function initAudio() {
      if (audioReady) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = volume * 0.9;
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -16;
      compressor.knee.value = 22;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.28;
      reverbNode = audioCtx.createConvolver();
      reverbNode.buffer = createReverbIR(2, 2.8);
      wetGain = audioCtx.createGain();
      wetGain.gain.value = 0.22;

      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);
      masterGain.connect(reverbNode);
      reverbNode.connect(wetGain);
      wetGain.connect(audioCtx.destination);
      audioReady = true;
    }

    function playPianoNote(midi, vel = 1) {
      if (!audioReady) return;
      const t = audioCtx.currentTime;
      const f = midiToFreq(midi);
      const out = audioCtx.createGain();
      out.gain.value = 1;

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(Math.min(14 * f, 12000), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(2.5 * f, 200), t + 2.2);

      const env = audioCtx.createGain();
      const peak = 0.32 * vel;
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(peak, t + 0.004);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 2.404);

      const partials = [
        { mul: 1,     gain: 0.55, type: "triangle", detune:  0 },
        { mul: 2.001, gain: 0.24, type: "triangle", detune: -2 },
        { mul: 3.012, gain: 0.12, type: "sine",     detune:  2 },
        { mul: 4.024, gain: 0.06, type: "sine",     detune: -3 },
        { mul: 5.038, gain: 0.032,type: "sine",     detune:  3 },
        { mul: 6.054, gain: 0.018,type: "sine",     detune: -1 }
      ];
      for (const p of partials) {
        const o = audioCtx.createOscillator();
        o.type = p.type;
        o.frequency.value = f * p.mul;
        o.detune.value = p.detune;
        const g = audioCtx.createGain();
        g.gain.value = p.gain;
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + 2.8);
      }

      // hammer noise
      const nlen = Math.floor(0.035 * audioCtx.sampleRate);
      const nbuf = audioCtx.createBuffer(1, nlen, audioCtx.sampleRate);
      const nd = nbuf.getChannelData(0);
      for (let i = 0; i < nlen; i++)
        nd[i] = (2 * Math.random() - 1) * Math.pow(1 - i / nlen, 2);
      const nsrc = audioCtx.createBufferSource();
      nsrc.buffer = nbuf;
      const nf = audioCtx.createBiquadFilter();
      nf.type = "bandpass";
      nf.frequency.value = Math.min(4.5 * f, 8000);
      nf.Q.value = 1.8;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.14 * vel, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      nsrc.connect(nf); nf.connect(ng); ng.connect(out);

      lp.connect(env);
      env.connect(out);
      out.connect(masterGain);
      nsrc.start(t);
    }

    // ============================================================
    // CANVAS + STATE
    // ============================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let W = 0, H = 0;
    let volume = 0.7;

    const piano = { whiteKeys: [], blackKeys: [], x: 0, y: 0, w: 0, h: 0 };
    const keyByMidi = new Map();
    const pressed = new Set();
    const heldKeys = new Set();
    const activePointers = new Map();

    const ui = {
      leftPanel: null,
      volPanel: null,
      isMobile: false,
      isShort: false,
    };

    let heroFadeStart = null;
    let hintStart = null;
    let lastNote = "—";
    let lastNotePopTime = 0;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function rr(x, y, w, h, r) {
      ctx.beginPath();
      if (typeof ctx.roundRect === "function") {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
      ctx.moveTo(x + tl, y);
      ctx.lineTo(x + w - tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
      ctx.lineTo(x + w, y + h - br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      ctx.lineTo(x + bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
      ctx.lineTo(x, y + tl);
      ctx.quadraticCurveTo(x, y, x + tl, y);
      ctx.closePath();
    }

    // ============================================================
    // LAYOUT
    // ============================================================
    function layout() {
      const isMobile = W < 820;
      const isShort = H < 560;
      const isNarrow = W < 760;
      ui.isMobile = isMobile;
      ui.isShort = isShort;

      // --- piano frame ---
      const pad = isMobile ? 8 : 24;
      const bottomPad = isMobile ? 12 : 24;
      let pianoH = isShort ? 160
        : isMobile ? clamp(H * 0.34, 180, 280)
        : clamp(H * 0.42, 200, 400);

      const maxW = 1180;
      const pianoW = Math.min(W - pad * 2, maxW);
      piano.x = (W - pianoW) / 2;
      piano.y = H - bottomPad - pianoH;
      piano.w = pianoW;
      piano.h = pianoH;

      // --- keys ---
      const octaves = isNarrow ? 1 : 2;
      const whiteCount = 7 * octaves;
      const whiteW = pianoW / whiteCount;
      const blackW = whiteW * 0.6;
      const blackH = pianoH * 0.62;

      piano.whiteKeys = [];
      piano.blackKeys = [];
      keyByMidi.clear();

      const whiteSpec = [
        { sem: 0,  idx: 0 }, // C
        { sem: 2,  idx: 1 }, // D
        { sem: 4,  idx: 2 }, // E
        { sem: 5,  idx: 3 }, // F
        { sem: 7,  idx: 4 }, // G
        { sem: 9,  idx: 5 }, // A
        { sem: 11, idx: 6 }, // B
      ];
      const blackSpec = [
        { sem: 1,  afterWhite: 0 }, // C#
        { sem: 3,  afterWhite: 1 }, // D#
        { sem: 6,  afterWhite: 3 }, // F#
        { sem: 8,  afterWhite: 4 }, // G#
        { sem: 10, afterWhite: 5 }, // A#
      ];

      for (let oct = 0; oct < octaves; oct++) {
        const baseMidi = 60 + oct * 12;
        const baseWhite = oct * 7;

        for (const w of whiteSpec) {
          const midi = baseMidi + w.sem;
          const key = {
            midi,
            name: NOTE_NAMES[w.sem] + (Math.floor(midi / 12) - 1),
            label: LABEL_BY_MIDI[midi] || "",
            x: piano.x + (baseWhite + w.idx) * whiteW,
            y: piano.y,
            w: whiteW,
            h: pianoH,
            isBlack: false,
          };
          piano.whiteKeys.push(key);
          keyByMidi.set(midi, key);
        }

        for (const b of blackSpec) {
          const midi = baseMidi + b.sem;
          const cx = piano.x + (baseWhite + b.afterWhite + 1) * whiteW;
          const key = {
            midi,
            name: NOTE_NAMES[b.sem] + (Math.floor(midi / 12) - 1),
            label: LABEL_BY_MIDI[midi] || "",
            x: cx - blackW / 2,
            y: piano.y,
            w: blackW,
            h: blackH,
            isBlack: true,
          };
          piano.blackKeys.push(key);
          keyByMidi.set(midi, key);
        }
      }

      // --- HUD ---
      ui.leftPanel = { x: 12, y: 12, w: 176, h: 48 };

      const vpW = isMobile ? 120 : 140;
      ui.volPanel = {
        x: W - vpW - 12,
        y: 12,
        w: vpW,
        h: 44,
        sliderX: W - vpW - 12 + 36,
        sliderY: 12 + 44 / 2 - 2,
        sliderW: vpW - 48,
      };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layout();
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 250));

    // ============================================================
    // STATE HELPERS
    // ============================================================
    function triggerKey(key) {
      if (pressed.has(key.midi)) return;
      pressed.add(key.midi);
      initAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      playPianoNote(key.midi, 1);
      lastNote = key.name;
      lastNotePopTime = performance.now();

      if (heroFadeStart === null) {
        heroFadeStart = performance.now();
        hintStart = performance.now();
      }
    }

    function releaseKey(key) {
      pressed.delete(key.midi);
    }

    function getKeyAt(x, y) {
      // black keys on top
      for (const k of piano.blackKeys) {
        if (x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h) return k;
      }
      for (const k of piano.whiteKeys) {
        if (x >= k.x && x <= k.x + k.w && y >= k.y && y <= k.y + k.h) return k;
      }
      return null;
    }

    function isInVolumeSlider(x, y) {
      const vp = ui.volPanel;
      return x >= vp.sliderX - 12 && x <= vp.sliderX + vp.sliderW + 12 &&
             y >= vp.sliderY - 14 && y <= vp.sliderY + 4 + 14;
    }

    function updateVolumeFromX(x) {
      const vp = ui.volPanel;
      const t = clamp((x - vp.sliderX) / vp.sliderW, 0, 1);
      volume = t;
      initAudio();
      if (masterGain) masterGain.gain.value = t * 0.9;
    }

    // ============================================================
    // ANIMATION HELPERS
    // ============================================================
    function getHeroAlpha(now) {
      if (heroFadeStart === null) return 1;
      const elapsed = now - heroFadeStart;
      return Math.max(0, 1 - elapsed / 500);
    }

    function getHintAlpha(now) {
      if (hintStart === null) return 0;
      const elapsed = now - hintStart;
      if (elapsed < 300) return (elapsed / 300) * 0.7;
      if (elapsed < 4500) return 0.7;
      return Math.max(0, 0.7 * (1 - (elapsed - 4500) / 500));
    }

    function getPopScale(now) {
      if (!lastNotePopTime) return 1;
      const elapsed = now - lastNotePopTime;
      if (elapsed > 350) return 1;
      const t = elapsed / 350;
      if (t < 0.4) return 1 + (t / 0.4) * 0.3;
      return 1.3 - ((t - 0.4) / 0.6) * 0.3;
    }

    // ============================================================
    // DRAW: BACKGROUND
    // ============================================================
    function drawBackground() {
      const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H));
      bg.addColorStop(0, "#13222b");
      bg.addColorStop(1, "#0b141a");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
    }

    // ============================================================
    // DRAW: PIANO
    // ============================================================
    function drawPianoFrame() {
      const rTop = ui.isMobile ? 10 : 14;
      const rBot = ui.isMobile ? 6 : 8;

      ctx.save();
      // outer shadow
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 12;

      ctx.fillStyle = "#0a1015";
      rr(piano.x, piano.y, piano.w, piano.h, [rTop, rTop, rBot, rBot]);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // outer border
      ctx.strokeStyle = "rgba(255,255,255,.05)";
      ctx.lineWidth = 1;
      rr(piano.x, piano.y, piano.w, piano.h, [rTop, rTop, rBot, rBot]);
      ctx.stroke();

      // top green accent
      const grad = ctx.createLinearGradient(piano.x, piano.y, piano.x, piano.y + 6);
      grad.addColorStop(0, "rgba(6,207,156,.32)");
      grad.addColorStop(1, "rgba(6,207,156,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(piano.x + 4, piano.y, piano.w - 8, 6);

      // ambient glow
      ctx.shadowColor = "rgba(6,207,156,.08)";
      ctx.shadowBlur = 100;
      ctx.fillStyle = "rgba(0,0,0,0)";
      rr(piano.x, piano.y, piano.w, piano.h, [rTop, rTop, rBot, rBot]);
      ctx.fill();
      ctx.restore();
    }

    function drawWhiteKey(k) {
      const p = pressed.has(k.midi);
      const shift = p ? 3 : 0;
      const y = k.y + shift;
      const h = k.h - shift;
      const r = Math.min(8, k.w / 2);

      ctx.save();

      if (p) {
        ctx.shadowColor = "rgba(6,207,156,.55)";
        ctx.shadowBlur = 24;
      }

      const grad = ctx.createLinearGradient(k.x, y, k.x, y + h);
      if (p) {
        grad.addColorStop(0, "#d6f5ea");
        grad.addColorStop(0.2, "#b8ead6");
        grad.addColorStop(0.6, "#98dcc4");
        grad.addColorStop(1, "#78ccb0");
      } else {
        grad.addColorStop(0, "#f7f7f4");
        grad.addColorStop(0.04, "#ececea");
        grad.addColorStop(0.55, "#dcdcda");
        grad.addColorStop(0.88, "#c8c8c6");
        grad.addColorStop(1, "#b6b6b4");
      }
      ctx.fillStyle = grad;
      rr(k.x, y, k.w, h, [0, 0, r, r]);
      ctx.fill();
      ctx.shadowBlur = 0;

      // right divider
      const isLast = k.x + k.w >= piano.x + piano.w - 0.5;
      if (!isLast) {
        ctx.fillStyle = "rgba(0,0,0,.14)";
        ctx.fillRect(k.x + k.w - 1, y, 1, h - r);
      }

      // bottom dark edge (border-bottom equivalent)
      const borderH = p ? 1 : 3;
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.fillRect(k.x, y + h - borderH, k.w, borderH);

      // top highlight
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.fillRect(k.x + 1, y + 1, k.w - 2, 2);

      // labels
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      if (!ui.isMobile) {
        ctx.fillStyle = p ? "rgba(0,60,45,.5)" : "rgba(17,27,33,.28)";
        ctx.font = "700 9px ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
        ctx.fillText(k.name, k.x + k.w / 2, y + h - 6);
      }

      if (k.label) {
        ctx.fillStyle = p ? "rgba(0,60,45,.8)" : "rgba(17,27,33,.4)";
        ctx.font = "800 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
        const labelY = ui.isMobile ? y + h - 6 : y + h - 20;
        ctx.fillText(k.label, k.x + k.w / 2, labelY);
      }

      ctx.restore();
    }

    function drawBlackKey(k) {
      const p = pressed.has(k.midi);
      const shift = p ? 2 : 0;
      const y = k.y + shift;
      const h = k.h - shift;
      const r = Math.min(6, k.w / 2);

      ctx.save();

      if (p) {
        ctx.shadowColor = "rgba(6,207,156,.7)";
        ctx.shadowBlur = 24;
      } else {
        ctx.shadowColor = "rgba(0,0,0,.55)";
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 4;
      }

      const grad = ctx.createLinearGradient(k.x, y, k.x, y + h);
      if (p) {
        grad.addColorStop(0, "#0d3b2d");
        grad.addColorStop(0.3, "#0d5540");
        grad.addColorStop(1, "#06cf9c");
      } else {
        grad.addColorStop(0, "#3a424a");
        grad.addColorStop(0.35, "#262c33");
        grad.addColorStop(0.78, "#181d23");
        grad.addColorStop(1, "#0c1116");
      }
      ctx.fillStyle = grad;
      rr(k.x, y, k.w, h, [0, 0, r, r]);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // top highlight
      if (!p) {
        ctx.fillStyle = "rgba(255,255,255,.12)";
        ctx.fillRect(k.x + 1, y + 1, k.w - 2, 2);
      }

      // label
      if (k.label) {
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillStyle = p ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.28)";
        ctx.font = "800 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
        ctx.fillText(k.label, k.x + k.w / 2, y + h - 8);
      }

      ctx.restore();
    }

    function drawPiano() {
      drawPianoFrame();

      ctx.save();
      // clip to piano inner area so keys don't bleed
      rr(piano.x, piano.y, piano.w, piano.h, [ui.isMobile ? 10 : 14, ui.isMobile ? 10 : 14, ui.isMobile ? 6 : 8, ui.isMobile ? 6 : 8]);
      ctx.clip();

      for (const k of piano.whiteKeys) drawWhiteKey(k);
      for (const k of piano.blackKeys) drawBlackKey(k);

      ctx.restore();
    }

    // ============================================================
    // DRAW: HUD
    // ============================================================
    function drawHUD(popScale) {
      // ----- left panel: brand + last note -----
      const lp = ui.leftPanel;
      ctx.save();

      ctx.fillStyle = "rgba(11,20,26,.78)";
      rr(lp.x, lp.y, lp.w, lp.h, 12);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.06)";
      ctx.lineWidth = 1;
      rr(lp.x, lp.y, lp.w, lp.h, 12);
      ctx.stroke();

      // icon
      ctx.font = "20px -apple-system, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("🎹", lp.x + 12, lp.y + lp.h / 2);

      // title
      ctx.fillStyle = "#e9edef";
      ctx.font = "700 13px -apple-system, sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText("Piano Bot", lp.x + 42, lp.y + 8);

      // last note label
      ctx.fillStyle = "#8696a0";
      ctx.font = "700 9px -apple-system, sans-serif";
      ctx.fillText("NADA", lp.x + 42, lp.y + 28);

      // last note value with pop
      ctx.save();
      ctx.translate(lp.x + 78, lp.y + 32);
      ctx.scale(popScale, popScale);
      ctx.fillStyle = "#06cf9c";
      ctx.font = "800 13px -apple-system, sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(lastNote, 0, 0);
      ctx.restore();

      ctx.restore();

      // ----- right panel: volume -----
      const vp = ui.volPanel;
      ctx.save();

      ctx.fillStyle = "rgba(11,20,26,.78)";
      rr(vp.x, vp.y, vp.w, vp.h, 12);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.06)";
      ctx.lineWidth = 1;
      rr(vp.x, vp.y, vp.w, vp.h, 12);
      ctx.stroke();

      // speaker icon
      ctx.font = "16px -apple-system, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#8696a0";
      ctx.fillText("🔊", vp.x + 12, vp.y + vp.h / 2);

      // slider track
      const trackY = vp.sliderY;
      ctx.fillStyle = "rgba(255,255,255,.12)";
      rr(vp.sliderX, trackY, vp.sliderW, 4, 2);
      ctx.fill();

      // slider fill
      ctx.fillStyle = "#06cf9c";
      rr(vp.sliderX, trackY, Math.max(2, vp.sliderW * volume), 4, 2);
      ctx.fill();

      // thumb
      ctx.beginPath();
      ctx.arc(vp.sliderX + vp.sliderW * volume, trackY + 2, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#06cf9c";
      ctx.shadowColor = "rgba(6,207,156,.7)";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();
    }

    // ============================================================
    // DRAW: HERO
    // ============================================================
    function drawHero(alpha) {
      if (alpha <= 0.001) return;

      const cx = W / 2;
      const cy = piano.y * 0.48;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // icon
      const floatY = Math.sin(performance.now() / 1000) * 4;
      ctx.font = (ui.isMobile ? "52px" : "64px") + " -apple-system, sans-serif";
      ctx.fillText("🎹", cx, cy - (ui.isMobile ? 60 : 80) + floatY);

      // title
      ctx.font = "800 " + (ui.isMobile ? 26 : 34) + "px -apple-system, sans-serif";
      ctx.fillStyle = "#e9edef";
      ctx.fillText("Piano Virtual", cx, cy - (ui.isMobile ? 4 : 10));

      // subtitle
      ctx.font = "500 " + (ui.isMobile ? 13 : 14) + "px -apple-system, sans-serif";
      ctx.fillStyle = "#8696a0";
      ctx.fillText("Mainkan dengan keyboard atau sentuh tuts.", cx, cy + (ui.isMobile ? 24 : 28));
      ctx.fillText("Tahan beberapa tuts untuk chord.", cx, cy + (ui.isMobile ? 44 : 50));

      ctx.restore();
    }

    // ============================================================
    // DRAW: HINT
    // ============================================================
    function drawHint(alpha) {
      if (alpha <= 0.001) return;

      const text = "Tahan beberapa tuts untuk chord";
      ctx.save();
      ctx.globalAlpha = alpha;

      ctx.font = "600 12px -apple-system, sans-serif";
      const tw = ctx.measureText(text).width;
      const pad = 14;
      const boxW = tw + pad * 2;
      const boxH = 28;
      const boxX = (W - boxW) / 2;
      const boxY = piano.y - 24 - boxH / 2;

      ctx.fillStyle = "rgba(32,44,51,.75)";
      rr(boxX, boxY, boxW, boxH, 8);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 1;
      rr(boxX, boxY, boxW, boxH, 8);
      ctx.stroke();

      ctx.fillStyle = "#8696a0";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, W / 2, piano.y - 24);

      ctx.restore();
    }

    // ============================================================
    // MAIN DRAW
    // ============================================================
    function draw() {
      const now = performance.now();

      ctx.clearRect(0, 0, W, H);
      drawBackground();

      drawHero(getHeroAlpha(now));
      drawHint(getHintAlpha(now));

      drawPiano();
      drawHUD(getPopScale(now));
    }

    // ============================================================
    // INPUT
    // ============================================================
    function handlePointerDown(e) {
      const x = e.clientX, y = e.clientY;

      if (isInVolumeSlider(x, y)) {
        updateVolumeFromX(x);
        activePointers.set(e.pointerId, { type: "volume" });
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        if (e.cancelable) e.preventDefault();
        return;
      }

      const k = getKeyAt(x, y);
      if (k) {
        triggerKey(k);
        activePointers.set(e.pointerId, { type: "key", key: k });
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        if (e.cancelable) e.preventDefault();
      }
    }

    function handlePointerMove(e) {
      const entry = activePointers.get(e.pointerId);
      if (!entry) return;

      if (entry.type === "volume") {
        updateVolumeFromX(e.clientX);
      } else if (entry.type === "key") {
        const k = getKeyAt(e.clientX, e.clientY);
        if (k && k.midi !== entry.key.midi) {
          releaseKey(entry.key);
          triggerKey(k);
          entry.key = k;
        } else if (!k) {
          releaseKey(entry.key);
          activePointers.delete(e.pointerId);
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }
    }

    function handlePointerUp(e) {
      const entry = activePointers.get(e.pointerId);
      if (!entry) return;
      if (entry.type === "key") releaseKey(entry.key);
      activePointers.delete(e.pointerId);
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    canvas.addEventListener("pointerdown", handlePointerDown, { passive: false });
    canvas.addEventListener("pointermove", handlePointerMove);
    canvas.addEventListener("pointerup", handlePointerUp);
    canvas.addEventListener("pointercancel", handlePointerUp);
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    // ============================================================
    // KEYBOARD
    // ============================================================
    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      const midi = KEY_MAP[key];
      if (midi === undefined) return;
      if (e.repeat) return;
      if (heldKeys.has(midi)) return;
      heldKeys.add(midi);
      e.preventDefault();
      const k = keyByMidi.get(midi);
      if (k) triggerKey(k);
    }, { passive: false });

    window.addEventListener("keyup", e => {
      const key = e.key.toLowerCase();
      const midi = KEY_MAP[key];
      if (midi === undefined) return;
      heldKeys.delete(midi);
      const k = keyByMidi.get(midi);
      if (k) releaseKey(k);
    });

    // prevent zoom / gesture / double-tap
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

    // init audio on first interaction (unlock for mobile)
    ["pointerdown", "keydown", "touchstart"].forEach(evt => {
      document.addEventListener(evt, () => {
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }, { once: true });
    });

    // ============================================================
    // ANIMATION LOOP
    // ============================================================
    function loop() {
      draw();
      requestAnimationFrame(loop);
    }

    // ============================================================
    // INIT
    // ============================================================
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
