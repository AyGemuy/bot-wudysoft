<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Piano Bot — Piano Virtual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0b141a;
      --bg2: #111b21;
      --panel: #202c33;
      --green: #00a884;
      --green-d: #005c4b;
      --green-l: #06cf9c;
      --tx: #e9edef;
      --tx2: #8696a0;
      --line: #2a3942;
      --red: #f15c6d;
      --amber: #ffb74d
    }

    body,
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      inset: 0
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      flex-direction: column
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 20px 30px 70px;
      display: flex;
      align-items: center;
      gap: 26px;
      background: linear-gradient(180deg, rgba(11, 20, 26, .94) 0, rgba(11, 20, 26, .6) 55%, transparent 100%);
      pointer-events: none
    }

    .top>* {
      pointer-events: auto
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green-l), var(--green));
      display: grid;
      place-items: center;
      font-size: 21px;
      box-shadow: 0 6px 20px rgba(0, 168, 132, .35)
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.2px
    }

    .brand-sub {
      font-size: 11px;
      color: var(--tx2);
      font-weight: 500;
      margin-top: 1px
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 12.5px;
      color: var(--tx2);
      font-weight: 600;
      margin-left: auto;
      margin-right: auto;
      letter-spacing: .03em;
      text-transform: uppercase;
      pointer-events: none
    }

    .hud b {
      color: var(--tx);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 16px;
      letter-spacing: -.3px;
      margin-left: 5px;
      text-transform: none
    }

    .hud b.green {
      color: var(--green-l)
    }

    .hud-last {
      display: inline-block;
      transition: transform .15s
    }

    .hud-last.pop {
      animation: notePop .35s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes notePop {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.3);
        color: #06cf9c
      }

      100% {
        transform: scale(1)
      }
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--tx2)
    }

    .volume input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, .12);
      border-radius: 2px;
      outline: 0;
      cursor: pointer
    }

    .volume input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--green-l);
      box-shadow: 0 0 10px rgba(6, 207, 156, .7);
      cursor: pointer
    }

    .volume input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--green-l);
      border: none;
      box-shadow: 0 0 10px rgba(6, 207, 156, .7);
      cursor: pointer
    }

    .hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-align: center;
      padding: 24px;
      pointer-events: none;
      transition: opacity .5s ease, transform .5s ease
    }

    .hero.hidden {
      opacity: 0;
      transform: translate(-50%, -58%)
    }

    .hero-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      filter: drop-shadow(0 12px 34px rgba(6, 207, 156, .35));
      animation: heroFloat 3s ease-in-out infinite
    }

    @keyframes heroFloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    .hero-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -.9px;
      color: var(--tx);
      margin-bottom: 14px
    }

    .hero-text {
      font-size: 14.5px;
      color: var(--tx2);
      line-height: 1.75;
      max-width: 560px;
      font-weight: 400
    }

    .hero-text b {
      color: var(--tx);
      font-weight: 700
    }

    .mapping {
      display: inline-block;
      margin-top: 14px;
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: var(--green-l);
      background: rgba(6, 207, 156, .08);
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(6, 207, 156, .15);
      line-height: 1.9;
      letter-spacing: .02em
    }

    .mapping kbd {
      display: inline-block;
      background: rgba(6, 207, 156, .14);
      padding: 1px 7px;
      border-radius: 5px;
      margin: 0 1px;
      color: var(--green-l);
      font-weight: 700;
      font-family: inherit;
      font-size: 11px;
      border: 1px solid rgba(6, 207, 156, .22)
    }

    .piano-frame {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 6;
      padding: 0 24px 24px;
      background: linear-gradient(0deg, rgba(11, 20, 26, .94) 0, rgba(11, 20, 26, .55) 60%, transparent 100%)
    }

    .piano {
      position: relative;
      height: clamp(200px, 42vh, 400px);
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      border-radius: 14px 14px 8px 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .05), 0 0 100px rgba(6, 207, 156, .08);
      overflow: hidden;
      touch-action: none;
      background: #0a1015
    }

    .piano::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(180deg, rgba(6, 207, 156, .32), transparent);
      z-index: 10;
      pointer-events: none
    }

    .key {
      position: relative;
      cursor: pointer;
      transition: transform .05s ease, box-shadow .08s ease, background .08s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none
    }

    .key.white {
      flex: 1;
      background: linear-gradient(180deg, #f7f7f4 0, #ececea 4%, #dcdcda 55%, #c8c8c6 88%, #b6b6b4 100%);
      border-right: 1px solid rgba(0, 0, 0, .14);
      border-bottom: 3px solid #8a8a88;
      border-radius: 0 0 8px 8px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      box-shadow: inset 0 -6px 8px -4px rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .7)
    }

    .key.white:last-child {
      border-right: none
    }

    .key.white.pressed {
      transform: translateY(3px);
      background: linear-gradient(180deg, #d6f5ea 0, #b8ead6 20%, #98dcc4 60%, #78ccb0 100%);
      border-bottom-width: 1px;
      box-shadow: inset 0 -3px 5px -2px rgba(0, 0, 0, .15), inset 0 2px 0 rgba(255, 255, 255, .5), 0 0 30px rgba(6, 207, 156, .55)
    }

    .key.black {
      position: absolute;
      top: 0;
      height: 62%;
      background: linear-gradient(180deg, #3a424a 0, #262c33 35%, #181d23 78%, #0c1116 100%);
      border-radius: 0 0 6px 6px;
      border-bottom: 3px solid #000;
      z-index: 5;
      box-shadow: inset 0 -6px 8px -3px rgba(0, 0, 0, .5), inset 0 2px 0 rgba(255, 255, 255, .12), inset 2px 0 0 rgba(255, 255, 255, .04), inset -2px 0 0 rgba(0, 0, 0, .4), 0 4px 6px rgba(0, 0, 0, .55);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12px
    }

    .key.black.pressed {
      transform: translateY(2px);
      background: linear-gradient(180deg, #0d3b2d 0, #0d5540 30%, #06cf9c 100%);
      border-bottom-width: 1px;
      box-shadow: inset 0 -3px 5px -2px rgba(0, 0, 0, .4), inset 0 2px 0 rgba(255, 255, 255, .2), 0 0 26px rgba(6, 207, 156, .7)
    }

    .key-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: rgba(17, 27, 33, .35);
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      pointer-events: none;
      transition: color .1s
    }

    .key.white.pressed .key-label {
      color: rgba(0, 60, 45, .7)
    }

    .key.black .key-label {
      color: rgba(255, 255, 255, .28)
    }

    .key.black.pressed .key-label {
      color: rgba(255, 255, 255, .9)
    }

    .key-note {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      color: rgba(17, 27, 33, .28);
      margin-top: 3px;
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      pointer-events: none
    }

    .key.black .key-note {
      color: rgba(255, 255, 255, .2);
      font-size: 8.5px
    }

    .key::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 90%, rgba(6, 207, 156, .6) 0, transparent 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease
    }

    .key.pressed::after {
      opacity: 1;
      transition: opacity 0s
    }

    .footer-info {
      position: absolute;
      bottom: calc(clamp(200px, 42vh, 400px) + 40px);
      left: 0;
      right: 0;
      z-index: 7;
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s
    }

    .footer-info.show {
      opacity: .55
    }

    .footer-chip {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      color: var(--tx2);
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(32, 44, 51, .7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px)
    }

    @media (max-width:820px) {
      .top {
        padding: 14px 18px 50px;
        gap: 14px;
        flex-wrap: wrap
      }

      .brand-sub {
        display: none
      }

      .hud {
        order: 3;
        flex: 1 1 100%;
        margin: 0;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px
      }

      .hud b {
        font-size: 13px
      }

      .volume {
        font-size: 9.5px
      }

      .volume input[type=range] {
        width: 70px
      }

      .piano-frame {
        padding: 0 8px 12px
      }

      .piano {
        height: clamp(180px, 34vh, 280px);
        border-radius: 10px 10px 6px 6px
      }

      .key.white {
        padding-bottom: 8px;
        border-radius: 0 0 5px 5px
      }

      .key.black {
        padding-bottom: 8px;
        border-radius: 0 0 4px 4px
      }

      .key-label {
        font-size: 8px
      }

      .key-note {
        display: none
      }

      .hero-title {
        font-size: 26px
      }

      .hero-icon {
        font-size: 52px
      }

      .hero-text {
        font-size: 13px
      }

      .mapping {
        font-size: 10px;
        padding: 8px 12px;
        line-height: 1.7
      }

      .mapping kbd {
        font-size: 9.5px;
        padding: 1px 5px
      }

      .footer-info {
        bottom: calc(clamp(180px, 34vh, 280px) + 24px)
      }

      .footer-chip {
        font-size: 9px;
        padding: 4px 9px
      }
    }

    @media (max-height:560px) {
      .piano {
        height: 160px
      }

      .hero-icon {
        font-size: 44px
      }

      .hero-title {
        font-size: 22px
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="top">
      <div class="brand">
        <div class="brand-icon">🎹</div>
        <div>
          <div class="brand-name">Piano Bot</div>
          <div class="brand-sub">Piano virtual · audio real</div>
        </div>
      </div>
      <div class="hud"><span>Nada terakhir <b class="green hud-last" id="lastNote">—</b></span></div>
      <div class="volume"><span>Vol</span> <input type="range" id="volume" min="0" max="100" value="70"></div>
    </div>
    <div class="hero" id="hero">
      <div class="hero-icon">🎹</div>
      <div class="hero-title">Piano Virtual</div>
      <div class="hero-text">Mainkan dengan <b>keyboard</b> atau <b>klik / sentuh tuts</b>.<br>Audio disintesis real-time dengan harmoni, envelope, dan reverb.<br>
        <div class="mapping">Oktaf bawah &nbsp; <kbd>Z</kbd><kbd>S</kbd><kbd>X</kbd><kbd>D</kbd><kbd>C</kbd><kbd>V</kbd><kbd>G</kbd><kbd>B</kbd><kbd>H</kbd><kbd>N</kbd><kbd>J</kbd><kbd>M</kbd><br>Oktaf atas &nbsp;&nbsp; <kbd>Q</kbd><kbd>2</kbd><kbd>W</kbd><kbd>3</kbd><kbd>E</kbd><kbd>R</kbd><kbd>5</kbd><kbd>T</kbd><kbd>6</kbd><kbd>Y</kbd><kbd>7</kbd><kbd>U</kbd></div>
      </div>
    </div>
    <div class="footer-info" id="footerInfo">
      <div class="footer-chip">Tahan beberapa tuts untuk chord</div>
    </div>
    <div class="piano-frame">
      <div class="piano" id="piano"></div>
    </div>
  </div>
  <script>

    function releaseKey(e) {

      const t = parseInt(e.dataset.midi, 10);
      activeNotes.delete(t)

    const activePointers = new Map;
