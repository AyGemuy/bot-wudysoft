<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#070810">
  <title>KURO SLASH - Robot Road</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none
    }

    body,
    html {
      width: 100%;
      min-height: 100vh
    }

    body {
      background: linear-gradient(165deg, #070810, #0d101a 60%, #070810);
      padding: 10px 8px;
      color: #c8cede;
      display: flex;
      justify-content: center;
      align-items: center
    }

    #app {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 6px;
      gap: 8px
    }

    .tt {
      font: 900 18px 'Arial Black', sans-serif;
      color: #eef1f8;
      text-shadow: 0 0 10px rgba(193, 18, 31, .6), 0 2px #000;
      letter-spacing: 2px;
      line-height: 1.1
    }

    .tt small {
      display: block;
      font: 700 7px Arial;
      letter-spacing: 2.5px;
      color: #8a92a6;
      text-shadow: none
    }

    .hrs {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .hr {
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(193, 18, 31, .35);
      border-radius: 9px;
      padding: 3px 9px;
      text-align: center;
      min-width: 54px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1)
    }

    .hr i {
      display: block;
      font: 700 7px Arial;
      font-style: normal;
      letter-spacing: 1px;
      color: #8a92a6
    }

    .hr b {
      font: 900 13px 'Arial Black', monospace;
      color: #eef1f8;
      font-variant-numeric: tabular-nums
    }

    .mbtn {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(193, 18, 31, .4);
      border-radius: 9px;
      background: rgba(0, 0, 0, .55);
      color: #eef1f8;
      font-size: 15px;
      cursor: pointer;
      touch-action: none;
      display: grid;
      place-items: center;
      transition: filter .1s
    }

    .mbtn:active {
      filter: brightness(1.6)
    }

    .gw {
      position: relative;
      border: 2px solid rgba(193, 18, 31, .4);
      border-radius: 16px;
      overflow: hidden;
      background: #020308;
      box-shadow: 0 0 22px rgba(193, 18, 31, .18), 0 10px 25px rgba(0, 0, 0, .7);
      aspect-ratio: 404/380
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    .pads {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 8px;
      margin-top: 4px
    }

    .pd {
      height: 52px;
      border: 2px solid rgba(255, 255, 255, .16);
      border-radius: 14px;
      font: 900 13px 'Arial Black', sans-serif;
      color: #fff;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .6);
      background: linear-gradient(#2a3145, #171c2a 60%, #0c0f18);
      transition: transform .08s, filter .08s
    }

    .pd:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .6);
      filter: brightness(1.4)
    }

    #atkB {
      background: linear-gradient(#a31826, #590c15 60%, #280509);
      border-color: rgba(255, 80, 95, .4);
      color: #ffe9e9;
      text-shadow: 0 1px #000
    }

    .ub {
      margin-top: 4px;
      width: 100%;
      height: 42px;
      border: 2px solid rgba(193, 18, 31, .5);
      border-radius: 12px;
      font: 900 13px 'Arial Black', sans-serif;
      color: #7a1924;
      background: #0c0f18;
      cursor: pointer;
      touch-action: none;
      letter-spacing: 2px;
      transition: all .2s
    }

    .ub.rdy {
      color: #fff;
      background: linear-gradient(90deg, #c1121f, #ff3040);
      box-shadow: 0 0 18px rgba(193, 18, 31, .85);
      animation: up 1s infinite alternate;
      border-color: #fff
    }

    .ub:active {
      transform: translateY(2px)
    }

    @keyframes up {
      0% {
        filter: brightness(1)
      }

      100% {
        filter: brightness(1.45)
      }
    }

    .hint {
      text-align: center;
      font: 600 9.5px Arial, sans-serif;
      color: #8a92a6;
      line-height: 1.4;
      margin-top: 4px
    }
  </style>
</head>
