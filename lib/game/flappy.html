<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SxcWaMd Flappy Bird</title>
  <style>
    :root {
      --bg: #08070b;
      --panel: #121017;
      --line: rgba(255, 255, 255, .09);
      --text: #fff;
      --muted: #aaa1ae;
      --yellow: #facc15;
      --blue: #38bdf8;
      --green: #22c55e
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #0f2027 0, #0b080d 50%, #050407 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center
    }

    .app {
      width: min(100%, 760px);
      margin: auto
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--yellow), #f97316);
      box-shadow: 0 8px 25px rgba(250, 204, 21, .3);
      font-size: 25px
    }

    .title {
      font-size: 19px;
      font-weight: 800
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px
    }

    .status {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #ddd;
      font-size: 11px
    }

    .gameWrap {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(56, 189, 248, .12)
    }

    canvas {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: var(--blue);
      border-radius: 15px;
      touch-action: none
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .card {
      padding: 11px;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: center
    }

    .card b {
      display: block;
      font-size: 16px;
      color: var(--yellow)
    }

    .card span {
      color: var(--muted);
      font-size: 10px
    }

    .message {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(56, 189, 248, .1);
      border: 1px solid rgba(56, 189, 248, .2);
      text-align: center;
      color: #e0f2fe;
      font-size: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .touch-control {
      margin-top: 12px
    }

    .t-btn-fly {
      width: 100%;
      min-height: 55px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--yellow), #f97316);
      color: #000;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation
    }

    .t-btn-fly:active {
      transform: scale(.97)
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px)
    }

    .overlay.show {
      display: flex
    }

    .modal {
      width: min(92vw, 420px);
      padding: 23px;
      border-radius: 23px;
      background: linear-gradient(145deg, #1c151e, #0f0c12);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      text-align: center
    }

    .modalIcon {
      font-size: 55px;
      margin-bottom: 7px
    }

    .modal h2 {
      margin: 5px 0;
      font-size: 24px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px
    }

    .btn-restart {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--yellow), #f97316);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }

    @media(max-width:430px) {
      body {
        padding: 8px
      }

      .gameWrap {
        padding: 5px
      }

      .info {
        gap: 5px
      }

      .card {
        padding: 9px 4px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="avatar">🐤</div>
        <div>
          <div class="title">SxcWaMd Flappy Bird 🐥</div>
          <div class="subtitle">"Ketuk untuk terbang melewati pipa!" ✨</div>
        </div>
      </div>
      <div class="status" id="statusText">READY</div>
    </div>
    <div class="gameWrap"><canvas id="gameCanvas" width="640" height="360"></canvas></div>
    <div class="info">
      <div class="card"><b id="scoreVal">0</b> <span>SCORE</span></div>
      <div class="card"><b id="highScoreVal">0</b> <span>HIGH SCORE</span></div>
    </div>
    <div class="message" id="msgText">Tekan Spasi / Klik / Tombol Terbang untuk membuat burung mengepakkan sayap! 🚀</div>
    <div class="touch-control">
      <div class="t-btn-fly" id="btnFly">🐦 TERBANG / FLAP!</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modalIcon">💥</div>
      <h2>GAME OVER</h2>
      <p id="finalScoreDesc">Skor kamu: 0</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button>
    </div>
  </div>
  <script>

        e.connect(i), i.connect(audioCtx.destination); const a = audioCtx.currentTime; "flap" === t ? (e.type = "triangle", e.frequency.setValueAtTime(300, a), e.frequency.exponentialRampToValueAtTime(600, a + .1), i.gain.setValueAtTime(.12, a), i.gain.exponentialRampToValueAtTime(.01, a + .1), e.start(a), e.stop(a + .1)) : "score" === t ? (e.type = "sine", e.frequency.setValueAtTime(587, a), e.frequency.setValueAtTime(880, a + .08), i.gain.setValueAtTime(.1, a), i.gain.exponentialRampToValueAtTime(.01, a + .2), e.start(a), e.stop(a + .2)) : "hit" === t && (e.type = "sawtooth", e.frequency.setValueAtTime(140, a), e.frequency.linearRampToValueAtTime(30, a + .3), i.gain.setValueAtTime(.2, a), i.gain.exponentialRampToValueAtTime(.01, a + .3), e.start(a), e.stop(a + .3)) } catch (t) {} }
    const canvas = document.getElementById("gameCanvas"),
      ctx = canvas.getContext("2d"),
      CANVAS_WIDTH = 640,
      CANVAS_HEIGHT = 360,
      GROUND_Y = 320;
    let bird, score = 0,
      highScore = 0,
      gameOver = !1,
      gameStarted = !1;
    class Bird { constructor() { this.x = 100, this.y = 150, this.radius = 14, this.vy = 0, this.gravity = .45, this.lift = -7 } flap() { this.vy = this.lift, playSound("flap") } update() { gameStarted && (this.vy += this.gravity, this.y += this.vy, this.y + this.radius >= 320 && (this.y = 320 - this.radius, gameOver = !0, playSound("hit"), endGame()), this.y - this.radius <= 0 && (this.y = this.radius, this.vy = 0)) } draw() { ctx.save(), ctx.translate(this.x, this.y), ctx.fillStyle = "#facc15", ctx.beginPath(), ctx.arc(0, 0, this.radius, 0, 2 * Math.PI), ctx.fill(), ctx.strokeStyle = "#000", ctx.lineWidth = 2, ctx.stroke(), ctx.fillStyle = "#f97316", ctx.beginPath(), ctx.moveTo(this.radius - 2, -4), ctx.lineTo(this.radius + 8, 0), ctx.lineTo(this.radius - 2, 4), ctx.closePath(), ctx.fill(), ctx.stroke(), ctx.fillStyle = "#fff", ctx.beginPath(), ctx.arc(4, -5, 4, 0, 2 * Math.PI), ctx.fill(), ctx.fillStyle = "#000", ctx.beginPath(), ctx.arc(5, -5, 1.5, 0, 2 * Math.PI), ctx.fill(), ctx.restore() } } class Pipe { constructor() { this.x = 640, this.w = 56, this.gap = 110, this.topHeight = Math.floor(140 * Math.random()) + 40, this.bottomY = this.topHeight + this.gap, this.passed = !1, this.speed = 3 } update() { this.x -= this.speed } draw() { ctx.fillStyle = "#22c55e", ctx.fillRect(this.x, 0, this.w, this.topHeight), ctx.strokeStyle = "#000", ctx.lineWidth = 2, ctx.strokeRect(this.x, 0, this.w, this.topHeight), ctx.fillRect(this.x - 3, this.topHeight - 20, this.w + 6, 20), ctx.strokeRect(this.x - 3, this.topHeight - 20, this.w + 6, 20), ctx.fillRect(this.x, this.bottomY, this.w, 320 - this.bottomY), ctx.strokeRect(this.x, this.bottomY, this.w, 320 - this.bottomY), ctx.fillRect(this.x - 3, this.bottomY, this.w + 6, 20), ctx.strokeRect(this.x - 3, this.bottomY, this.w + 6, 20) } }
    let pipes = [],
      frameCount = 0;

    function initGame() { score = 0, gameOver = !1, gameStarted = !1, frameCount = 0, pipes = [], bird = new Bird, document.getElementById("overlay").classList.remove("show"), updateUI() }

    function update() { if (!gameOver) { gameStarted && (frameCount++, frameCount % 100 == 0 && pipes.push(new Pipe)), bird.update(); for (let t = pipes.length - 1; t >= 0; t--) pipes[t].update(), !pipes[t].passed && pipes[t].x + pipes[t].w < bird.x && (score++, pipes[t].passed = !0, playSound("score"), updateUI()), bird.x + bird.radius > pipes[t].x && bird.x - bird.radius < pipes[t].x + pipes[t].w && (bird.y - bird.radius < pipes[t].topHeight || bird.y + bird.radius > pipes[t].bottomY) && (gameOver = !0, playSound("hit"), endGame()), pipes[t].x + pipes[t].w < 0 && pipes.splice(t, 1) } }

    function render() { ctx.clearRect(0, 0, 640, 360), ctx.fillStyle = "#38bdf8", ctx.fillRect(0, 0, 640, 360); for (let t of pipes) t.draw();
      ctx.fillStyle = "#16a34a", ctx.fillRect(0, 320, 640, 40), ctx.fillStyle = "#15803d", ctx.fillRect(0, 320, 640, 12), bird.draw() }

    function gameLoop() { update(), render(), requestAnimationFrame(gameLoop) }

    function updateUI() { score > highScore && (highScore = score), document.getElementById("scoreVal").textContent = score, document.getElementById("highScoreVal").textContent = highScore }

    function endGame() { document.getElementById("finalScoreDesc").textContent = "Skor akhir kamu: " + score, document.getElementById("overlay").classList.add("show") }

    function triggerFlap() { initAudio(), gameOver ? initGame() : (gameStarted = !0, bird.flap()) } window.addEventListener("keydown", t => { "Space" !== t.code && "ArrowUp" !== t.code || (t.preventDefault(), triggerFlap()) }), canvas.addEventListener("touchstart", t => { t.preventDefault(), triggerFlap() }), canvas.addEventListener("mousedown", t => { t.preventDefault(), triggerFlap() });
    const btnFly = document.getElementById("btnFly");
    btnFly.addEventListener("touchstart", t => { t.preventDefault(), triggerFlap() }), btnFly.addEventListener("mousedown", t => { t.preventDefault(), triggerFlap() }), document.getElementById("btnRestart").addEventListener("click", () => { initGame() }), initGame(), gameLoop()
  </script>
</body>

</html>
