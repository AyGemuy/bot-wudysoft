<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SxcWaMd Breakout</title>
  <style>
    :root {
      --bg: #08070b;
      --panel: #121017;
      --line: rgba(255, 255, 255, .09);
      --text: #fff;
      --muted: #aaa1ae;
      --yellow: #facc15;
      --orange: #f97316;
      --purple: #a855f7
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1a102b 0, #0b080d 50%, #050407 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center
    }

    .app {
      width: min(100%, 760px);
      margin: auto
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--orange), var(--purple));
      box-shadow: 0 8px 25px rgba(249, 115, 22, .3);
      font-size: 25px
    }

    .title {
      font-size: 19px;
      font-weight: 800
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px
    }

    .status {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #ddd;
      font-size: 11px
    }

    .gameWrap {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(168, 85, 247, .12)
    }

    canvas {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: #0c0a1d;
      border-radius: 15px;
      touch-action: none
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .card {
      padding: 11px;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: center
    }

    .card b {
      display: block;
      font-size: 16px;
      color: var(--yellow)
    }

    .card span {
      color: var(--muted);
      font-size: 10px
    }

    .message {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(168, 85, 247, .1);
      border: 1px solid rgba(168, 85, 247, .2);
      text-align: center;
      color: #e9d5ff;
      font-size: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      user-select: none
    }

    .t-btn {
      min-height: 55px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation
    }

    .t-btn:active {
      background: rgba(255, 255, 255, .2);
      transform: scale(.96)
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px)
    }

    .overlay.show {
      display: flex
    }

    .modal {
      width: min(92vw, 420px);
      padding: 23px;
      border-radius: 23px;
      background: linear-gradient(145deg, #1c151e, #0f0c12);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      text-align: center
    }

    .modal h2 {
      margin: 5px 0;
      font-size: 24px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px
    }

    .btn-restart {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--orange), var(--purple));
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="avatar">🧱</div>
        <div>
          <div class="title">SxcWaMd Breakout 🏓</div>
          <div class="subtitle">"Hancurkan semua balok warna!" ✨</div>
        </div>
      </div>
      <div class="status" id="statusText">READY</div>
    </div>
    <div class="gameWrap"><canvas id="gameCanvas" width="640" height="360"></canvas></div>
    <div class="info">
      <div class="card"><b id="scoreVal">0</b><span>SKOR</span></div>
      <div class="card"><b id="livesVal">❤️ 3</b><span>NYAWA</span></div>
    </div>
    <div class="message">Gunakan Tombol Panah Kiri/Kanan, A/D, atau Tombol Sentuh untuk menggeser papan! 🧱</div>
    <div class="touch-controls">
      <div class="t-btn" id="btnLeft">◀ KIRI</div>
      <div class="t-btn" id="btnRight">KANAN ▶</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="resTitle">GAME OVER</h2>
      <p id="resDesc">Permainan selesai!</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button>
    </div>
  </div>
  <script>
    let audioCtx = null;

    function initAudio() { audioCtx || (audioCtx = new(window.AudioContext || window.webkitAudioContext)), "suspended" === audioCtx.state && audioCtx.resume() }

    function playSound(e) {
      try {
        initAudio();
        const t = audioCtx.createOscillator(),
          l = audioCtx.createGain();
        t.connect(l), l.connect(audioCtx.destination);
        const a = audioCtx.currentTime;
        "hit" === e ? (t.type = "triangle", t.frequency.setValueAtTime(300, a), l.gain.setValueAtTime(.1, a), l.gain.exponentialRampToValueAtTime(.01, a + .08), t.start(a), t.stop(a + .08)) : "break" === e ? (t.type = "sine", t.frequency.setValueAtTime(600, a), t.frequency.exponentialRampToValueAtTime(900, a + .1), l.gain.setValueAtTime(.12, a), l.gain.exponentialRampToValueAtTime(.01, a + .1), t.start(a), t.stop(a + .1)) : "lose" === e && (t.type = "sawtooth", t.frequency.setValueAtTime(150, a), t.frequency.linearRampToValueAtTime(40, a + .3), l.gain.setValueAtTime(.2, a), l.gain.exponentialRampToValueAtTime(.01, a + .3), t.start(a), t.stop(a + .3))
      } catch (e) {}
    }
    const canvas = document.getElementById("gameCanvas"),
      ctx = canvas.getContext("2d"),
      CANVAS_WIDTH = 640,
      CANVAS_HEIGHT = 360;
    let score = 0,
      lives = 3,
      gameOver = !1,
      leftPressed = !1,
      rightPressed = !1;
    const paddle = { x: 270, y: 335, w: 100, h: 12, dx: 7 },
      ball = { x: 320, y: 320, radius: 8, vx: 4, vy: -4 },
      brickConfig = { rows: 4, cols: 8, w: 68, h: 20, padding: 10, offsetTop: 45, offsetLeft: 36 };
    let bricks = [];

    function initBricks() { bricks = []; const e = ["#f97316", "#a855f7", "#38bdf8", "#22c55e"]; for (let t = 0; t < brickConfig.rows; t++) { bricks[t] = []; for (let l = 0; l < brickConfig.cols; l++) bricks[t][l] = { x: l * (brickConfig.w + brickConfig.padding) + brickConfig.offsetLeft, y: t * (brickConfig.h + brickConfig.padding) + brickConfig.offsetTop, status: 1, color: e[t] } } }

    function resetBall() { ball.x = 320, ball.y = 320, ball.vx = 4 * (Math.random() > .5 ? 1 : -1), ball.vy = -4 }

    function update() {
      if (gameOver) return;
      if (leftPressed && paddle.x > 10 && (paddle.x -= paddle.dx), rightPressed && paddle.x < 640 - paddle.w - 10 && (paddle.x += paddle.dx), ball.x += ball.vx, ball.y += ball.vy, (ball.x - ball.radius < 0 || ball.x + ball.radius > 640) && (ball.vx *= -1, playSound("hit")), ball.y - ball.radius < 0 && (ball.vy *= -1, playSound("hit")), ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        ball.vy *= -1;
        let e = ball.x - (paddle.x + paddle.w / 2);
        ball.vx = .12 * e, playSound("hit")
      }
      let e = 0;
      for (let t = 0; t < brickConfig.rows; t++)
        for (let l = 0; l < brickConfig.cols; l++) {
          let a = bricks[t][l];
          1 === a.status && (e++, ball.x > a.x && ball.x < a.x + brickConfig.w && ball.y > a.y && ball.y < a.y + brickConfig.h && (ball.vy *= -1, a.status = 0, score += 15, playSound("break")))
        }
      0 === e && endGame("LUAR BIASA! KAMU MENANG!"), ball.y + ball.radius > 360 && (lives--, playSound("lose"), lives <= 0 ? endGame("GAME OVER") : resetBall()), document.getElementById("scoreVal").textContent = score, document.getElementById("livesVal").textContent = "❤️ " + lives
    }

    function render() {
      ctx.fillStyle = "#0c0a1d", ctx.fillRect(0, 0, 640, 360);
      for (let e = 0; e < brickConfig.rows; e++)
        for (let t = 0; t < brickConfig.cols; t++)
          if (1 === bricks[e][t].status) {
            let l = bricks[e][t];
            ctx.fillStyle = l.color, ctx.fillRect(l.x, l.y, brickConfig.w, brickConfig.h), ctx.strokeStyle = "#000", ctx.strokeRect(l.x, l.y, brickConfig.w, brickConfig.h)
          } ctx.fillStyle = "#facc15", ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h), ctx.fillStyle = "#a855f7", ctx.beginPath(), ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI), ctx.fill()
    }
    let gameInterval = null;

    function gameLoop() { update(), render() }

    function initGame() { score = 0, lives = 3, gameOver = !1, paddle.x = 270, initBricks(), resetBall(), document.getElementById("overlay").classList.remove("show"), gameInterval && clearInterval(gameInterval), gameInterval = setInterval(gameLoop, 1e3 / 60) }

    function endGame(e) { gameOver = !0, clearInterval(gameInterval), document.getElementById("resTitle").textContent = e, document.getElementById("resDesc").textContent = "Skor akhir total: " + score, document.getElementById("overlay").classList.add("show") }

    function bindTouch(e, t) {
      const l = document.getElementById(e),
        a = e => { e.preventDefault(), initAudio(), t ? leftPressed = !0 : rightPressed = !0 },
        i = e => { e.preventDefault(), t ? leftPressed = !1 : rightPressed = !1 };
      l.addEventListener("touchstart", a), l.addEventListener("touchend", i), l.addEventListener("mousedown", a), l.addEventListener("mouseup", i)
    }
    window.addEventListener("keydown", e => { initAudio(), "ArrowLeft" !== e.code && "KeyA" !== e.code || (e.preventDefault(), leftPressed = !0), "ArrowRight" !== e.code && "KeyD" !== e.code || (e.preventDefault(), rightPressed = !0) }), window.addEventListener("keyup", e => { "ArrowLeft" !== e.code && "KeyA" !== e.code || (leftPressed = !1), "ArrowRight" !== e.code && "KeyD" !== e.code || (rightPressed = !1) }), bindTouch("btnLeft", !0), bindTouch("btnRight", !1), document.getElementById("btnRestart").addEventListener("click", initGame), initGame()
  </script>
</body>

</html>
