<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Bricks Bot — Taruhan Bata</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0b141a;
      --bg2: #111b21;
      --panel: #202c33;
      --green: #00a884;
      --green-d: #005c4b;
      --green-l: #06cf9c;
      --tx: #e9edef;
      --tx2: #8696a0;
      --line: #2a3942;
      --red: #f15c6d
    }

    body,
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--tx);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      inset: 0
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: 0 0;
      color: inherit;
      touch-action: manipulation
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      touch-action: none
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
      cursor: grab
    }

    canvas:active {
      cursor: grabbing
    }

    .top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 20px 30px 70px;
      display: flex;
      align-items: center;
      gap: 26px;
      background: linear-gradient(180deg, rgba(11, 20, 26, .94) 0, rgba(11, 20, 26, .6) 55%, transparent 100%);
      pointer-events: none
    }

    .top>* {
      pointer-events: auto
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green-l), var(--green));
      display: grid;
      place-items: center;
      font-size: 21px;
      box-shadow: 0 6px 20px rgba(0, 168, 132, .35)
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.2px
    }

    .brand-sub {
      font-size: 11px;
      color: var(--tx2);
      font-weight: 500;
      margin-top: 1px
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 13px;
      color: var(--tx2);
      font-weight: 500;
      margin-left: auto;
      margin-right: auto;
      letter-spacing: .01em;
      pointer-events: none
    }

    .hud b {
      color: var(--tx);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      letter-spacing: -.2px;
      margin-left: 4px
    }

    .hud b.green {
      color: var(--green-l)
    }

    .hud-lives {
      font-size: 15px;
      letter-spacing: 2px;
      line-height: 1
    }

    .wallet {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--tx2);
      pointer-events: none
    }

    .wallet b {
      font-size: 22px;
      font-weight: 800;
      color: var(--tx);
      letter-spacing: -.6px;
      font-variant-numeric: tabular-nums;
      text-transform: none
    }

    .wallet b::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-l);
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 0 0 3px rgba(6, 207, 156, .18);
      animation: pulse 2.4s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(6, 207, 156, .18)
      }

      50% {
        box-shadow: 0 0 0 8px rgba(6, 207, 156, .04)
      }
    }

    .history {
      position: absolute;
      right: 28px;
      top: 118px;
      bottom: 200px;
      width: 230px;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      padding-top: 26px;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 44px), transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0, #000 26px, #000 calc(100% - 44px), transparent 100%)
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 8px;
      border-radius: 8px;
      animation: histIn .35s cubic-bezier(.34, 1.4, .64, 1)
    }

    @keyframes histIn {
      from {
        opacity: 0;
        transform: translateX(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hist-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 7px;
      background: var(--green-l);
      box-shadow: 0 0 10px rgba(6, 207, 156, .7)
    }

    .hist-dot.lose {
      background: var(--red);
      box-shadow: 0 0 10px rgba(241, 92, 109, .6)
    }

    .hist-dot.draw {
      background: var(--tx2);
      box-shadow: none
    }

    .hist-main {
      flex: 1;
      min-width: 0
    }

    .hist-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--tx);
      letter-spacing: -.1px
    }

    .hist-sub {
      font-size: 10.5px;
      color: var(--tx2);
      margin-top: 2px;
      font-weight: 500
    }

    .hist-top .amt-win {
      color: var(--green-l)
    }

    .hist-top .amt-lose {
      color: var(--red)
    }

    .hist-top .amt-draw {
      color: var(--tx2)
    }

    .center {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 45%, rgba(11, 20, 26, .68) 0, rgba(11, 20, 26, .94) 75%);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      pointer-events: none;
      text-align: center;
      padding: 24px;
      animation: centerIn .35s ease
    }

    .center[hidden] {
      display: none
    }

    @keyframes centerIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .center-inner {
      max-width: 540px;
      animation: centerPop .5s cubic-bezier(.34, 1.56, .64, 1)
    }

    @keyframes centerPop {
      from {
        opacity: 0;
        transform: scale(.9) translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .center-icon {
      font-size: 70px;
      line-height: 1;
      margin-bottom: 18px;
      filter: drop-shadow(0 12px 34px rgba(6, 207, 156, .35))
    }

    .center-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.8px;
      margin-bottom: 14px;
      color: var(--tx)
    }

    .center-title.win {
      color: var(--green-l);
      text-shadow: 0 0 50px rgba(6, 207, 156, .45)
    }

    .center-title.lose {
      color: var(--red);
      text-shadow: 0 0 50px rgba(241, 92, 109, .35)
    }

    .center-text {
      font-size: 15px;
      color: var(--tx2);
      line-height: 1.75;
      font-weight: 400
    }

    .center-text b {
      color: var(--tx);
      font-weight: 700
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 70px 30px 26px;
      background: linear-gradient(0deg, rgba(11, 20, 26, .96) 0, rgba(11, 20, 26, .7) 55%, transparent 100%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      pointer-events: none
    }

    .bottom>* {
      pointer-events: auto
    }

    .bet-area {
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-width: 0
    }

    .group-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--tx2)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      max-width: 680px
    }

    .chip {
      border: 1px solid var(--line);
      background: rgba(32, 44, 51, .72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--tx);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.1px;
      transition: .15s ease
    }

    .chip:hover {
      background: rgba(42, 57, 66, .95);
      border-color: #3a4a52;
      transform: translateY(-1px)
    }

    .chip:active {
      transform: translateY(0)
    }

    .chip.active {
      background: var(--green);
      color: #0b141a;
      border-color: var(--green);
      box-shadow: 0 0 24px rgba(0, 168, 132, .55)
    }

    .action {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-end;
      flex: 0 0 auto
    }

    .action-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      font-size: 11.5px;
      color: var(--tx2);
      font-weight: 600;
      letter-spacing: .02em
    }

    .action-info b {
      color: var(--tx);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      letter-spacing: -.2px;
      margin-left: 4px
    }

    .action-info b.green {
      color: var(--green-l)
    }

    .play-btn {
      background: var(--green);
      color: #0b141a;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 17px 42px;
      border-radius: 14px;
      transition: .18s ease;
      box-shadow: 0 10px 34px rgba(0, 168, 132, .45);
      min-width: 220px
    }

    .play-btn:hover:not(:disabled) {
      background: var(--green-l);
      box-shadow: 0 14px 44px rgba(6, 207, 156, .55);
      transform: translateY(-2px)
    }

    .play-btn:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 6px 20px rgba(0, 168, 132, .4)
    }

    .play-btn:disabled {
      background: #2a3942;
      color: var(--tx2);
      box-shadow: none;
      cursor: not-allowed
    }

    .play-btn.reset {
      background: var(--red);
      color: #fff;
      box-shadow: 0 10px 34px rgba(241, 92, 109, .42)
    }

    .play-btn.reset:hover {
      background: #ff6b7c;
      box-shadow: 0 14px 44px rgba(241, 92, 109, .55)
    }

    @media (max-width:820px) {
      .top {
        padding: 14px 18px 50px;
        gap: 14px;
        flex-wrap: wrap
      }

      .brand-sub {
        display: none
      }

      .hud {
        order: 3;
        flex: 1 1 100%;
        margin: 0;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px
      }

      .hud b {
        font-size: 13.5px
      }

      .wallet b {
        font-size: 18px
      }

      .wallet {
        font-size: 9.5px
      }

      .history {
        display: none
      }

      .bottom {
        padding: 50px 18px 20px;
        flex-direction: column;
        align-items: stretch;
        gap: 16px
      }

      .action {
        align-items: stretch;
        width: 100%
      }

      .action-info {
        flex-direction: row;
        justify-content: space-between;
        align-items: baseline;
        width: 100%
      }

      .play-btn {
        width: 100%;
        min-width: 0
      }

      .center-title {
        font-size: 26px
      }

      .center-icon {
        font-size: 56px
      }

      .center-text {
        font-size: 14px
      }
    }
  </style>
</head>

<body>
  <div class="stage"><canvas id="game"></canvas>
    <div class="top">
      <div class="brand">
        <div class="brand-icon">🧱</div>
        <div>
          <div class="brand-name">Bricks Bot</div>
          <div class="brand-sub">Pecahkan bata</div>
        </div>
      </div>
      <div class="hud"><span class="hud-lives" id="lives">❤️❤️❤️</span> <span>Bata <b id="bricks">0/50</b></span> <span>Bayar <b class="green" id="payout">Rp 0</b></span></div>
      <div class="wallet"><span>Saldo</span> <b id="balance">Rp 100.000</b></div>
    </div>
    <div class="history" id="history"></div>
    <div class="center" id="center">
      <div class="center-inner">
        <div class="center-icon">🧱</div>
        <div class="center-title">Siap Bermain?</div>
        <div class="center-text">Pilih nominal taruhan di bawah, lalu tekan <b>MULAI MAIN</b>.<br>Pecahkan bata sebanyak mungkin untuk meraih pembayaran.</div>
      </div>
    </div>
    <div class="bottom">
      <div class="bet-area">
        <div class="group-title">Nominal Taruhan</div>

      </div>
      <div class="action">
        <div class="action-info">
          <div>Taruhan <b id="betLabel">Rp 1.000</b></div>
          <div>Profit maks <b class="green" id="winLabel">+Rp 1.500</b></div>
        </div><button class="play-btn" id="playBtn">MULAI MAIN</button>
      </div>
    </div>
  </div>
