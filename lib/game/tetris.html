<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SxcWaMd Tetris</title>
  <style>
    :root {
      --bg: #08070b;
      --panel: #121017;
      --line: rgba(255, 255, 255, .09);
      --text: #fff;
      --muted: #aaa1ae;
      --cyan: #06b6d4;
      --yellow: #facc15;
      --purple: #a855f7;
      --pink: #ec4899
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1e112a 0, #0b080d 50%, #050407 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center
    }

    .app {
      width: min(100%, 760px);
      margin: auto
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      box-shadow: 0 8px 25px rgba(168, 85, 247, .3);
      font-size: 25px
    }

    .title {
      font-size: 19px;
      font-weight: 800
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px
    }

    .status {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #ddd;
      font-size: 11px
    }

    .gameWrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      margin: auto;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(168, 85, 247, .12)
    }

    canvas {
      width: 100%;
      aspect-ratio: 1/2;
      display: block;
      background: #0d0a17;
      border-radius: 15px;
      touch-action: none
    }

    .info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .card {
      padding: 11px 4px;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: center
    }

    .card b {
      display: block;
      font-size: 15px;
      color: var(--yellow)
    }

    .card span {
      color: var(--muted);
      font-size: 10px
    }

    .message {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(168, 85, 247, .1);
      border: 1px solid rgba(168, 85, 247, .2);
      text-align: center;
      color: #e9d5ff;
      font-size: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
      user-select: none
    }

    .t-btn {
      min-height: 50px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation
    }

    .t-btn:active {
      background: rgba(255, 255, 255, .2);
      transform: scale(.95)
    }

    .t-btn.rotate {
      grid-column: span 2;
      background: linear-gradient(135deg, var(--cyan), var(--purple))
    }

    .t-btn.drop {
      background: linear-gradient(135deg, var(--pink), var(--yellow));
      color: #000
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px)
    }

    .overlay.show {
      display: flex
    }

    .modal {
      width: min(92vw, 420px);
      padding: 23px;
      border-radius: 23px;
      background: linear-gradient(145deg, #1c151e, #0f0c12);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      text-align: center
    }

    .modalIcon {
      font-size: 55px;
      margin-bottom: 7px
    }

    .modal h2 {
      margin: 5px 0;
      font-size: 24px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px
    }

    .btn-restart {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }

    @media(max-width:430px) {
      body {
        padding: 8px
      }

      .gameWrap {
        padding: 5px
      }

      .info {
        gap: 5px
      }

      .card {
        padding: 9px 2px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="avatar">🧩</div>
        <div>
          <div class="title">SxcWaMd Tetris 🧱</div>
          <div class="subtitle">"Susun & bersihkan baris blok!" ✨</div>
        </div>
      </div>
      <div class="status" id="statusText">READY</div>
    </div>
    <div class="gameWrap"><canvas id="gameCanvas" width="240" height="480"></canvas></div>
    <div class="info">
      <div class="card"><b id="scoreVal">0</b> <span>SKOR</span></div>
      <div class="card"><b id="linesVal">0</b> <span>BARIS</span></div>
      <div class="card"><b id="levelVal">1</b> <span>LEVEL</span></div>
    </div>
    <div class="message" id="msgText">Panah Kiri/Kanan untuk geser, Atas untuk putar, Bawah untuk soft drop, Spasi untuk Hard Drop! 🎮</div>
    <div class="touch-controls">
      <div class="t-btn rotate" id="btnRotate">↻ PUTAR</div>
      <div class="t-btn drop" id="btnDrop">⚡ DROP</div>
      <div class="t-btn" id="btnLeft">◀</div>
      <div class="t-btn" id="btnDown">▼</div>
      <div class="t-btn" id="btnRight">▶</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modalIcon">💀</div>
      <h2>GAME OVER</h2>
      <p id="finalScoreDesc">Skor kamu: 0</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button>
    </div>
  </div>
  <script>

    function playSound(e) { try { initAudio(); const t = audioCtx.createOscillator(),
          a = audioCtx.createGain();
        t.connect(a), a.connect(audioCtx.destination); const r = audioCtx.currentTime; "move" === e ? (t.type = "triangle", t.frequency.setValueAtTime(250, r), a.gain.setValueAtTime(.05, r), a.gain.exponentialRampToValueAtTime(.01, r + .05), t.start(r), t.stop(r + .05)) : "rotate" === e ? (t.type = "sine", t.frequency.setValueAtTime(400, r), t.frequency.exponentialRampToValueAtTime(600, r + .08), a.gain.setValueAtTime(.08, r), a.gain.exponentialRampToValueAtTime(.01, r + .08), t.start(r), t.stop(r + .08)) : "clear" === e ? (t.type = "square", t.frequency.setValueAtTime(523, r), t.frequency.setValueAtTime(659, r + .08), t.frequency.setValueAtTime(783, r + .16), a.gain.setValueAtTime(.12, r), a.gain.exponentialRampToValueAtTime(.01, r + .28), t.start(r), t.stop(r + .28)) : "drop" === e ? (t.type = "triangle", t.frequency.setValueAtTime(150, r), t.frequency.exponentialRampToValueAtTime(60, r + .1), a.gain.setValueAtTime(.15, r), a.gain.exponentialRampToValueAtTime(.01, r + .1), t.start(r), t.stop(r + .1)) : "over" === e && (t.type = "sawtooth", t.frequency.setValueAtTime(180, r), t.frequency.linearRampToValueAtTime(40, r + .4), a.gain.setValueAtTime(.2, r), a.gain.exponentialRampToValueAtTime(.01, r + .4), t.start(r), t.stop(r + .4)) } catch (e) {} }
    const canvas = document.getElementById("gameCanvas"),
      ctx = canvas.getContext("2d"),
      COLS = 10,
      ROWS = 20,

        [

    let arena = createMatrix(10, 20),

    function createMatrix(e, t) { const a = []; for (; t--;) a.push(new Array(e).fill(0)); return a }

    function createPiece(e) { return SHAPES[e] }

    function collide(e, t) { const a = t.matrix,

        for (let n = 0; n < a[t].length; ++n)

    function playerReset() { const e = [1, 2, 3, 4, 5, 6, 7],
        t = e[Math.floor(Math.random() * e.length)];

    function playerMove(e) { gameOver || (player.pos.x += e, collide(arena, player) ? player.pos.x -= e : playSound("move")) }

    function playerRotate() { if (gameOver) return; const e = player.pos.x; let t = 1; for (rotate(player.matrix); collide(arena, player);)
        if (player.pos.x += t, t = -(t + (t > 0 ? 1 : -1)), t > player.matrix[0].length) return rotate(player.matrix, -1), void(player.pos.x = e);

    function arenaSweep() { let e = 0;

    function drawMatrix(e, t) { e.forEach((e, a) => { e.forEach((e, r) => { 0 !== e && (ctx.fillStyle = COLORS[e], ctx.fillRect(24 * (r + t.x) + 1, 24 * (a + t.y) + 1, 22, 22), ctx.fillStyle = "rgba(255, 255, 255, 0.2)", ctx.fillRect(24 * (r + t.x) + 1, 24 * (a + t.y) + 1, 22, 4)) }) }) }

    function drawGrid() { ctx.strokeStyle = "rgba(255, 255, 255, 0.03)", ctx.lineWidth = 1; for (let e = 0; e < 10; e++) ctx.beginPath(), ctx.moveTo(24 * e, 0), ctx.lineTo(24 * e, 480), ctx.stroke(); for (let e = 0; e < 20; e++) ctx.beginPath(), ctx.moveTo(0, 24 * e), ctx.lineTo(240, 24 * e), ctx.stroke() }

      lastTime = e, dropCounter += t, dropCounter > dropInterval && playerDrop(), render(), requestAnimationFrame(update) }

    function updateUI() { document.getElementById("scoreVal").textContent = score, document.getElementById("linesVal").textContent = lines, document.getElementById("levelVal").textContent = level }

    function endGame() { document.getElementById("finalScoreDesc").textContent = "Skor akhir kamu: " + score, document.getElementById("overlay").classList.add("show") }

  </script>
</body>

</html>
