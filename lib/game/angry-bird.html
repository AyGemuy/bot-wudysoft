<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Angry Birds</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      overscroll-behavior: none; background: #0b141a; touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9edef; user-select: none; -webkit-user-select: none;
      position: fixed; inset: 0;
    }
    canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // ============================================================
    // AUDIO (unchanged)
    // ============================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    function playSound(t) {
      ensureAudio();
      if (!audioCtx) return;
      const e = audioCtx.currentTime;
      const i = audioCtx.createOscillator();
      const a = audioCtx.createGain();
      i.connect(a); a.connect(audioCtx.destination);

      if (t === "stretch") {
        i.type = "sine"; i.frequency.setValueAtTime(140, e); i.frequency.linearRampToValueAtTime(260, e + .08);
        a.gain.setValueAtTime(.08, e); a.gain.linearRampToValueAtTime(.01, e + .08);
        i.start(e); i.stop(e + .08);
      } else if (t === "launch") {
        i.type = "triangle"; i.frequency.setValueAtTime(320, e); i.frequency.exponentialRampToValueAtTime(800, e + .16);
        a.gain.setValueAtTime(.2, e); a.gain.linearRampToValueAtTime(.01, e + .18);
        i.start(e); i.stop(e + .18);
      } else if (t === "pig_die") {
        i.type = "square"; i.frequency.setValueAtTime(540, e); i.frequency.linearRampToValueAtTime(180, e + .18);
        a.gain.setValueAtTime(.25, e); a.gain.linearRampToValueAtTime(.01, e + .2);
        i.start(e); i.stop(e + .2);
      } else if (t === "hit") {
        i.type = "triangle"; i.frequency.setValueAtTime(110, e); i.frequency.exponentialRampToValueAtTime(40, e + .08);
        a.gain.setValueAtTime(.18, e); a.gain.linearRampToValueAtTime(.01, e + .09);
        i.start(e); i.stop(e + .09);
      } else if (t === "win") {
        [330, 440, 550, 660, 880].forEach((f, idx) => {
          const oo = audioCtx.createOscillator(), gg = audioCtx.createGain();
          oo.connect(gg); gg.connect(audioCtx.destination); oo.type = "sine";
          oo.frequency.setValueAtTime(f, e + .08 * idx);
          gg.gain.setValueAtTime(.15, e + .08 * idx);
          gg.gain.linearRampToValueAtTime(.01, e + .08 * idx + .14);
          oo.start(e + .08 * idx); oo.stop(e + .08 * idx + .15);
        });
      } else if (t === "lose") {
        i.type = "sawtooth"; i.frequency.setValueAtTime(300, e); i.frequency.linearRampToValueAtTime(80, e + .45);
        a.gain.setValueAtTime(.2, e); a.gain.linearRampToValueAtTime(.01, e + .45);
        i.start(e); i.stop(e + .45);
      }
    }

    // ============================================================
    // CANVAS + LAYOUT
    // ============================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const V_W = 960, V_H = 540;
    const SLING = { x: 170, y: 380, maxPull: 140 };
    const GRAVITY = .28;

    let scale = 1;
    let cssW = 0, cssH = 0;

    const state = {
      score: 0, level: 1, birdsLeft: 3, pigsLeft: 0,
      gameOver: false, won: false,
      overlayVisible: false, overlayType: null,
      overlayBtn: null
    };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      cssW = window.innerWidth;
      cssH = window.innerHeight;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      scale = Math.min(canvas.width / V_W, canvas.height / V_H);
    }
    window.addEventListener("resize", resize);
    resize();

    // ============================================================
    // GAME CLASSES (unchanged)
    // ============================================================
    class Bird {
      constructor(t, e) { this.x = t; this.y = e; this.radius = 16; this.vx = 0; this.vy = 0; this.launched = false; this.settled = false; this.trail = []; this.timer = 0; }
      update() {
        if (!this.launched || this.settled) return;
        this.vy += GRAVITY; this.x += this.vx; this.y += this.vy;
        this.timer++ % 3 === 0 && this.trail.push({ x: this.x, y: this.y, alpha: .8 });
        if (this.y + this.radius > 470) {
          this.y = 470 - this.radius;
          this.vy = .42 * -this.vy;
          this.vx *= .75;
          if (Math.abs(this.vy) < .6) this.vy = 0;
          if (Math.abs(this.vx) < .2) this.settled = true;
        }
        if (this.x - this.radius > 1020 || this.x < -40) this.settled = true;
      }
      draw(t) {
        for (const e of this.trail) {
          t.fillStyle = `rgba(255,255,255,${e.alpha})`;
          t.beginPath(); t.arc(e.x, e.y, 3, 0, 2 * Math.PI); t.fill();
          e.alpha -= .008;
        }
        t.save(); t.translate(this.x, this.y);
        t.fillStyle = "#f15c6d"; t.beginPath(); t.arc(0, 0, this.radius, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#ffd166"; t.beginPath(); t.arc(0, 5, .6 * this.radius, 0, Math.PI); t.fill();
        t.strokeStyle = "#0b141a"; t.lineWidth = 3; t.beginPath(); t.moveTo(-7, -8); t.lineTo(2, -4); t.lineTo(9, -8); t.stroke();
        t.fillStyle = "#fff"; t.beginPath(); t.arc(-2, -3, 4, 0, 2 * Math.PI); t.arc(6, -3, 4, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#0b141a"; t.beginPath(); t.arc(-1, -3, 2, 0, 2 * Math.PI); t.arc(7, -3, 2, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#f4b400"; t.beginPath(); t.moveTo(3, -2); t.lineTo(13, 2); t.lineTo(3, 6); t.closePath(); t.fill();
        t.fillStyle = "#f15c6d"; t.beginPath(); t.arc(-10, -12, 4, 0, 2 * Math.PI); t.fill();
        t.restore();
      }
    }

    class Pig {
      constructor(t, e, i = 17) { this.x = t; this.y = e; this.radius = i; this.vx = 0; this.vy = 0; this.dead = false; this.hp = 90; }
      update() {
        if (this.dead) return;
        this.vy += GRAVITY; this.x += this.vx; this.y += this.vy;
        if (this.y + this.radius > 470) {
          this.y = 470 - this.radius;
          this.vy = .3 * -this.vy;
          this.vx *= .8;
        }
      }
      hit(t) {
        this.hp -= t;
        playSound("hit"); vibrate(20);
        if (this.hp <= 0 && !this.dead) {
          this.dead = true;
          playSound("pig_die"); vibrate(50);
          state.score += 500;
          createPuffs(this.x, this.y, "#00a884");
        }
      }
      draw(t) {
        if (this.dead) return;
        t.save(); t.translate(this.x, this.y);
        t.fillStyle = "#00a884"; t.beginPath(); t.arc(0, 0, this.radius, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#06cf9c"; t.beginPath(); t.arc(-10, -14, 5, 0, 2 * Math.PI); t.arc(10, -14, 5, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#06cf9c"; t.beginPath(); t.ellipse(0, 3, 9, 6, 0, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#005c4b"; t.beginPath(); t.arc(-4, 3, 2, 0, 2 * Math.PI); t.arc(4, 3, 2, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#fff"; t.beginPath(); t.arc(-7, -4, 4, 0, 2 * Math.PI); t.arc(7, -4, 4, 0, 2 * Math.PI); t.fill();
        t.fillStyle = "#0b141a"; t.beginPath(); t.arc(-6, -4, 2, 0, 2 * Math.PI); t.arc(6, -4, 2, 0, 2 * Math.PI); t.fill();
        t.restore();
      }
    }

    class Block {
      constructor(t, e, i, a, s = "wood") { this.x = t; this.y = e; this.w = i; this.h = a; this.mat = s; this.vx = 0; this.vy = 0; this.angle = 0; this.va = 0; this.hp = s === "ice" ? 60 : s === "wood" ? 120 : 260; this.dead = false; }
      update() {
        if (this.dead) return;
        this.vy += GRAVITY; this.x += this.vx; this.y += this.vy; this.angle += this.va;
        if (this.y + this.h > 470) {
          this.y = 470 - this.h;
          this.vy = 0; this.vx *= .7; this.va *= .7;
        }
      }
      hit(t) {
        this.hp -= t;
        playSound("hit");
        if (this.hp <= 0 && !this.dead) {
          this.dead = true;
          vibrate(30);
          const pts = this.mat === "stone" ? 150 : this.mat === "wood" ? 100 : 75;
          state.score += pts;
          const col = this.mat === "ice" ? "#4dd0e1" : this.mat === "wood" ? "#8d5b4c" : "#2a3942";
          createPuffs(this.x + this.w / 2, this.y + this.h / 2, col);
        }
      }
      draw(t) {
        if (this.dead) return;
        t.save();
        t.translate(this.x + this.w / 2, this.y + this.h / 2);
        t.rotate(this.angle);
        if (this.mat === "wood") {
          t.fillStyle = "#8d5b4c"; t.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          t.strokeStyle = "#613b30"; t.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
          t.fillStyle = "#774c3e"; t.fillRect(-this.w / 2 + 2, -this.h / 2 + 2, this.w - 4, 3);
        } else if (this.mat === "ice") {
          t.fillStyle = "rgba(77, 208, 225, 0.75)";
          t.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          t.strokeStyle = "#26c6da"; t.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
        } else {
          t.fillStyle = "#202c33"; t.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          t.strokeStyle = "#2a3942"; t.strokeRect(-this.w / 2, -this.h / 2, this.w, this.h);
        }
        t.restore();
      }
    }

    class Particle {
      constructor(t, e, i) { this.x = t; this.y = e; this.color = i; this.vx = 6 * (Math.random() - .5); this.vy = 6 * (Math.random() - .5) - 2; this.radius = 3 + 4 * Math.random(); this.life = 20 + 15 * Math.random(); }
      update() { this.x += this.vx; this.y += this.vy; this.vy += .15; this.life--; }
      draw(t) {
        if (this.life <= 0) return;
        t.fillStyle = this.color;
        t.beginPath(); t.arc(this.x, this.y, this.radius, 0, 2 * Math.PI); t.fill();
      }
    }

    // ============================================================
    // GAME STATE
    // ============================================================
    let currentBird = null;
    let pigs = [], blocks = [], particles = [];
    let isDragging = false;
    let dragPos = { x: SLING.x, y: SLING.y };

    function createPuffs(t, e, i) { for (let a = 0; a < 14; a++) particles.push(new Particle(t, e, i)); }
    function rand(t, e) { return Math.floor(Math.random() * (e - t + 1)) + t; }
    function randomChoice(t) { return t[Math.floor(Math.random() * t.length)]; }

    function generateRandomLevel() {
      pigs = []; blocks = []; particles = [];
      state.gameOver = false; state.won = false;
      state.overlayVisible = false; state.overlayType = null; state.overlayBtn = null;

      const groundY = 470;
      const mats = ["wood", "stone", "ice"];
      const type = rand(1, 3);
      const baseX = rand(560, 620);

      if (type === 1) {
        const cols = rand(2, 3), colW = rand(70, 95), rows = rand(2, 4);
        for (let c = 0; c < cols; c++) {
          const cx = baseX + c * (colW + rand(15, 30));
          let y = groundY;
          for (let r = 0; r < rows; r++) {
            const mL = randomChoice(mats), mR = randomChoice(mats), h = rand(65, 85), th = 18;
            blocks.push(new Block(cx, y - h, th, h, mL));
            blocks.push(new Block(cx + colW - th, y - h, th, h, mR));
            if (Math.random() > .3 || r === 0) pigs.push(new Pig(cx + colW / 2, y - 18, rand(16, 18)));
            y -= h;
            blocks.push(new Block(cx - 6, y - 18, colW + 12, 18, randomChoice(mats)));
            y -= 18;
          }
          if (Math.random() > .4) pigs.push(new Pig(cx + colW / 2, y - 18, 17));
        }
      } else if (type === 2) {
        const rows = rand(3, 4), cell = rand(45, 60), th = 22;
        let y = groundY;
        for (let r = rows; r >= 1; r--) {
          const startX = baseX + cell / 2 * (rows - r);
          for (let c = 0; c < r; c++) {
            const bx = startX + c * cell;
            blocks.push(new Block(bx, y - th, cell - 2, th, randomChoice(mats)));
            if (Math.random() > .5 && r < rows) pigs.push(new Pig(bx + cell / 2, y - th - 18, 16));
          }
          y -= th;
        }
        pigs.push(new Pig(baseX + rows * cell / 2, y - 20, 20));
      } else {
        const w = rand(200, 240), mat = randomChoice(["stone", "wood"]);
        blocks.push(new Block(baseX, 375, 24, 95, mat));
        blocks.push(new Block(baseX + w / 2 - 12, 375, 24, 95, mat));
        blocks.push(new Block(baseX + w - 24, 375, 24, 95, mat));
        pigs.push(new Pig(baseX + .25 * w, 452));
        pigs.push(new Pig(baseX + .75 * w, 452));
        blocks.push(new Block(baseX - 10, 355, w + 20, 20, "stone"));
        blocks.push(new Block(baseX + 40, 275, 18, 80, "wood"));
        blocks.push(new Block(baseX + w - 58, 275, 18, 80, "wood"));
        blocks.push(new Block(baseX + 30, 255, w - 60, 20, "wood"));
        pigs.push(new Pig(baseX + w / 2, 335, 19));
      }

      if (pigs.length < 2) {
        pigs.push(new Pig(baseX + 50, 452));
        pigs.push(new Pig(baseX + 120, 452));
      }

      state.pigsLeft = pigs.length;
      state.birdsLeft = Math.min(5, Math.max(3, pigs.length + 1));
      spawnBird();
    }

    function spawnBird() {
      if (state.birdsLeft <= 0) return;
      currentBird = new Bird(SLING.x, SLING.y);
      dragPos = { x: SLING.x, y: SLING.y };
    }

    function checkCollisions() {
      if (currentBird && currentBird.launched && !currentBird.settled) {
        for (const p of pigs) {
          if (p.dead) continue;
          const dx = currentBird.x - p.x, dy = currentBird.y - p.y;
          if (Math.hypot(dx, dy) < currentBird.radius + p.radius) {
            const dmg = 20 * Math.hypot(currentBird.vx, currentBird.vy);
            p.hit(dmg);
            p.vx = .7 * currentBird.vx; p.vy = .7 * currentBird.vy;
            currentBird.vx *= .4; currentBird.vy *= .4;
          }
        }
        for (const b of blocks) {
          if (b.dead) continue;
          const nearestX = Math.max(b.x, Math.min(currentBird.x, b.x + b.w));
          const nearestY = Math.max(b.y, Math.min(currentBird.y, b.y + b.h));
          const dx = currentBird.x - nearestX, dy = currentBird.y - nearestY;
          if (Math.hypot(dx, dy) < currentBird.radius) {
            const spd = Math.hypot(currentBird.vx, currentBird.vy);
            b.hit(25 * spd);
            b.vx += .5 * currentBird.vx;
            b.vy += .3 * currentBird.vy;
            b.va += .1 * (Math.random() - .5);
            currentBird.vx *= -.3; currentBird.vy *= .5;
          }
        }
        for (const b of blocks) {
          if (b.dead || (Math.abs(b.vx) < .2 && Math.abs(b.vy) < .2)) continue;
          for (const p of pigs) {
            if (p.dead) continue;
            const dx = b.x + b.w / 2 - p.x, dy = b.y + b.h / 2 - p.y;
            if (Math.hypot(dx, dy) < p.radius + b.w / 2) p.hit(60);
          }
        }
      }
    }

    function update() {
      currentBird && currentBird.update();
      for (const b of blocks) b.update();
      for (const p of pigs) p.update();
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
      checkCollisions();

      const pigsLeft = pigs.filter(p => !p.dead).length;

      if (pigsLeft === 0 && !state.won) {
        state.won = true;
        setTimeout(() => {
          playSound("win");
          state.overlayVisible = true;
          state.overlayType = "win";
        }, 700);
      }

      if (currentBird && currentBird.launched && currentBird.settled && !state.won) {
        state.birdsLeft--;
        if (state.birdsLeft > 0 && pigsLeft > 0) {
          setTimeout(() => spawnBird(), 600);
        } else if (pigsLeft > 0 && !state.gameOver) {
          state.gameOver = true;
          state.pigsLeft = pigsLeft;
          setTimeout(() => {
            playSound("lose");
            vibrate(100);
            state.overlayVisible = true;
            state.overlayType = "lose";
          }, 900);
        }
        currentBird = null;
      }
    }

    // ============================================================
    // DRAWING
    // ============================================================
    function drawBackground(t) {
      // Radial gradient matching Bricks Bot
      const bg = t.createRadialGradient(V_W / 2, V_H * 0.35, 0, V_W / 2, V_H * 0.35, Math.max(V_W, V_H) * 0.7);
      bg.addColorStop(0, "#13222b");
      bg.addColorStop(1, "#0b141a");
      t.fillStyle = bg;
      t.fillRect(0, 0, V_W, V_H);

      // far hills (subtle)
      t.fillStyle = "rgba(255,255,255,.025)";
      t.beginPath();
      t.arc(240, 490, 260, Math.PI, 0);
      t.arc(720, 490, 290, Math.PI, 0);
      t.fill();

      // ground
      const gy = 470;
      t.fillStyle = "#17242c";
      t.fillRect(0, gy, V_W, 70);
      t.fillStyle = "#00a884";
      t.fillRect(0, gy, V_W, 5);
      t.fillStyle = "#06cf9c";
      t.fillRect(0, 475, V_W, 2);
    }

    function drawSlingshot(t) {
      t.strokeStyle = "#8d5b4c";
      t.lineWidth = 9;
      t.lineCap = "round";
      t.beginPath();
      t.moveTo(SLING.x, 470);
      t.lineTo(SLING.x, SLING.y + 24);
      t.lineTo(SLING.x - 14, SLING.y);
      t.stroke();
      t.beginPath();
      t.moveTo(SLING.x, SLING.y + 24);
      t.lineTo(SLING.x + 14, SLING.y);
      t.stroke();

      if (isDragging && currentBird && !currentBird.launched) {
        t.strokeStyle = "#202c33";
        t.lineWidth = 4;
        t.beginPath();
        t.moveTo(SLING.x - 14, SLING.y);
        t.lineTo(dragPos.x, dragPos.y);
        t.stroke();
      }

      currentBird && currentBird.draw(t);

      if (isDragging && currentBird && !currentBird.launched) {
        t.strokeStyle = "#2a3942";
        t.lineWidth = 4;
        t.beginPath();
        t.moveTo(SLING.x + 14, SLING.y);
        t.lineTo(dragPos.x, dragPos.y);
        t.stroke();
      }
    }

    function drawTrajectory(t) {
      if (!isDragging || !currentBird || currentBird.launched) return;
      const dx = SLING.x - dragPos.x, dy = SLING.y - dragPos.y;
      let px = dragPos.x, py = dragPos.y;
      let vx = .17 * dx, vy = .17 * dy;

      t.fillStyle = "rgba(6, 207, 156, 0.8)";
      for (let i = 0; i < 35; i++) {
        vy += GRAVITY; px += vx; py += vy;
        if (i % 2 === 0) { t.beginPath(); t.arc(px, py, 3, 0, 2 * Math.PI); t.fill(); }
      }
    }

    function drawUI(t) {
      t.save();
      t.textBaseline = "middle";

      // Score panel (top-left)
      t.fillStyle = "rgba(11,20,26,.78)";
      t.beginPath(); t.roundRect(16, 16, 172, 44, 12); t.fill();
      t.strokeStyle = "rgba(255,255,255,.06)";
      t.lineWidth = 1;
      t.beginPath(); t.roundRect(16, 16, 172, 44, 12); t.stroke();

      t.font = "700 10px -apple-system, sans-serif";
      t.fillStyle = "#8696a0";
      t.textAlign = "left";
      t.fillText("SKOR", 30, 30);
      t.font = "800 16px -apple-system, sans-serif";
      t.fillStyle = "#06cf9c";
      t.fillText(String(state.score), 30, 48);

      // Level/birds/pigs panel (top-right)
      const rw = 200;
      t.fillStyle = "rgba(11,20,26,.78)";
      t.beginPath(); t.roundRect(V_W - 16 - rw, 16, rw, 44, 12); t.fill();
      t.strokeStyle = "rgba(255,255,255,.06)";
      t.beginPath(); t.roundRect(V_W - 16 - rw, 16, rw, 44, 12); t.stroke();

      t.textAlign = "center";
      t.font = "700 9px -apple-system, sans-serif";
      t.fillStyle = "#8696a0";
      t.fillText("LEVEL", V_W - 16 - rw + rw * 0.2, 30);
      t.fillText("BURUNG", V_W - 16 - rw + rw * 0.5, 30);
      t.fillText("BABI", V_W - 16 - rw + rw * 0.8, 30);

      t.font = "800 14px -apple-system, sans-serif";
      t.fillStyle = "#e9edef";
      t.fillText(String(state.level), V_W - 16 - rw + rw * 0.2, 48);
      t.fillStyle = "#f15c6d";
      t.fillText(String(Math.max(0, state.birdsLeft)), V_W - 16 - rw + rw * 0.5, 48);
      t.fillStyle = "#00a884";
      t.fillText(String(pigs.filter(p => !p.dead).length), V_W - 16 - rw + rw * 0.8, 48);

      // "Acak" button (bottom-right)
      const btnNewLevel = { x: 800, y: 480, w: 140, h: 40 };
      t.fillStyle = "#00a884";
      t.beginPath(); t.roundRect(btnNewLevel.x, btnNewLevel.y, btnNewLevel.w, btnNewLevel.h, 14); t.fill();
      t.fillStyle = "#0b141a";
      t.font = "800 13px -apple-system, sans-serif";
      t.fillText("🎲 ACAK", btnNewLevel.x + btnNewLevel.w / 2, btnNewLevel.y + btnNewLevel.h / 2 + 1);

      // "Ulang" button (bottom-left)
      const btnReset = { x: 100, y: 420, w: 100, h: 34 };
      t.fillStyle = "rgba(32,44,51,.85)";
      t.beginPath(); t.roundRect(btnReset.x, btnReset.y, btnReset.w, btnReset.h, 12); t.fill();
      t.strokeStyle = "rgba(255,255,255,.1)";
      t.lineWidth = 1;
      t.beginPath(); t.roundRect(btnReset.x, btnReset.y, btnReset.w, btnReset.h, 12); t.stroke();
      t.fillStyle = "#e9edef";
      t.font = "800 12px -apple-system, sans-serif";
      t.fillText("🔄 ULANG", btnReset.x + btnReset.w / 2, btnReset.y + btnReset.h / 2 + 1);

      t.restore();
    }

    function drawOverlay() {
      const dpr = window.devicePixelRatio || 1;
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = "rgba(11,20,26,.9)";
      ctx.fillRect(0, 0, cssW, cssH);

      const cx = cssW / 2;
      const cy = cssH / 2;
      const isWin = state.overlayType === "win";

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // icon
      ctx.font = "64px -apple-system, sans-serif";
      ctx.fillText(isWin ? "🎉" : "💥", cx, cy - 120);

      // title
      ctx.font = "800 32px -apple-system, sans-serif";
      ctx.fillStyle = isWin ? "#06cf9c" : "#f15c6d";
      ctx.shadowColor = isWin ? "rgba(6,207,156,.5)" : "rgba(241,92,109,.4)";
      ctx.shadowBlur = 30;
      ctx.fillText(isWin ? "LEVEL SELESAI!" : "BURUNG HABIS!", cx, cy - 50);
      ctx.shadowBlur = 0;

      // sub
      ctx.font = "600 15px -apple-system, sans-serif";
      ctx.fillStyle = "#8696a0";
      const sub = isWin
        ? `Benteng Level #${state.level} rata! Skor ${state.score}`
        : `Skor ${state.score} · ${state.pigsLeft} babi masih bertahan`;
      ctx.fillText(sub, cx, cy);

      // button
      const btnW = 240, btnH = 56;
      const btnX = cx - btnW / 2, btnY = cy + 50;

      ctx.shadowColor = isWin ? "rgba(0,168,132,.5)" : "rgba(241,92,109,.5)";
      ctx.shadowBlur = 24;
      ctx.fillStyle = isWin ? "#00a884" : "#f15c6d";
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 16); ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = isWin ? "#0b141a" : "#ffffff";
      ctx.font = "800 15px -apple-system, sans-serif";
      ctx.fillText(isWin ? "LEVEL BERIKUTNYA" : "COBA LAGI", cx, btnY + btnH / 2 + 1);

      state.overlayBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

      ctx.restore();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);

      const cssScale = scale / dpr;
      const offX = (cssW - V_W * cssScale) / 2;
      const offY = (cssH - V_H * cssScale) / 2;

      ctx.save();
      ctx.translate(offX, offY);
      ctx.scale(cssScale, cssScale);
      ctx.beginPath();
      ctx.rect(0, 0, V_W, V_H);
      ctx.clip();

      drawBackground(ctx);
      drawTrajectory(ctx);
      drawSlingshot(ctx);

      for (const b of blocks) b.draw(ctx);
      for (const p of pigs) p.draw(ctx);
      for (const p of particles) p.draw(ctx);

      // spare birds on ground
      for (let i = 0; i < state.birdsLeft - 1; i++) {
        ctx.fillStyle = "#f15c6d";
        ctx.beginPath();
        ctx.arc(60 + 26 * i, 460, 10, 0, 2 * Math.PI);
        ctx.fill();
      }

      drawUI(ctx);

      ctx.restore();

      if (state.overlayVisible) drawOverlay();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    // ============================================================
    // INPUT
    // ============================================================
    function getCanvasCoords(t) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const clientX = t.touches ? t.touches[0].clientX : t.clientX;
      const clientY = t.touches ? t.touches[0].clientY : t.clientY;
      const cssX = clientX - rect.left;
      const cssY = clientY - rect.top;
      const cssScale = scale / dpr;
      const offX = (cssW - V_W * cssScale) / 2;
      const offY = (cssH - V_H * cssScale) / 2;
      return { x: (cssX - offX) / cssScale, y: (cssY - offY) / cssScale };
    }

    // in-canvas buttons (virtual coords)
    const btnNewLevel = { x: 800, y: 480, w: 140, h: 40 };
    const btnReset = { x: 100, y: 420, w: 100, h: 34 };

    function onStart(t) {
      ensureAudio();

      // overlay click?
      if (state.overlayVisible) {
        const rect = canvas.getBoundingClientRect();
        const clientX = t.touches ? t.touches[0].clientX : t.clientX;
        const clientY = t.touches ? t.touches[0].clientY : t.clientY;
        const cx = clientX - rect.left;
        const cy = clientY - rect.top;
        if (state.overlayBtn &&
            cx >= state.overlayBtn.x && cx <= state.overlayBtn.x + state.overlayBtn.w &&
            cy >= state.overlayBtn.y && cy <= state.overlayBtn.y + state.overlayBtn.h) {
          if (state.overlayType === "win") state.level++;
          state.overlayVisible = false;
          state.overlayType = null;
          state.overlayBtn = null;
          generateRandomLevel();
        }
        return;
      }

      const coords = getCanvasCoords(t);

      // random level button
      if (coords.x >= btnNewLevel.x && coords.x <= btnNewLevel.x + btnNewLevel.w &&
          coords.y >= btnNewLevel.y && coords.y <= btnNewLevel.y + btnNewLevel.h) {
        vibrate(30);
        state.level++;
        generateRandomLevel();
        return;
      }

      // reset pull button
      if (coords.x >= btnReset.x && coords.x <= btnReset.x + btnReset.w &&
          coords.y >= btnReset.y && coords.y <= btnReset.y + btnReset.h) {
        vibrate(20);
        if (currentBird && !currentBird.launched) {
          dragPos = { x: SLING.x, y: SLING.y };
          currentBird.x = SLING.x;
          currentBird.y = SLING.y;
        }
        return;
      }

      // slingshot grab
      if (!currentBird || currentBird.launched) return;
      if (Math.hypot(coords.x - SLING.x, coords.y - SLING.y) < 120) {
        isDragging = true;
        playSound("stretch");
      }
    }

    function onMove(t) {
      if (!isDragging) return;
      if (t.cancelable) t.preventDefault();

      const coords = getCanvasCoords(t);
      const dx = coords.x - SLING.x, dy = coords.y - SLING.y;
      if (Math.hypot(dx, dy) > SLING.maxPull) {
        const ang = Math.atan2(dy, dx);
        dragPos.x = SLING.x + Math.cos(ang) * SLING.maxPull;
        dragPos.y = SLING.y + Math.sin(ang) * SLING.maxPull;
      } else {
        dragPos.x = coords.x; dragPos.y = coords.y;
      }
      currentBird.x = dragPos.x;
      currentBird.y = dragPos.y;
    }

    function onEnd() {
      if (!isDragging || !currentBird) return;
      isDragging = false;
      const dx = SLING.x - dragPos.x, dy = SLING.y - dragPos.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 15) {
        currentBird.vx = .17 * dx;
        currentBird.vy = .17 * dy;
        currentBird.launched = true;
        playSound("launch");
      } else {
        currentBird.x = SLING.x;
        currentBird.y = SLING.y;
      }
    }

    canvas.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);
    canvas.addEventListener("touchstart", onStart, { passive: false });
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);

    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

    // ============================================================
    // INIT
    // ============================================================
    generateRandomLevel();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
