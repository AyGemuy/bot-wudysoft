<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#2248b8">
  <meta name="description" content="Stack Breaker - responsive HTML5 arcade game">
  <title>Stack Breaker (Offline)</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --pc: #7ad61e;
      --pcd: #3f8a07;
      --font: "Poppins", "Segoe UI", system-ui, Arial, sans-serif;
      --disp: "Baloo 2", "Poppins", "Segoe UI", sans-serif
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1633;
      font-family: var(--font);
      touch-action: none;
      overscroll-behavior: none
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none
    }

    #game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      transform: translateZ(0)
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
      transition: opacity .4s, transform .4s
    }

    #hud.hide {
      opacity: 0;
      transform: translateY(-14px)
    }

    .hrow {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    #ctrls {
      display: flex;
      gap: 8px;
      pointer-events: auto
    }

    .glass {
      background: rgba(8, 14, 36, .45);
      border: 1px solid rgba(255, 255, 255, .38);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3)
    }

    .icb {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .12s, opacity .2s, background .2s
    }

    .icb:hover {
      background: rgba(255, 255, 255, .28)
    }

    .icb svg {
      width: 19px;
      height: 19px;
      fill: #fff
    }

    .icb.off {
      opacity: .42
    }

    .icb:active {
      transform: scale(.9)
    }

    #best {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px 9px 12px;
      border-radius: 15px;
      color: #fff;
      font-weight: 800;
      font-size: 15px
    }

    #best svg {
      width: 19px;
      height: 19px;
      fill: #ffd23a
    }

    .hcenter {
      max-width: 460px;
      margin: 8px auto 0;
      text-align: center
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px
    }

    .lvlc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 800 15px var(--font);
      color: #fff;
      background: var(--pc);
      box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(0, 0, 0, .2), inset 0 -3px 0 rgba(0, 0, 0, .18);
      flex: none
    }

    .lvlc.next {
      background: #fff;
      color: var(--pcd)
    }

    #barWrap {
      flex: 1;
      max-width: 250px;
      height: 16px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .3);
      box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(0, 0, 0, .16);
      overflow: hidden
    }

    #bar {
      height: 100%;
      width: 0;
      border-radius: 99px;
      transition: width .15s ease-out;
      background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0) 60%), var(--pc)
    }

    #bar.rage {
      background: linear-gradient(90deg, #ffd23a, #ff5a1f, #ff2d55, #ffd23a);
      background-size: 200% 100%;
      animation: fl .6s linear infinite
    }

    @keyframes fl {
      to {
        background-position: 200% 0
      }
    }

    .score {
      display: inline-block;
      font: 900 clamp(52px, 9vmin, 72px)/1 var(--font);
      color: #fff;
      margin-top: 12px;
      padding: 4px 26px 8px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(6, 12, 34, .38), rgba(6, 12, 34, .22));
      -webkit-text-stroke: 1.5px rgba(0, 8, 30, .22);
      text-shadow: 0 4px 0 rgba(0, 0, 0, .25), 0 3px 12px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 20, 60, .35)
    }

    .score.pop {
      animation: sp .22s ease-out
    }

    .score.pop2 {
      animation: sp2 .22s ease-out
    }

    @keyframes sp {
      40% {
        transform: scale(1.16)
      }
    }

    @keyframes sp2 {
      40% {
        transform: scale(1.16)
      }
    }

    #heatWrap {
      width: 150px;
      height: 8px;
      margin: 10px auto 0;
      border-radius: 9px;
      background: rgba(0, 0, 0, .2);
      overflow: hidden;
      opacity: 0;
      transition: opacity .3s;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .5)
    }

    #heatWrap.on {
      opacity: 1
    }

    #heat {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffe14a, #ff6a1a, #ff2d55);
      border-radius: 9px;
      transition: width .12s
    }

    #rageTag {
      position: absolute;
      left: 50%;
      top: calc(env(safe-area-inset-top) + 190px);
      transform: translateX(-50%);
      font: 800 34px var(--disp);
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff7b0, #ffae2a 50%, #ff3d1f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 110, 20, .95));
      opacity: 0;
      pointer-events: none;
      white-space: nowrap
    }

    #chain {
      position: absolute;
      left: calc(50% + 90px);
      top: 34%;
      font: 900 26px var(--font);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 3px 0 rgba(0, 0, 0, .2), 0 0 16px rgba(255, 255, 255, .4);
      transform: rotate(-8deg)
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: calc(36px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      animation: pl 1.4s infinite;
      display: none;
      pointer-events: none;
      white-space: nowrap
    }

    @keyframes pl {

      0%,
      100% {
        opacity: .5
      }

      50% {
        opacity: 1
      }
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(6, 14, 40, .5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: opacity .35s
    }

    #overlay.menuBg {
      background: linear-gradient(180deg, rgba(6, 14, 40, .28), rgba(6, 14, 40, 0) 28%, rgba(6, 14, 40, 0) 50%, rgba(6, 14, 40, .6));
      backdrop-filter: none;
      -webkit-backdrop-filter: none
    }

    #overlay.menuBg.wideBg {
      background: linear-gradient(90deg, rgba(6, 14, 40, .55), rgba(6, 14, 40, .15) 45%, rgba(6, 14, 40, 0) 60%)
    }

    #overlay.hide {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: opacity .35s, visibility 0s .35s
    }

    .menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      overflow: auto;
      padding: calc(26px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))
    }

    .menu.wide {
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding-left: max(3vw, 24px);
      padding-right: 40%
    }

    .mtop {
      width: min(400px, 100%);
      text-align: center;
      animation: dropIn .7s cubic-bezier(.2, 1.3, .4, 1) both
    }

    .mbot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(400px, 100%);
      animation: upIn .6s .1s cubic-bezier(.2, 1.2, .4, 1) both
    }

    @keyframes dropIn {
      from {
        transform: translateY(-40px);
        opacity: 0
      }
    }

    @keyframes upIn {
      from {
        transform: translateY(40px);
        opacity: 0
      }
    }

    .logo {
      position: relative;
      display: inline-block;
      font: 800 clamp(58px, 11vmin, 106px)/.8 var(--disp);
      color: #fff;
      letter-spacing: -1px;
      animation: flt 3.2s ease-in-out infinite;
      text-shadow: 0 2px 0 #dfe8ff, 0 4px 0 #bccbf3, 0 6px 0 #9aafe0, 0 8px 0 #7690c9, 0 10px 0 #5670ad, 0 18px 28px rgba(0, 10, 50, .45)
    }

    .logo .l1 {
      display: block
    }

    .logo .b2 {
      display: block;
      color: var(--pc);
      text-shadow: 0 2px 0 var(--pcd), 0 4px 0 var(--pcd), 0 6px 0 var(--pcd), 0 8px 0 var(--pcd), 0 10px 0 rgba(0, 0, 0, .35), 0 18px 28px rgba(0, 10, 50, .45)
    }

    .logo .d3 {
      position: absolute;
      right: -22px;
      top: -14px;
      font: 800 26px/1 var(--disp);
      padding: 7px 11px 5px;
      border-radius: 14px;
      color: #fff;
      letter-spacing: 0;
      background: linear-gradient(180deg, #ff6b9a, #ff2d6e);
      transform: rotate(12deg);
      text-shadow: none;
      box-shadow: 0 4px 0 #b3134a, 0 10px 18px rgba(0, 0, 0, .3)
    }

    @keyframes flt {
      50% {
        transform: translateY(-7px)
      }
    }

    .tagm {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .35)
    }

    .chips {
      display: flex;
      gap: 10px
    }

    .chip {
      min-width: 110px;
      padding: 8px 16px;
      border-radius: 17px;
      color: #fff;
      text-align: left
    }

    .chip small {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .85;
      font-weight: 700
    }

    .chip b {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2
    }

    .chip b i {
      font-style: normal;
      font-size: 13px;
      opacity: .75
    }

    .play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(270px, 100%);
      height: 70px;
      border-radius: 999px;
      border: 0;
      font: 900 27px var(--font);
      letter-spacing: 3px;
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #8dff9b, #24cf60 55%, #13a849);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .2);
      box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), inset 0 3px 0 rgba(255, 255, 255, .5), 0 8px 0 #0c7d34, 0 20px 36px rgba(0, 0, 0, .35);
      animation: pulse 1.6s ease-in-out infinite
    }

    .play svg {
      width: 26px;
      height: 26px;
      fill: #fff
    }

    .play::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
      animation: shine 2.4s infinite
    }

    @keyframes shine {

      0%,
      55% {
        left: -60%
      }

      100% {
        left: 130%
      }
    }

    @keyframes pulse {
      50% {
        transform: scale(1.05)
      }
    }

    .play:active {
      transform: translateY(4px) scale(.97)
    }

    .panel {
      align-self: center;
      margin: 0 auto;
      width: min(320px, 100%);
      padding: 12px 12px 10px;
      border-radius: 24px;
      text-align: left;
      background: linear-gradient(160deg, rgba(46, 66, 130, .62), rgba(16, 24, 56, .5) 65%);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      box-shadow: 0 16px 34px rgba(0, 10, 40, .4), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -14px 22px -14px rgba(0, 0, 0, .35)
    }

    .style-title {
      margin: 0 0 8px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 10, 40, .4);
      opacity: .92
    }

    .skin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px
    }

    .skin-choice {
      position: relative;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 15px;
      padding: 7px 4px 6px;
      cursor: pointer;
      color: #fff;
      font: 700 10.5px/1.2 var(--font);
      transition: .15s;
      text-align: center;
      background: linear-gradient(160deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .04));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -6px 10px -6px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 10, 40, .25);
      text-shadow: 0 1px 2px rgba(0, 10, 40, .5)
    }

    .skin-choice:hover {
      border-color: rgba(255, 255, 255, .6);
      transform: translateY(-1px)
    }

    .skin-choice canvas {
      width: 34px;
      height: 34px;
      display: block;
      margin: 0 auto 4px;
      filter: drop-shadow(0 3px 5px rgba(0, 10, 40, .35))
    }

    .skin-choice.active {
      border-color: var(--pc);
      background: linear-gradient(160deg, rgba(122, 214, 30, .5), rgba(122, 214, 30, .15));
      transform: translateY(-2px);
      box-shadow: 0 0 0 2px rgba(122, 214, 30, .55), 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .5)
    }

    .how {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, .22);
      font-size: 11px;
      line-height: 1.5;
      color: #fff;
      opacity: .88;
      text-shadow: 0 1px 3px rgba(0, 10, 40, .4)
    }

    .how b {
      color: #b9e7ff
    }

    .how .bad {
      color: #fff;
      font-weight: 800
    }

    .how .hot {
      color: #ffb36b;
      font-weight: 800
    }

    .card {
      width: min(350px, 90vw);
      padding: 28px 22px 22px;
      border-radius: 32px;
      text-align: center;
      color: #1c2433;
      background: linear-gradient(180deg, #fff, #eef3fb);
      box-shadow: 0 30px 70px rgba(0, 10, 40, .45), inset 0 0 0 1px rgba(255, 255, 255, .9);
      animation: pop .45s cubic-bezier(.2, 1.35, .4, 1)
    }

    @keyframes pop {
      from {
        transform: translateY(24px) scale(.9);
        opacity: 0
      }
    }

    .tag {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #6a7589;
      font-weight: 800
    }

    .ttl {
      font: 800 38px/1.05 var(--disp);
      color: #1c2433;
      margin-top: 4px
    }

    .big {
      font: 900 64px/1 var(--font);
      margin: 8px 0 0;
      color: var(--pc);
      text-shadow: 0 4px 0 rgba(0, 0, 0, .08)
    }

    .sub {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a94a7;
      font-weight: 700
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0 16px
    }

    .stats div {
      background: #f1f4f9;
      border-radius: 16px;
      padding: 10px 4px
    }

    .stats small {
      display: block;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #7b869a;
      font-weight: 800
    }

    .stats b {
      font-size: 19px;
      font-weight: 900;
      color: #1c2433
    }

    .unlock {
      margin: 0 0 14px;
      padding: 10px;
      border-radius: 14px;
      background: #fff5d6;
      color: #9a6a00;
      font-weight: 800;
      font-size: 13px
    }

    .btn {
      display: block;
      width: 100%;
      cursor: pointer;
      border: 0;
      font: 900 16px var(--font);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
      padding: 16px 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 60%), var(--pc);
      box-shadow: 0 5px 0 var(--pcd), 0 12px 22px rgba(0, 0, 0, .18);
      transition: transform .1s
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--pcd)
    }

    .btn.green {
      background: linear-gradient(180deg, #8dff9b, #24cf60 55%, #13a849);
      box-shadow: 0 5px 0 #0c7d34, 0 12px 22px rgba(0, 0, 0, .18)
    }

    .btn.ghost {
      background: #e9edf4;
      color: #1c2433;
      box-shadow: 0 4px 0 #cfd6e2;
      margin-top: 12px
    }

    .ico {
      width: 74px;
      height: 74px;
      margin: -62px auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 900 34px var(--font);
      color: #fff;
      box-shadow: 0 0 0 6px #fff, 0 12px 24px rgba(0, 0, 0, .25)
    }

    .ico.bad {
      background: linear-gradient(180deg, #ff7a8a, #ff2d55)
    }

    .ico.good {
      background: linear-gradient(180deg, #8dff9b, #13a849)
    }

    .ico.pause {
      background: linear-gradient(180deg, #7cc4ff, #2f7ae5)
    }

    .ico.gold {
      background: linear-gradient(180deg, #ffe27a, #f5a300)
    }

    .stars {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      margin: 10px 0 0
    }

    .stars svg {
      width: 44px;
      height: 44px;
      fill: #d7dce6;
      animation: stIn .5s cubic-bezier(.2, 1.6, .4, 1) backwards
    }

    .stars svg:nth-child(2) {
      width: 60px;
      height: 60px;
      animation-delay: .15s
    }

    .stars svg:nth-child(3) {
      animation-delay: .3s
    }

    .stars svg.on {
      fill: #ffc21a;
      filter: drop-shadow(0 3px 0 #d08a00)
    }

    @keyframes stIn {
      from {
        transform: scale(0) rotate(-60deg)
      }
    }

    @media (max-height:700px) {
      .logo {
        font-size: 50px
      }

      .panel .how {
        display: none
      }

      .play {
        height: 58px
      }

      .tagm {
        margin-top: 8px
      }
    }

    .noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0b1633;
      color: #fff;
      text-align: center;
      font: 600 18px system-ui, sans-serif;
      z-index: 9999
    }
  </style>
</head>

<body>
  <div id="stage"><canvas id="game"></canvas>
    <div class="hide" id="hud">
      <div class="hrow">
        <div id="ctrls"><button aria-label="Pause" class="icb glass" id="btnPause"><svg viewbox="0 0 24 24">
              <rect height="16" rx="1.5" width="5" x="5" y="4"></rect>
              <rect height="16" rx="1.5" width="5" x="14" y="4"></rect>
            </svg></button><button aria-label="Music" class="icb glass" id="btnMusic"><svg viewbox="0 0 24 24">
              <path d="M9 17.5A2.5 2.5 0 1 1 7 15V5l12-2v11.5A2.5 2.5 0 1 1 17 12V7.2L9 8.6z"></path>
            </svg></button><button aria-label="Sound" class="icb glass" id="btnSound"><svg viewbox="0 0 24 24">
              <path d="M4 9h4l5-4v14l-5-4H4z"></path>
              <path d="M16 8a5 5 0 010 8" fill="none" stroke="#fff" stroke-width="2"></path>
            </svg></button></div>
        <div class="glass" id="best"><svg viewbox="0 0 24 24">
            <path d="M3 18h18l-1.5-10-4.5 4-3-7-3 7-4.5-4z"></path>
          </svg><span id="bestV">0</span></div>
      </div>
      <div class="hcenter">
        <div class="topbar">
          <div class="lvlc" id="lvlA">1</div>
          <div id="barWrap">
            <div id="bar"></div>
          </div>
          <div class="lvlc next" id="lvlB">2</div>
        </div>
        <div class="score" id="score">0</div>
        <div id="heatWrap">
          <div id="heat"></div>
        </div>
      </div>
    </div>
    <div id="rageTag">Fire Ball!</div>
    <div id="chain"></div>
