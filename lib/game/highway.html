<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SxcWaMd Highway Racer</title>
  <style>
    :root {
      --bg: #08070b;
      --panel: #121017;
      --line: rgba(255, 255, 255, .09);
      --text: #fff;
      --muted: #aaa1ae;
      --yellow: #facc15;
      --red: #ef4444;
      --blue: #38bdf8
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1e1b2e 0, #0b080d 50%, #050407 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center
    }

    .app {
      width: min(100%, 760px);
      margin: auto
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--red), var(--yellow));
      box-shadow: 0 8px 25px rgba(239, 68, 68, .3);
      font-size: 25px
    }

    .title {
      font-size: 19px;
      font-weight: 800
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px
    }

    .status {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #ddd;
      font-size: 11px
    }

    .gameWrap {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(239, 68, 68, .12)
    }

    canvas {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: #1f2937;
      border-radius: 15px;
      touch-action: none
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .card {
      padding: 11px;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: center
    }

    .card b {
      display: block;
      font-size: 16px;
      color: var(--yellow)
    }

    .card span {
      color: var(--muted);
      font-size: 10px
    }

    .message {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .2);
      text-align: center;
      color: #fee2e2;
      font-size: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      user-select: none
    }

    .t-btn {
      min-height: 55px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation
    }

    .t-btn:active {
      background: rgba(255, 255, 255, .2);
      transform: scale(.96)
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px)
    }

    .overlay.show {
      display: flex
    }

    .modal {
      width: min(92vw, 420px);
      padding: 23px;
      border-radius: 23px;
      background: linear-gradient(145deg, #1c151e, #0f0c12);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      text-align: center
    }

    .modalIcon {
      font-size: 55px;
      margin-bottom: 7px
    }

    .modal h2 {
      margin: 5px 0;
      font-size: 24px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px
    }

    .btn-restart {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--red), var(--yellow));
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }

    @media(max-width:430px) {
      body {
        padding: 8px
      }

      .gameWrap {
        padding: 5px
      }

      .info {
        gap: 5px
      }

      .card {
        padding: 9px 4px
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="avatar">🏎️</div>
        <div>
          <div class="title">SxcWaMd Highway Racer 🚗</div>
          <div class="subtitle">"Hindari mobil lain di jalan tol!" ✨</div>
        </div>
      </div>
      <div class="status" id="statusText">READY</div>
    </div>
    <div class="gameWrap"><canvas id="gameCanvas" width="640" height="360"></canvas></div>
    <div class="info">
      <div class="card"><b id="scoreVal">0</b> <span>JARAK (M)</span></div>
      <div class="card"><b id="highScoreVal">0</b> <span>REKOR (M)</span></div>
    </div>
    <div class="message" id="msgText">Gunakan Panah Kiri / Kanan, A/D, atau Tombol Sentuh di bawah untuk berpindah jalur! 🛣️</div>
    <div class="touch-controls">
      <div class="t-btn" id="btnLeft">◀ KIRI</div>
      <div class="t-btn" id="btnRight">KANAN ▶</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modalIcon">💥</div>
      <h2>CRASH!</h2>
      <p id="finalScoreDesc">Jarak tempuh: 0 m</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button>
    </div>
  </div>
  <script>
    "use strict";
    let audioCtx = null;

    function initAudio() { audioCtx || (audioCtx = new(window.AudioContext || window.webkitAudioContext)), "suspended" === audioCtx.state && audioCtx.resume() }

    function playSound(e) {
      try {
        initAudio();
        const t = audioCtx.createOscillator(),
          a = audioCtx.createGain();
        t.connect(a), a.connect(audioCtx.destination);
        const i = audioCtx.currentTime;
        "steer" === e ? (t.type = "sine", t.frequency.setValueAtTime(300, i), a.gain.setValueAtTime(.05, i), a.gain.exponentialRampToValueAtTime(.01, i + .05), t.start(i), t.stop(i + .05)) : "crash" === e && (t.type = "sawtooth", t.frequency.setValueAtTime(120, i), t.frequency.linearRampToValueAtTime(20, i + .4), a.gain.setValueAtTime(.25, i), a.gain.exponentialRampToValueAtTime(.01, i + .4), t.start(i), t.stop(i + .4))
      } catch (e) {}
    }
    const canvas = document.getElementById("gameCanvas"),
      ctx = canvas.getContext("2d"),
      CANVAS_WIDTH = 640,
      CANVAS_HEIGHT = 360,
      LANES = [190, 320, 450];
    let player, score = 0,
      highScore = 0,
      gameOver = !1,
      gameSpeed = 4,
      roadAnimOffset = 0;
    class PlayerCar { constructor() { this.laneIndex = 1, this.x = LANES[this.laneIndex], this.y = 270, this.w = 36, this.h = 64 } moveLeft() { this.laneIndex > 0 && (this.laneIndex--, this.x = LANES[this.laneIndex], playSound("steer")) } moveRight() { this.laneIndex < LANES.length - 1 && (this.laneIndex++, this.x = LANES[this.laneIndex], playSound("steer")) } draw() { ctx.save(), ctx.translate(this.x - this.w / 2, this.y), ctx.fillStyle = "#ef4444", ctx.fillRect(0, 0, this.w, this.h), ctx.fillStyle = "#1e293b", ctx.fillRect(4, 12, this.w - 8, 14), ctx.fillRect(6, 42, this.w - 12, 10), ctx.fillStyle = "#facc15", ctx.fillRect(2, 2, 6, 4), ctx.fillRect(this.w - 8, 2, 6, 4), ctx.restore() } } class TrafficCar { constructor() { this.laneIndex = Math.floor(Math.random() * LANES.length), this.x = LANES[this.laneIndex], this.y = -100, this.w = 36, this.h = 64, this.speed = 2 + 2 * Math.random(), this.color = ["#38bdf8", "#facc15", "#22c55e", "#a855f7"][Math.floor(4 * Math.random())] } update() { this.y += gameSpeed - this.speed } draw() { ctx.save(), ctx.translate(this.x - this.w / 2, this.y), ctx.fillStyle = this.color, ctx.fillRect(0, 0, this.w, this.h), ctx.fillStyle = "#1e293b", ctx.fillRect(4, 38, this.w - 8, 14), ctx.fillStyle = "#ef4444", ctx.fillRect(2, this.h - 4, 6, 3), ctx.fillRect(this.w - 8, this.h - 4, 6, 3), ctx.restore() } }
    let traffic = [],
      frameCount = 0;

    function initGame() { score = 0, gameOver = !1, gameSpeed = 5, frameCount = 0, traffic = [], player = new PlayerCar, document.getElementById("overlay").classList.remove("show"), updateUI() }

    function update() { if (!gameOver) { frameCount++, score += Math.floor(gameSpeed), roadAnimOffset = (roadAnimOffset + gameSpeed) % 40, gameSpeed = 5 + .5 * Math.floor(score / 1e3), frameCount % Math.max(50, 110 - Math.floor(4 * gameSpeed)) === 0 && traffic.push(new TrafficCar); for (let e = traffic.length - 1; e >= 0; e--) traffic[e].update(), player.x - player.w / 2 < traffic[e].x + traffic[e].w / 2 && player.x + player.w / 2 > traffic[e].x - traffic[e].w / 2 && player.y < traffic[e].y + traffic[e].h && player.y + player.h > traffic[e].y && (gameOver = !0, playSound("crash"), endGame()), traffic[e].y > 410 && traffic.splice(e, 1) } }

    function render() {
      ctx.clearRect(0, 0, 640, 360), ctx.fillStyle = "#15803d", ctx.fillRect(0, 0, 640, 360), ctx.fillStyle = "#334155", ctx.fillRect(120, 0, 400, 360), ctx.strokeStyle = "#f8fafc", ctx.lineWidth = 4, ctx.setLineDash([20, 20]), ctx.lineDashOffset = -roadAnimOffset, ctx.beginPath(), ctx.moveTo(255, 0), ctx.lineTo(255, 360), ctx.stroke(), ctx.beginPath(), ctx.moveTo(385, 0), ctx.lineTo(385, 360), ctx.stroke(), ctx.setLineDash([]);
      for (let e of traffic) e.draw();
      player.draw(), updateUI()
    }

    function gameLoop() { update(), render(), requestAnimationFrame(gameLoop) }

    function updateUI() { score > highScore && (highScore = score), document.getElementById("scoreVal").textContent = score, document.getElementById("highScoreVal").textContent = highScore }

    function endGame() { document.getElementById("finalScoreDesc").textContent = "Jarak tempuh: " + score + " m", document.getElementById("overlay").classList.add("show") } window.addEventListener("keydown", e => { initAudio(), "ArrowLeft" !== e.code && "KeyA" !== e.code || (e.preventDefault(), player.moveLeft()), "ArrowRight" !== e.code && "KeyD" !== e.code || (e.preventDefault(), player.moveRight()) });
    const btnLeft = document.getElementById("btnLeft"),
      btnRight = document.getElementById("btnRight");
    btnLeft.addEventListener("touchstart", e => { e.preventDefault(), initAudio(), player.moveLeft() }), btnLeft.addEventListener("mousedown", e => { e.preventDefault(), initAudio(), player.moveLeft() }), btnRight.addEventListener("touchstart", e => { e.preventDefault(), initAudio(), player.moveRight() }), btnRight.addEventListener("mousedown", e => { e.preventDefault(), initAudio(), player.moveRight() }), document.getElementById("btnRestart").addEventListener("click", () => { initGame() }), initGame(), gameLoop()
  </script>
</body>

</html>
