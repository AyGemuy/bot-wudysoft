<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SxcWaMd Snake Game</title><style>:root{--bg:#08070b;--panel:#121017;--line:rgba(255, 255, 255, .09);--text:#fff;--muted:#aaa1ae;--green:#22c55e;--yellow:#facc15;--red:#ef4444}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body,html{margin:0;padding:0;background:radial-gradient(circle at top,#062414 0,#0b080d 50%,#050407 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}body{min-height:100vh;padding:12px;display:flex;justify-content:center}.app{width:min(100%,760px);margin:auto}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.avatar{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green),var(--yellow));box-shadow:0 8px 25px rgba(34,197,94,.3);font-size:25px}.title{font-size:19px;font-weight:800}.subtitle{color:var(--muted);font-size:11px;margin-top:2px}.status{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#ddd;font-size:11px}.gameWrap{position:relative;width:100%;max-width:680px;margin:auto;padding:8px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.025));box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(34,197,94,.12)}canvas{width:100%;aspect-ratio:1/1;display:block;background:#0d1310;border-radius:15px;touch-action:none}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.card{padding:11px;min-height:62px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);text-align:center}.card b{display:block;font-size:16px;color:var(--yellow)}.card span{color:var(--muted);font-size:10p " width="400" height="400"></canvas></div><div class="info"><div class="card"><b id="scoreVal">0</b> <span>SCORE</span></div><div class="card"><b id="highScoreVal">0</b> <span>HIGH SCORE</span></div></div><div class="message" id="msgText">Gunakan Tombol Panah / WASD / D-Pad untuk mengarahkan ular! 🍎</div><div class="touch-controls"><div class="t-btn up" id="btnUp">⬆</div><div class="t-btn left" id="btnLeft">⬅</div><div class="t-btn down" id="btnDown">⬇</div><div class="t-btn right" id="btnRight">➡</div></div></div><div class="overlay" id="overlay"><div class="modal"><div class="modalIcon">💀</div><h2>GAME OVER</h2><p id="finalScoreDesc">Skor kamu: 0</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button></div></div><script>"use strict";let audioCtx=null;function initAudio(){audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)),"suspended"===audioCtx.state&&audioCtx.resume()}function playSound(e){try{initAudio();const t=audioCtx.createOscillator(),n=audioCtx.createGain();t.connect(n),n.connect(audioCtx.destination);const o=audioCtx.currentTime;"eat"===e?(t.type="sine",t.frequency.setValueAtTime(587,o),t.frequency.setValueAtTime(880,o+.08),n.gain.setValueAtTime(.15,o),n.gain.exponentialRampToValueAtTime(.01,o+.2),t.start(o),t.stop(o+.2)):"hit"===e&&(t.type="sawtooth",t.frequency.setValueAtTime(140,o),t.frequency.linearRampToValueAtTime(40,o+.3),n.gain.setValueAtTime(.2,o),n.gain.exponentialRampToValueAtTime(.01,o+.3),t.start(o),t.stop(o+.3))}catch(e){}}const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),GRID_SIZE=20,TILE_COUNT=canvas.width/20;let snake=[],food={x:5,y:5},dx=1,dy=0,score=0,highScore=0,gameOver=!1,gameInterval=null,changingDirection=!1;function initGame(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}],dx=1,dy=0,score=0,gameOver=!1,changingDirection=!1,spawnFood(),document.getElementById("overlay").classList.remove("show"),updateUI(),gameInterval&&clearInterval(gameInterval),gameInterval=setInterval(game
