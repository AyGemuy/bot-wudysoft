<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Super Mario — Dark Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      overscroll-behavior: none; background: #0b141a; touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9edef; user-select: none; -webkit-user-select: none;
      position: fixed; inset: 0;
    }
    canvas {
      display: block; touch-action: none;
      width: 100vw; height: 100vh;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // ============================================================
    // AUDIO
    // ============================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playSound(t) {
      ensureAudio();
      if (!audioCtx) return;
      const e = audioCtx.currentTime;
      const i = audioCtx.createOscillator();
      const s = audioCtx.createGain();
      i.connect(s); s.connect(audioCtx.destination);

      if (t === "jump") {
        i.type = "square";
        i.frequency.setValueAtTime(150, e);
        i.frequency.exponentialRampToValueAtTime(420, e + 0.14);
        s.gain.setValueAtTime(0.12, e);
        s.gain.linearRampToValueAtTime(0.01, e + 0.15);
        i.start(e); i.stop(e + 0.15);
      } else if (t === "coin") {
        i.type = "sine";
        i.frequency.setValueAtTime(987.77, e);
        i.frequency.setValueAtTime(1318.51, e + 0.08);
        s.gain.setValueAtTime(0.15, e);
        s.gain.linearRampToValueAtTime(0.01, e + 0.32);
        i.start(e); i.stop(e + 0.32);
      } else if (t === "stomp") {
        i.type = "triangle";
        i.frequency.setValueAtTime(220, e);
        i.frequency.linearRampToValueAtTime(60, e + 0.12);
        s.gain.setValueAtTime(0.2, e);
        s.gain.linearRampToValueAtTime(0.01, e + 0.13);
        i.start(e); i.stop(e + 0.13);
      } else if (t === "bump") {
        i.type = "square";
        i.frequency.setValueAtTime(90, e);
        s.gain.setValueAtTime(0.12, e);
        s.gain.linearRampToValueAtTime(0.01, e + 0.08);
        i.start(e); i.stop(e + 0.08);
      } else if (t === "win") {
        [261, 329, 392, 523, 659, 783].forEach((f, idx) => {
          const os = audioCtx.createOscillator();
          const og = audioCtx.createGain();
          os.connect(og); og.connect(audioCtx.destination);
          os.type = "triangle";
          os.frequency.setValueAtTime(f, e + 0.09 * idx);
          og.gain.setValueAtTime(0.15, e + 0.09 * idx);
          og.gain.linearRampToValueAtTime(0.01, e + 0.09 * idx + 0.15);
          os.start(e + 0.09 * idx);
          os.stop(e + 0.09 * idx + 0.16);
        });
      } else if (t === "die") {
        i.type = "sawtooth";
        i.frequency.setValueAtTime(280, e);
        i.frequency.linearRampToValueAtTime(60, e + 0.4);
        s.gain.setValueAtTime(0.2, e);
        s.gain.linearRampToValueAtTime(0.01, e + 0.42);
        i.start(e); i.stop(e + 0.42);
      }
    }

    // ============================================================
    // CANVAS + STATE
    // ============================================================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let W = 0, H = 0, scale = 1;

    const state = { score: 0, coins: 0, lives: 3, gameOver: false, won: false };
    const keys  = { left: false, right: false, jump: false, dash: false };

    const ui = { left: null, right: null, dash: null, jump: null, restart: null };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      scale = Math.min(W / 800, H / 450);
      layoutUI();
    }

    function layoutUI() {
      const pad = 16;
      const btnSize = 56;
      const gap = 10;
      const btnY = H - pad - btnSize;

      ui.left  = { x: pad,                     y: btnY, w: btnSize, h: btnSize };
      ui.right = { x: pad + btnSize + gap,     y: btnY, w: btnSize, h: btnSize };

      const jumpW = 88, dashW = 60;
      ui.jump = { x: W - pad - jumpW,                  y: btnY, w: jumpW, h: btnSize };
      ui.dash = { x: ui.jump.x - gap - dashW,          y: btnY, w: dashW, h: btnSize };

      ui.restart = { x: (W - 200) / 2, y: H / 2 + 44, w: 200, h: 52 };
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 200));

    // ============================================================
    // GAME OBJECTS
    // ============================================================
    const level = { blocks: [], enemies: [], particles: [], flagX: 2496 };

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    class Mario {
      constructor(x, y) {
        this.spawnX = x; this.spawnY = y;
        this.reset();
      }
      reset() {
        this.x = this.spawnX; this.y = this.spawnY;
        this.w = 20; this.h = 28;
        this.vx = 0; this.vy = 0;
        this.grounded = false; this.facing = 1;
        this.dead = false; this.won = false;
        this.animTime = 0;
      }
      update() {
        if (this.dead || this.won) return;
        const maxSpd = keys.dash ? 4.6 : 3.2;
        if (keys.left)       { this.vx = Math.max(this.vx - 0.45, -maxSpd); this.facing = -1; }
        else if (keys.right) { this.vx = Math.min(this.vx + 0.45,  maxSpd); this.facing =  1; }
        else                 { this.vx *= 0.78; if (Math.abs(this.vx) < 0.05) this.vx = 0; }

        if (keys.jump && this.grounded) {
          this.vy = -10.5; this.grounded = false; playSound("jump");
        }

        this.vy += 0.52;
        if (this.vy > 12) this.vy = 12;

        this.x += this.vx;
        this.checkXCollision();

        this.y += this.vy;
        this.grounded = false;
        this.checkYCollision();

        if (Math.abs(this.vx) > 0.2) this.animTime += 0.2;
        else this.animTime = 0;

        if (this.y > 550) this.die();
      }
      checkXCollision() {
        for (const b of level.blocks) {
          if (rectsIntersect(this, b)) {
            if (this.vx > 0)      { this.x = b.x - this.w; this.vx = 0; }
            else if (this.vx < 0) { this.x = b.x + b.w;     this.vx = 0; }
          }
        }
      }
      checkYCollision() {
        for (const b of level.blocks) {
          if (rectsIntersect(this, b)) {
            if (this.vy > 0) {
              this.y = b.y - this.h; this.vy = 0; this.grounded = true;
            } else if (this.vy < 0) {
              this.y = b.y + b.h; this.vy = 0; b.hit();
            }
          }
        }
      }
      die() {
        if (this.dead) return;
        this.dead = true;
        playSound("die");
        state.lives--;
        setTimeout(() => {
          if (state.lives <= 0) triggerGameOver(false);
          else this.reset();
        }, 1000);
      }
      draw(t) {
        t.save();
        t.translate(Math.round(this.x + this.w / 2), Math.round(this.y + this.h / 2));
        if (this.facing === -1) t.scale(-1, 1);

        const skin = "#111b21";
        // cap
        t.fillStyle = "#00a884";
        t.fillRect(-8, -14, 16, 5);
        t.fillRect(-4, -17, 10, 4);
        // face
        t.fillStyle = "#fed09d";
        t.fillRect(-7, -9, 13, 8);
        t.fillStyle = "#0b141a";
        t.fillRect(1, -8, 3, 3);
        t.fillRect(-2, -3, 9, 3);
        // shirt
        t.fillStyle = "#06cf9c";
        t.fillRect(-7, -1, 14, 8);
        // overalls
        t.fillStyle = skin;
        t.fillRect(-6, 2, 12, 7);
        // buttons
        t.fillStyle = "#ffd166";
        t.fillRect(-3, 3, 2, 2);
        t.fillRect(2, 3, 2, 2);
        // legs
        const sw = 3 * Math.sin(this.animTime);
        t.fillStyle = skin;
        t.fillRect(-7, 9, 5, 5 + sw);
        t.fillRect(2, 9, 5, 5 - sw);
        // shoes
        t.fillStyle = "#423325";
        t.fillRect(-9, 12 + sw, 7, 3);
        t.fillRect(1, 12 - sw, 7, 3);

        t.restore();
      }
    }

    class Block {
      constructor(x, y, w, h, type = "brick") {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.type = type; this.bumpY = 0;
      }
      hit() {
        if (this.type === "question") {
          this.type = "used";
          this.bumpY = -6;
          playSound("coin");
          state.score += 200;
          state.coins++;
          level.particles.push(new CoinParticle(this.x + 8, this.y - 12));
        } else if (this.type === "brick") {
          this.bumpY = -4;
          playSound("bump");
        }
      }
      update() {
        if (this.bumpY < 0) this.bumpY += 0.8;
        else this.bumpY = 0;
      }
      draw(t) {
        const e = this.y + this.bumpY;
        if (this.type === "ground") {
          t.fillStyle = "#17242c"; t.fillRect(this.x, e, this.w, this.h);
          t.fillStyle = "#00a884"; t.fillRect(this.x, e, this.w, 3);
          t.strokeStyle = "#23343f"; t.strokeRect(this.x, e, this.w, this.h);
        } else if (this.type === "pipe") {
          t.fillStyle = "#00a884"; t.fillRect(this.x, e, this.w, this.h);
          t.fillStyle = "#06cf9c"; t.fillRect(this.x + 4, e, 4, this.h);
          t.strokeStyle = "#005c4b"; t.lineWidth = 2;
          t.strokeRect(this.x, e, this.w, this.h);
          t.lineWidth = 1;
        } else if (this.type === "question") {
          t.fillStyle = "#00a884"; t.fillRect(this.x, e, this.w, this.h);
          t.strokeStyle = "#06cf9c"; t.strokeRect(this.x + 1, e + 1, this.w - 2, this.h - 2);
          t.fillStyle = "#ffd166"; t.font = "bold 14px monospace";
          t.fillText("?", this.x + 7, e + 17);
        } else if (this.type === "used") {
          t.fillStyle = "#202c33"; t.fillRect(this.x, e, this.w, this.h);
          t.strokeStyle = "#2a3942"; t.strokeRect(this.x, e, this.w, this.h);
        } else {
          t.fillStyle = "#2a3942"; t.fillRect(this.x, e, this.w, this.h);
          t.fillStyle = "#00a884"; t.fillRect(this.x + 1, e + 1, this.w - 2, 2);
          t.strokeStyle = "#1a252c"; t.strokeRect(this.x, e, this.w, this.h);
        }
      }
    }

    class Goomba {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 20; this.h = 20;
        this.vx = -1.1;
        this.dead = false; this.remove = false;
        this.anim = 0;
      }
      update() {
        if (this.dead) return;
        this.x += this.vx;
        for (const b of level.blocks) {
          if (rectsIntersect(this, b)) { this.vx *= -1; this.x += this.vx; break; }
        }
        this.anim += 0.15;
      }
      stomp() {
        this.dead = true;
        playSound("stomp");
        state.score += 100;
        setTimeout(() => this.remove = true, 400);
      }
      draw(t) {
        if (this.remove) return;
        t.save();
        t.translate(Math.round(this.x), Math.round(this.y));
        if (this.dead) {
          t.fillStyle = "#f15c6d";
          t.fillRect(0, 10, this.w, 8);
        } else {
          t.fillStyle = "#f15c6d";
          t.beginPath();
          t.arc(10, 8, 9, Math.PI, 0, false);
          t.lineTo(19, 14);
          t.lineTo(1, 14);
          t.fill();
          t.fillStyle = "#fed09d";
          t.fillRect(4, 8, 12, 6);
          t.fillStyle = "#000";
          t.fillRect(6, 9, 2, 3);
          t.fillRect(12, 9, 2, 3);
          const e = 2 * Math.sin(this.anim);
          t.fillStyle = "#202c33";
          t.fillRect(2, 14, 6 + e, 5);
          t.fillRect(12, 14, 6 - e, 5);
        }
        t.restore();
      }
    }

    class CoinParticle {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vy = -5; this.life = 25;
      }
      update() {
        this.y += this.vy;
        this.vy += 0.35;
        this.life--;
      }
      draw(t) {
        if (this.life <= 0) return;
        t.fillStyle = "#ffd166";
        t.beginPath();
        t.arc(this.x, this.y, 6, 0, Math.PI * 2);
        t.fill();
      }
    }

    function initLevel() {
      level.blocks = [];
      level.enemies = [];
      level.particles = [];
      const TS = 24;

      // ground segments
      [{ start: 0, end: 40 }, { start: 44, end: 75 }, { start: 79, end: 110 }].forEach(seg => {
        for (let i = seg.start; i < seg.end; i++) {
          level.blocks.push(new Block(i * TS, 402, TS, 48, "ground"));
        }
      });

      // pipes
      [14, 28, 56, 88].forEach(x => {
        level.blocks.push(new Block(x * TS, 354, 36, 48, "pipe"));
      });

      // question & brick blocks
      [
        { x: 8,  y: 7, t: "question" }, { x: 10, y: 7, t: "brick" }, { x: 11, y: 7, t: "question" }, { x: 12, y: 7, t: "brick" },
        { x: 20, y: 6, t: "question" }, { x: 22, y: 6, t: "brick" },
        { x: 48, y: 7, t: "brick" },    { x: 49, y: 7, t: "question" }, { x: 50, y: 7, t: "brick" },
        { x: 62, y: 5, t: "question" }, { x: 63, y: 5, t: "question" },
        { x: 83, y: 7, t: "question" }, { x: 84, y: 7, t: "brick" },
        { x: 92, y: 6, t: "brick" },    { x: 93, y: 6, t: "brick" }, { x: 94, y: 6, t: "question" }
      ].forEach(b => {
        level.blocks.push(new Block(b.x * TS, 450 - b.y * TS, TS, TS, b.t));
      });

      // goombas
      [18, 25, 34, 52, 60, 68, 86, 96].forEach(x => {
        level.enemies.push(new Goomba(x * TS, 382));
      });

      level.flagX = 2496;
    }

    const mario = new Mario(60, 330);

    function triggerGameOver(won) {
      state.gameOver = true;
      if (won) { playSound("win"); state.won = true; }
    }

    function restartGame() {
      state.score = 0;
      state.coins = 0;
      state.lives = 3;
      state.gameOver = false;
      state.won = false;
      initLevel();
      mario.reset();
    }

    // ============================================================
    // UPDATE
    // ============================================================
    let cameraX = 0;

    function update() {
      mario.update();

      const targetCamX = mario.x - 280;
      cameraX += 0.1 * (targetCamX - cameraX);
      if (cameraX < 0) cameraX = 0;

      for (const b of level.blocks) b.update();

      for (let i = level.particles.length - 1; i >= 0; i--) {
        const p = level.particles[i];
        p.update();
        if (p.life <= 0) level.particles.splice(i, 1);
      }

      for (const g of level.enemies) {
        g.update();
        if (!g.dead && rectsIntersect(mario, g)) {
          if (mario.vy > 0 && mario.y + mario.h - mario.vy <= g.y + 8) {
            g.stomp();
            mario.vy = -7.5;
          } else {
            mario.die();
          }
        }
      }

      if (!state.won && mario.x >= level.flagX) {
        state.won = true;
        mario.won = true;
        mario.vx = 0;
        setTimeout(() => triggerGameOver(true), 600);
      }
    }

    // ============================================================
    // DRAW HELPERS
    // ============================================================
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      if (typeof ctx.roundRect === "function") {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      r = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function inRect(x, y, r) {
      return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    }

    // ============================================================
    // DRAW: WORLD
    // ============================================================
    function drawWorld() {
      const ox = (W - 800 * scale) / 2;
      const oy = (H - 450 * scale) / 2;

      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);
      ctx.beginPath();
      ctx.rect(0, 0, 800, 450);
      ctx.clip();

      // sky
      const sky = ctx.createRadialGradient(400, 200, 0, 400, 200, 500);
      sky.addColorStop(0, "#13222b");
      sky.addColorStop(1, "#0b141a");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 800, 450);

      // far hills
      ctx.save();
      ctx.translate(0.25 * -cameraX, 0);
      ctx.fillStyle = "#111b21";
      for (let i = 0; i < 15; i++) {
        ctx.beginPath();
        ctx.arc(320 * i + 80, 420, 160, Math.PI, 0, false);
        ctx.fill();
      }
      ctx.restore();

      // clouds
      ctx.save();
      ctx.translate(0.15 * -cameraX, 0);
      ctx.fillStyle = "rgba(255,255,255,0.035)";
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        ctx.arc(380 * i + 50, 70, 36, 0, 2 * Math.PI);
        ctx.arc(380 * i + 85, 60, 48, 0, 2 * Math.PI);
        ctx.arc(380 * i + 120, 70, 36, 0, 2 * Math.PI);
        ctx.fill();
      }
      ctx.restore();

      // world with camera
      ctx.save();
      ctx.translate(-Math.round(cameraX), 0);

      // flag pole
      ctx.fillStyle = "#2a3942";
      ctx.fillRect(level.flagX + 10, 210, 5, 192);
      ctx.fillStyle = "#00a884";
      ctx.beginPath();
      ctx.arc(level.flagX + 12.5, 210, 8, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = "#06cf9c";
      ctx.beginPath();
      ctx.moveTo(level.flagX + 10, 222);
      ctx.lineTo(level.flagX - 25, 450 - 24 * 8.8);
      ctx.lineTo(level.flagX + 10, 258);
      ctx.fill();

      for (const b of level.blocks) b.draw(ctx);
      for (const g of level.enemies) g.draw(ctx);
      for (const p of level.particles) p.draw(ctx);
      mario.draw(ctx);

      ctx.restore();
      ctx.restore();
    }

    // ============================================================
    // DRAW: HUD (screen space, Bricks Bot style)
    // ============================================================
    function drawHUD() {
      ctx.save();
      ctx.textBaseline = "middle";

      // left panel: lives | coins | level
      const lx = 12, ly = 12, lh = 44;
      const lw = 196;

      ctx.fillStyle = "rgba(11,20,26,.78)";
      rr(lx, ly, lw, lh, 12);
      ctx.fill();

      const cy = ly + lh / 2;
      ctx.textAlign = "center";

      const hearts = "❤️".repeat(Math.max(0, state.lives)) + "🖤".repeat(Math.max(0, 3 - state.lives));
      ctx.font = "14px -apple-system, sans-serif";
      ctx.fillStyle = "#f15c6d";
      ctx.fillText(hearts, lx + lw * 0.17, cy);

      ctx.font = "800 13px -apple-system, sans-serif";
      ctx.fillStyle = "#ffd166";
      ctx.fillText("🪙" + state.coins, lx + lw * 0.5, cy);

      ctx.fillStyle = "#06cf9c";
      ctx.fillText("1-1", lx + lw * 0.84, cy);

      // right panel: score
      const rw = 144;
      const rx = W - rw - 12;

      ctx.fillStyle = "rgba(11,20,26,.78)";
      rr(rx, ly, rw, lh, 12);
      ctx.fill();

      ctx.textAlign = "left";
      ctx.font = "600 9px -apple-system, sans-serif";
      ctx.fillStyle = "#8696a0";
      ctx.fillText("SKOR", rx + 12, ly + 15);

      ctx.font = "800 14px -apple-system, sans-serif";
      ctx.fillStyle = "#e9edef";
      ctx.fillText(String(state.score), rx + 12, ly + 31);

      ctx.restore();
    }

    // ============================================================
    // DRAW: CONTROLS
    // ============================================================
    function drawControlBtn(r, text, active, opts = {}) {
      ctx.save();
      if (active) {
        ctx.shadowColor = "rgba(0,168,132,.5)";
        ctx.shadowBlur = 20;
        ctx.fillStyle = "#06cf9c";
      } else {
        ctx.fillStyle = "rgba(32,44,51,.85)";
      }
      rr(r.x, r.y, r.w, r.h, 14);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (!active) {
        ctx.strokeStyle = "rgba(255,255,255,.1)";
        ctx.lineWidth = 1;
        rr(r.x, r.y, r.w, r.h, 14);
        ctx.stroke();
      }

      ctx.fillStyle = active ? "#0b141a" : (opts.fg || "#e9edef");
      ctx.font = opts.font || "800 20px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, r.x + r.w / 2, r.y + r.h / 2 + 1);
      ctx.restore();
    }

    function drawJumpBtn(r, text, active) {
      ctx.save();
      const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      g.addColorStop(0, active ? "#00a884" : "#06cf9c");
      g.addColorStop(1, active ? "#005c4b" : "#00a884");
      ctx.fillStyle = g;
      ctx.shadowColor = active ? "rgba(6,207,156,.8)" : "rgba(0,168,132,.35)";
      ctx.shadowBlur = active ? 24 : 12;
      rr(r.x, r.y, r.w, r.h, 14);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#0b141a";
      ctx.font = "800 13px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, r.x + r.w / 2, r.y + r.h / 2 + 1);
      ctx.restore();
    }

    function drawControls() {
      if (state.gameOver || state.won) return;

      drawControlBtn(ui.left,  "◀", keys.left,  { font: "800 22px -apple-system, sans-serif" });
      drawControlBtn(ui.right, "▶", keys.right, { font: "800 22px -apple-system, sans-serif" });
      drawControlBtn(ui.dash,  "⚡", keys.dash,  { font: "800 20px -apple-system, sans-serif" });
      drawJumpBtn(ui.jump, "⬆ LOMPAT", keys.jump);
    }

    // ============================================================
    // DRAW: OVERLAY
    // ============================================================
    function drawOverlay() {
      if (!state.gameOver) return;

      ctx.save();
      ctx.fillStyle = "rgba(11,20,26,.88)";
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2;
      let cy = H / 2 - 100;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.font = "64px -apple-system, sans-serif";
      ctx.fillText(state.won ? "🎉" : "💥", cx, cy);
      cy += 62;

      const title = state.won ? "TAHAP SELESAI!" : "GAME OVER";
      ctx.font = "800 30px -apple-system, sans-serif";
      ctx.fillStyle = state.won ? "#06cf9c" : "#f15c6d";
      ctx.shadowColor = state.won ? "rgba(6,207,156,.5)" : "rgba(241,92,109,.4)";
      ctx.shadowBlur = 30;
      ctx.fillText(title, cx, cy);
      ctx.shadowBlur = 0;
      cy += 48;

      ctx.font = "600 14px -apple-system, sans-serif";
      ctx.fillStyle = "#8696a0";
      const sub = state.won
        ? `Skor ${state.score} · ${state.coins} koin · ${state.lives} nyawa tersisa`
        : "Jangan menyerah! Ayo coba lagi.";
      ctx.fillText(sub, cx, cy);

      // restart button
      const b = ui.restart;
      ctx.shadowColor = "rgba(0,168,132,.45)";
      ctx.shadowBlur = 24;
      ctx.fillStyle = "#00a884";
      rr(b.x, b.y, b.w, b.h, 14);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#0b141a";
      ctx.font = "800 14px -apple-system, sans-serif";
      ctx.fillText("MAIN LAGI", cx, b.y + b.h / 2 + 1);

      ctx.restore();
    }

    // ============================================================
    // MAIN DRAW
    // ============================================================
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#0b141a";
      ctx.fillRect(0, 0, W, H);

      drawWorld();

      if (!state.gameOver) {
        drawHUD();
        drawControls();
      }
      if (state.gameOver) {
        drawOverlay();
      }
    }

    // ============================================================
    // INPUT
    // ============================================================
    const presses = new Map(); // pointerId -> key

    function hitKeyButton(x, y) {
      if (inRect(x, y, ui.left))  return "left";
      if (inRect(x, y, ui.right)) return "right";
      if (inRect(x, y, ui.dash))  return "dash";
      if (inRect(x, y, ui.jump))  return "jump";
      return null;
    }

    function handlePointerDown(e) {
      ensureAudio();
      const x = e.clientX;
      const y = e.clientY;

      if (state.gameOver) {
        if (inRect(x, y, ui.restart)) {
          restartGame();
          if (e.cancelable) e.preventDefault();
        }
        return;
      }

      const key = hitKeyButton(x, y);
      if (key) {
        keys[key] = true;
        presses.set(e.pointerId, key);
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        if (e.cancelable) e.preventDefault();
      }
    }

    function handlePointerUp(e) {
      const key = presses.get(e.pointerId);
      if (key) {
        keys[key] = false;
        presses.delete(e.pointerId);
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }

    window.addEventListener("pointerdown",   handlePointerDown, { passive: false });
    window.addEventListener("pointerup",     handlePointerUp,   { passive: false });
    window.addEventListener("pointercancel", handlePointerUp,   { passive: true  });
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("gesturestart", e => e.preventDefault());
    document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
    document.addEventListener("touchmove", e => {
      if (!e.target.closest("button")) e.preventDefault();
    }, { passive: false });

    window.addEventListener("keydown", e => {
      ensureAudio();
      if (e.code === "ArrowLeft"  || e.code === "KeyA") keys.left  = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      if (e.code === "ArrowUp"    || e.code === "Space" || e.code === "KeyW") keys.jump = true;
      if (e.code === "ShiftLeft"  || e.code === "KeyJ") keys.dash = true;
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
      if ((e.code === "Enter" || e.code === "Space") && state.gameOver) {
        restartGame();
      }
    }, { passive: false });

    window.addEventListener("keyup", e => {
      if (e.code === "ArrowLeft"  || e.code === "KeyA") keys.left  = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      if (e.code === "ArrowUp"    || e.code === "Space" || e.code === "KeyW") keys.jump = false;
      if (e.code === "ShiftLeft"  || e.code === "KeyJ") keys.dash = false;
    });

    // ============================================================
    // LOOP + INIT
    // ============================================================
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    initLevel();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
