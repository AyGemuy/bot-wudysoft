<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Dadu Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      overscroll-behavior: none; background: #0b141a; touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e9edef; user-select: none; -webkit-user-select: none;
      position: fixed; inset: 0;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // ==========================================
    // CONFIG
    // ==========================================
    const V_W = 480, V_H = 800;
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let scale = 1, offsetX = 0, offsetY = 0;

    const state = {
      saldo: 100000,
      displaySaldo: 100000,
      type: 'ganjil',
      num: 1,
      amount: 1000,
      rolling: false,
      menang: 0,
      kalah: 0,
      dieValue: 1,
      lastResult: null,          // 'win' | 'lose' | null — drives glow & message color
      message: 'Pilih jenis taruhan & nominal,\nlalu tekan Pasang Taruhan.'
    };

    const MULT = { ganjil: 2, genap: 2, kecil: 2, besar: 2, tepat: 5 };
    const LABEL = { ganjil: "Ganjil", genap: "Genap", kecil: "Kecil", besar: "Besar" };
    const TYPES = ['ganjil', 'genap', 'kecil', 'besar', 'tepat'];
    const TYPE_LABELS = ['Ganjil 2x', 'Genap 2x', 'Kecil 2x', 'Besar 2x', 'Tepat 5x'];
    const AMOUNTS = [1000, 5000, 10000, 25000, 50000, 'ALL IN'];
    const AMT_LABELS = ['1rb', '5rb', '10rb', '25rb', '50rb', 'ALL IN'];

    const particles = [];

    // ==========================================
    // LAYOUT
    // ==========================================
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';

      scale = Math.min(canvas.width / V_W, canvas.height / V_H);
      offsetX = (canvas.width - V_W * scale) / 2;
      offsetY = (canvas.height - V_H * scale) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // ==========================================
    // GAME LOGIC
    // ==========================================
    function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    function sanitizeState() {
      if (state.amount > state.saldo) state.amount = state.saldo;
      if (state.amount < 100 && state.saldo >= 100) state.amount = 100;
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          life: 1,
          size: 2 + Math.random() * 5,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.vx *= 0.97;
        p.life -= 0.018;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function playGame() {
      if (state.rolling || state.saldo < 100 || state.amount < 100) return;

      state.rolling = true;
      state.lastResult = null;
      state.saldo -= state.amount;

      const betType = state.type;
      const betNum = state.num;
      const betAmount = state.amount;
      const betName = betType === 'tepat' ? `Angka ${betNum}` : LABEL[betType];

      state.message = `Taruhan Rp ${betAmount.toLocaleString('id-ID')} · ${betName}\nMengocok dadu...`;

      const rollInterval = setInterval(() => {
        state.dieValue = 1 + Math.floor(Math.random() * 6);
      }, 60);

      setTimeout(() => {
        clearInterval(rollInterval);
        const finalVal = 1 + Math.floor(Math.random() * 6);
        state.dieValue = finalVal;
        state.rolling = false;

        let win = false;
        if (betType === 'ganjil' && finalVal % 2 === 1) win = true;
        else if (betType === 'genap' && finalVal % 2 === 0) win = true;
        else if (betType === 'kecil' && finalVal <= 3) win = true;
        else if (betType === 'besar' && finalVal >= 4) win = true;
        else if (betType === 'tepat' && finalVal === betNum) win = true;

        if (win) {
          const mult = MULT[betType];
          const winAmt = betAmount * (mult - 1);
          state.saldo += betAmount * mult;
          state.menang++;
          state.lastResult = 'win';
          state.message = `Menang +Rp ${winAmt.toLocaleString('id-ID')} 🎉\nDadu keluar ${finalVal} · ${betName}`;
          vibrate([50, 50, 50]);
          spawnParticles(V_W / 2, 240, '#06cf9c', 32);
          spawnParticles(V_W / 2, 240, '#ffd166', 16);
        } else {
          state.kalah++;
          state.lastResult = 'lose';
          state.message = `Kalah -Rp ${betAmount.toLocaleString('id-ID')}\nDadu keluar ${finalVal} · ${betName}`;
          vibrate(100);
          spawnParticles(V_W / 2, 240, '#f15c6d', 18);
        }

        sanitizeState();
      }, 1600);
    }

    function resetGame() {
      state.saldo = 100000;
      state.displaySaldo = 100000;
      state.menang = 0;
      state.kalah = 0;
      state.amount = 1000;
      state.type = 'ganjil';
      state.num = 1;
      state.rolling = false;
      state.lastResult = null;
      state.message = 'Saldo diisi ulang.\nSelamat bermain lagi! 🎲';
      particles.length = 0;
      vibrate(50);
    }

    // ==========================================
    // INPUT
    // ==========================================
    function handlePointerDown(e) {
      if (e.cancelable) e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const px = (clientX - rect.left) * (canvas.width / rect.width);
      const py = (clientY - rect.top) * (canvas.height / rect.height);
      const x = (px - offsetX) / scale;
      const y = (py - offsetY) / scale;

      if (state.rolling) return;

      const hasNum = state.type === 'tepat';
      const yType = 500, yNum = 560, yAmt = hasNum ? 620 : 560, yPlay = 700;
      const typeW = (V_W - 40 - 4 * 6) / 5;
      const numW = (V_W - 40 - 5 * 6) / 6;
      const amtW = (V_W - 40 - 5 * 6) / 6;

      for (let i = 0; i < TYPES.length; i++) {
        const tx = 20 + i * (typeW + 6);
        if (x >= tx && x <= tx + typeW && y >= yType && y <= yType + 36) {
          state.type = TYPES[i];
          sanitizeState();
          vibrate(20);
          return;
        }
      }

      if (hasNum) {
        for (let i = 1; i <= 6; i++) {
          const nx = 20 + (i - 1) * (numW + 6);
          if (x >= nx && x <= nx + numW && y >= yNum && y <= yNum + 36) {
            state.num = i;
            vibrate(20);
            return;
          }
        }
      }

      for (let i = 0; i < AMOUNTS.length; i++) {
        const ax = 20 + i * (amtW + 6);
        if (x >= ax && x <= ax + amtW && y >= yAmt && y <= yAmt + 36) {
          const val = AMOUNTS[i];
          state.amount = val === 'ALL IN' ? state.saldo : Math.min(val, state.saldo);
          vibrate(20);
          return;
        }
      }

      if (x >= 20 && x <= V_W - 20 && y >= yPlay && y <= yPlay + 56) {
        if (state.saldo < 100) resetGame();
        else playGame();
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    // ==========================================
    // DRAW HELPERS
    // ==========================================
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, w, h, r);
        return;
      }
      r = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawButton(label, x, y, w, h, active, disabled = false) {
      ctx.save();
      rr(x, y, w, h, 10);

      if (active) {
        ctx.fillStyle = '#00a884';
        ctx.shadowColor = 'rgba(0,168,132,.45)';
        ctx.shadowBlur = 14;
        ctx.fill();
      } else if (disabled) {
        ctx.fillStyle = 'rgba(26,36,42,.9)';
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(32,44,51,.85)';
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      ctx.strokeStyle = active ? '#06cf9c' : 'rgba(255,255,255,.06)';
      ctx.lineWidth = 1;
      rr(x, y, w, h, 10);
      ctx.stroke();

      ctx.fillStyle = active ? '#0b141a' : (disabled ? '#4a5c66' : '#e9edef');
      ctx.font = '800 12px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x + w / 2, y + h / 2 + 1);
      ctx.restore();
    }

    function drawDie(cx, cy, size, value, rolling) {
      // Ambient result glow (behind, in world coords)
      if (!rolling && state.lastResult) {
        const glowRgb = state.lastResult === 'win' ? '6,207,156' : '241,92,109';
        const glow = ctx.createRadialGradient(cx, cy, size * 0.4, cx, cy, size * 1.35);
        glow.addColorStop(0, `rgba(${glowRgb},.22)`);
        glow.addColorStop(1, `rgba(${glowRgb},0)`);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, size * 1.35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(cx, cy);

      if (rolling) {
        const angle = Math.sin(Date.now() / 70) * 0.22;
        const sx = 1 + Math.sin(Date.now() / 90) * 0.06;
        const sy = 1 + Math.cos(Date.now() / 90) * 0.06;
        ctx.rotate(angle);
        ctx.scale(sx, sy);
      }

      // Body shadow + fill
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = 12;

      const r = size * 0.22;
      ctx.fillStyle = '#f7f7f4';
      rr(-size / 2, -size / 2, size, size, r);
      ctx.fill();

      // Inner top highlight
      ctx.shadowColor = 'transparent';
      ctx.shadowOffsetY = 0;
      const hi = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
      hi.addColorStop(0, 'rgba(255,255,255,.9)');
      hi.addColorStop(1, 'rgba(0,0,0,.05)');
      ctx.fillStyle = hi;
      rr(-size / 2, -size / 2, size, size, r);
      ctx.fill();

      // Border
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0,0,0,.08)';
      rr(-size / 2, -size / 2, size, size, r);
      ctx.stroke();

      // Dots
      const dotR = size * 0.08;
      const s = size * 0.24;
      const dots = [];
      if (value === 1) dots.push([0, 0]);
      if (value === 2) dots.push([-s, -s], [s, s]);
      if (value === 3) dots.push([-s, -s], [0, 0], [s, s]);
      if (value === 4) dots.push([-s, -s], [s, -s], [-s, s], [s, s]);
      if (value === 5) dots.push([-s, -s], [s, -s], [0, 0], [-s, s], [s, s]);
      if (value === 6) dots.push([-s, -s], [s, -s], [-s, 0], [s, 0], [-s, s], [s, s]);

      ctx.fillStyle = '#0b141a';
      for (const d of dots) {
        ctx.beginPath();
        ctx.arc(d[0], d[1], dotR, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawHUD() {
      // Left panel: SALDO
      const lx = 16, ly = 16, lw = 200, lh = 52;
      ctx.fillStyle = 'rgba(11,20,26,.78)';
      rr(lx, ly, lw, lh, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      ctx.lineWidth = 1;
      rr(lx, ly, lw, lh, 12); ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#8696a0';
      ctx.font = '700 9px -apple-system, sans-serif';
      ctx.fillText('SALDO', lx + 14, ly + 16);

      ctx.fillStyle = '#06cf9c';
      ctx.font = '800 18px -apple-system, sans-serif';
      ctx.fillText('Rp ' + Math.round(state.displaySaldo).toLocaleString('id-ID'), lx + 14, ly + 36);

      // Right panel: W/L
      const rw = 130, rx = V_W - 16 - rw;
      ctx.fillStyle = 'rgba(11,20,26,.78)';
      rr(rx, ly, rw, lh, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.06)';
      rr(rx, ly, rw, lh, 12); ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#8696a0';
      ctx.font = '700 9px -apple-system, sans-serif';
      ctx.fillText('MENANG', rx + rw * 0.28, ly + 16);
      ctx.fillText('KALAH', rx + rw * 0.72, ly + 16);

      ctx.font = '800 15px -apple-system, sans-serif';
      ctx.fillStyle = '#06cf9c';
      ctx.fillText(String(state.menang), rx + rw * 0.28, ly + 36);
      ctx.fillStyle = '#f15c6d';
      ctx.fillText(String(state.kalah), rx + rw * 0.72, ly + 36);

      ctx.textBaseline = 'alphabetic';
    }

    function drawMessage() {
      const lines = state.message.split('\n');
      ctx.textAlign = 'center';

      let color = '#e9edef';
      if (state.lastResult === 'win') color = '#06cf9c';
      else if (state.lastResult === 'lose') color = '#f15c6d';

      if (lines.length > 1) {
        ctx.font = '800 22px -apple-system, sans-serif';
        ctx.fillStyle = color;
        ctx.fillText(lines[0], V_W / 2, 385);
        ctx.font = '500 14px -apple-system, sans-serif';
        ctx.fillStyle = '#8696a0';
        ctx.fillText(lines[1], V_W / 2, 410);
      } else {
        ctx.font = '500 14px -apple-system, sans-serif';
        ctx.fillStyle = '#8696a0';
        ctx.fillText(lines[0], V_W / 2, 398);
      }
    }

    // ==========================================
    // DRAW MAIN
    // ==========================================
    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Outer letterbox
      ctx.fillStyle = '#0b141a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Virtual coords
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);
      ctx.beginPath();
      ctx.rect(0, 0, V_W, V_H);
      ctx.clip();

      // Radial gradient background (Bricks Bot style)
      const bg = ctx.createRadialGradient(V_W / 2, V_H * 0.35, 0, V_W / 2, V_H * 0.35, Math.max(V_W, V_H));
      bg.addColorStop(0, '#13222b');
      bg.addColorStop(1, '#0b141a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, V_W, V_H);

      drawHUD();
      drawDie(V_W / 2, 240, 140, state.dieValue, state.rolling);
      drawParticles();
      drawMessage();

      // ===== Controls =====
      const hasNum = state.type === 'tepat';
      const yType = 500, yNum = 560, yAmt = hasNum ? 620 : 560, yPlay = 700;
      const typeW = (V_W - 40 - 4 * 6) / 5;
      const numW = (V_W - 40 - 5 * 6) / 6;
      const amtW = (V_W - 40 - 5 * 6) / 6;

      for (let i = 0; i < TYPES.length; i++) {
        const tx = 20 + i * (typeW + 6);
        drawButton(TYPE_LABELS[i], tx, yType, typeW, 36, state.type === TYPES[i]);
      }

      if (hasNum) {
        for (let i = 1; i <= 6; i++) {
          const nx = 20 + (i - 1) * (numW + 6);
          drawButton(String(i), nx, yNum, numW, 36, state.num === i);
        }
      }

      for (let i = 0; i < AMOUNTS.length; i++) {
        const ax = 20 + i * (amtW + 6);
        const val = AMOUNTS[i];
        const active = val === 'ALL IN'
          ? state.amount === state.saldo && state.saldo >= 100
          : state.amount === val;
        const disabled = val !== 'ALL IN' && val > state.saldo;
        drawButton(AMT_LABELS[i], ax, yAmt, amtW, 36, active, disabled);
      }

      // Play / Reset
      const isReset = state.saldo < 100;
      let playLabel, playBg, playFg, playShadow;
      if (isReset) {
        playLabel = 'MULAI ULANG';
        playBg = '#f15c6d';
        playFg = '#ffffff';
        playShadow = 'rgba(241,92,109,.45)';
      } else if (state.rolling) {
        playLabel = 'MENGOCOK...';
        playBg = '#202c33';
        playFg = '#8696a0';
        playShadow = null;
      } else {
        playLabel = 'PASANG TARUHAN';
        playBg = '#00a884';
        playFg = '#0b141a';
        playShadow = 'rgba(0,168,132,.45)';
      }

      ctx.save();
      if (playShadow) {
        ctx.shadowColor = playShadow;
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 5;
      }
      rr(20, yPlay, V_W - 40, 56, 14);
      ctx.fillStyle = playBg;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.shadowOffsetY = 0;

      if (playShadow) {
        ctx.strokeStyle = 'rgba(255,255,255,.1)';
        ctx.lineWidth = 1;
        rr(20, yPlay, V_W - 40, 56, 14);
        ctx.stroke();
      }

      ctx.fillStyle = playFg;
      ctx.font = '800 15px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(playLabel, V_W / 2, yPlay + 28 + 1);
      ctx.restore();
    }

    // ==========================================
    // LOOP
    // ==========================================
    function update() {
      if (state.displaySaldo !== state.saldo) {
        const diff = state.saldo - state.displaySaldo;
        state.displaySaldo += diff * 0.15;
        if (Math.abs(diff) < 1) state.displaySaldo = state.saldo;
      }
      updateParticles();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
