<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    :root {
      --bg-dark: #0a0e14;
      --panel-bg: #141922;
      --panel-border: #263040;
      --accent-red: #ff334b;
      --accent-green: #00e676;
      --accent-blue: #00b0ff;
      --accent-gold: #ffc107
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent
    }

    body {
      background: var(--bg-dark);
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px
    }

    .game-card {
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--accent-gold);
      text-transform: uppercase
    }

    .viewport-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      max-height: 290px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid var(--panel-border);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, .8)
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block
    }

    .hud-stats {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 900;
      z-index: 10;
      pointer-events: none
    }

    .hud-pill {
      background: rgba(0, 0, 0, .65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, .1);
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 2px #000
    }

    .speed-gauge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, .7);
      padding: 4px 8px;
      border-radius: 8px;
      font-family: monospace;
      font-weight: 900;
      color: #fff;
      font-size: 14px;
      border-left: 3px solid var(--accent-green);
      pointer-events: none
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 20, .9);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 20px
    }

    .overlay h2 {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 6px
    }

    .overlay p {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 18px
    }

    .btn-restart {
      background: var(--accent-red);
      color: #fff;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 51, 75, .4);
      transition: transform .1s
    }

    .btn-restart:active {
      transform: scale(.96)
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .btn-ctrl {
      background: #1c2331;
      border: 1px solid #2d384e;
      color: #fff;
      padding: 14px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: all .1s ease
    }

    .btn-ctrl.active,
    .btn-ctrl:active {
      background: #2a364f;
      border-color: #4a5c80;
      transform: translateY(2px)
    }

    .btn-gas {
      grid-column: span 3;
      background: linear-gradient(180deg, #1f883d, #196c30);
      border: 1px solid #2ea043;
      font-size: 15px;
      padding: 14px 0
    }

    .btn-gas.active,
    .btn-gas:active {
      background: #2ea043
    }

    .btn-upgrade {
      grid-column: span 3;
      background: linear-gradient(180deg, #7038d1, #5325a8);
      border: 1px solid #8957e5;
      padding: 12px 0;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px
    }

    .footer-brand {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #57606a;
      font-weight: 700;
      letter-spacing: .5px
    }
  </style>
</head>
