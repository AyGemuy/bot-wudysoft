<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SxcWaMd Pong</title>
  <style>
    :root {
      --bg: #08070b;
      --panel: #121017;
      --line: rgba(255, 255, 255, .09);
      --text: #fff;
      --muted: #aaa1ae;
      --pink: #ec4899;
      --yellow: #facc15;
      --cyan: #06b6d4
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body,
    html {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1f1124 0, #0b080d 50%, #050407 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center
    }

    .app {
      width: min(100%, 760px);
      margin: auto
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--pink), var(--cyan));
      box-shadow: 0 8px 25px rgba(236, 72, 153, .3);
      font-size: 25px
    }

    .title {
      font-size: 19px;
      font-weight: 800
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px
    }

    .status {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #ddd;
      font-size: 11px
    }

    .gameWrap {
      position: relative;
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .025));
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(6, 182, 212, .12)
    }

    canvas {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      background: #0f172a;
      border-radius: 15px;
      touch-action: none
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .card {
      padding: 11px;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .035);
      text-align: center
    }

    .card b {
      display: block;
      font-size: 16px;
      color: var(--yellow)
    }

    .card span {
      color: var(--muted);
      font-size: 10px
    }

    .message {
      margin-top: 10px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(6, 182, 212, .1);
      border: 1px solid rgba(6, 182, 212, .2);
      text-align: center;
      color: #cffafe;
      font-size: 12px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
      user-select: none
    }

    .t-btn {
      min-height: 55px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation
    }

    .t-btn:active {
      background: rgba(255, 255, 255, .2);
      transform: scale(.96)
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(8px)
    }

    .overlay.show {
      display: flex
    }

    .modal {
      width: min(92vw, 420px);
      padding: 23px;
      border-radius: 23px;
      background: linear-gradient(145deg, #1c151e, #0f0c12);
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 25px 80px rgba(0, 0, 0, .65);
      text-align: center
    }

    .modal h2 {
      margin: 5px 0;
      font-size: 24px
    }

    .modal p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px
    }

    .btn-restart {
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--pink), var(--cyan));
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="avatar">🏓</div>
        <div>
          <div class="title">SxcWaMd Pong 🎾</div>
          <div class="subtitle">"Kalahkan AI di meja tenis!" ✨</div>
        </div>
      </div>
      <div class="status" id="statusText">READY</div>
    </div>
    <div class="gameWrap"><canvas id="gameCanvas" width="640" height="360"></canvas></div>
    <div class="info">
      <div class="card"><b id="playerScore">0</b><span>PLAYER SKOR</span></div>
      <div class="card"><b id="aiScore">0</b><span>AI SKOR</span></div>
    </div>
    <div class="message">Gunakan Tombol Panah Atas/Bawah, W/S, atau Tombol Sentuh untuk menggerakkan raket! 🏓</div>
    <div class="touch-controls">
      <div class="t-btn" id="btnUp">▲ ATAS</div>
      <div class="t-btn" id="btnDown">▼ BAWAH</div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="resTitle">GAME OVER</h2>
      <p id="resDesc">Pertandingan selesai!</p><button class="btn-restart" id="btnRestart">🔄 Main Lagi</button>
    </div>
  </div>
  <script>
    let audioCtx = null;

    function initAudio() { audioCtx || (audioCtx = new(window.AudioContext || window.webkitAudioContext)), "suspended" === audioCtx.state && audioCtx.resume() }

    function playSound(e) { try { initAudio(); const t = audioCtx.createOscillator(),
          a = audioCtx.createGain();
        t.connect(a), a.connect(audioCtx.destination); const l = audioCtx.currentTime; "hit" === e ? (t.type = "triangle", t.frequency.setValueAtTime(440, l), a.gain.setValueAtTime(.1, l), a.gain.exponentialRampToValueAtTime(.01, l + .1), t.start(l), t.stop(l + .1)) : "score" === e && (t.type = "sawtooth", t.frequency.setValueAtTime(200, l), t.frequency.linearRampToValueAtTime(80, l + .3), a.gain.setValueAtTime(.2, l), a.gain.exponentialRampToValueAtTime(.01, l + .3), t.start(l), t.stop(l + .3)) } catch (e) {} }
    const canvas = document.getElementById("gameCanvas"),
      ctx = canvas.getContext("2d"),
      CANVAS_WIDTH = 640,
      CANVAS_HEIGHT = 360;
    let pScore = 0,
      aScore = 0,
      upPressed = !1,
      downPressed = !1;
    const player = { x: 20, y: 140, w: 12, h: 70, dy: 6 },
      ai = { x: 608, y: 140, w: 12, h: 70, dy: 4.5 },
      ball = { x: 320, y: 180, radius: 8, vx: 4, vy: 3 };

    function resetBall(e) { ball.x = 320, ball.y = 180, ball.vx = "player" === e ? -4 : 4, ball.vy = 4 * Math.random() - 2 }

    function update() { upPressed && player.y > 10 && (player.y -= player.dy), downPressed && player.y < 360 - player.h - 10 && (player.y += player.dy); let e = ai.y + ai.h / 2; if (e < ball.y - 15 ? ai.y += ai.dy : e > ball.y + 15 && (ai.y -= ai.dy), ai.y < 10 && (ai.y = 10), ai.y > 360 - ai.h - 10 && (ai.y = 360 - ai.h - 10), ball.x += ball.vx, ball.y += ball.vy, (ball.y - ball.radius < 0 || ball.y + ball.radius > 360) && (ball.vy *= -1, playSound("hit")), ball.x - ball.radius < player.x + player.w && ball.y > player.y && ball.y < player.y + player.h) { ball.vx *= -1.08; let e = ball.y - (player.y + player.h / 2);
        ball.vy = .15 * e, playSound("hit") } if (ball.x + ball.radius > ai.x && ball.y > ai.y && ball.y < ai.y + ai.h) { ball.vx *= -1.08; let e = ball.y - (ai.y + ai.h / 2);
        ball.vy = .15 * e, playSound("hit") } ball.x < 0 ? (aScore++, playSound("score"), aScore >= 5 ? endGame("AI MENANG!") : resetBall("ai")) : ball.x > 640 && (pScore++, playSound("score"), pScore >= 5 ? endGame("PLAYER MENANG!") : resetBall("player")), document.getElementById("playerScore").textContent = pScore, document.getElementById("aiScore").textContent = aScore }

    function render() { ctx.fillStyle = "#0f172a", ctx.fillRect(0, 0, 640, 360), ctx.strokeStyle = "rgba(255,255,255,0.2)", ctx.lineWidth = 4, ctx.setLineDash([10, 10]), ctx.beginPath(), ctx.moveTo(320, 0), ctx.lineTo(320, 360), ctx.stroke(), ctx.setLineDash([]), ctx.fillStyle = "#ec4899", ctx.fillRect(player.x, player.y, player.w, player.h), ctx.fillStyle = "#06b6d4", ctx.fillRect(ai.x, ai.y, ai.w, ai.h), ctx.fillStyle = "#facc15", ctx.beginPath(), ctx.arc(ball.x, ball.y, ball.radius, 0, 2 * Math.PI), ctx.fill() }
    let gameInterval = null;

    function gameLoop() { update(), render() }

    function initGame() { pScore = 0, aScore = 0, player.y = 140, ai.y = 140, resetBall("player"), document.getElementById("overlay").classList.remove("show"), gameInterval && clearInterval(gameInterval), gameInterval = setInterval(gameLoop, 1e3 / 60) }

    function endGame(e) { clearInterval(gameInterval), document.getElementById("resTitle").textContent = e, document.getElementById("resDesc").textContent = `Skor akhir: Player ${pScore} - ${aScore} AI`, document.getElementById("overlay").classList.add("show") }

    function bindTouch(e, t) { const a = document.getElementById(e),
        l = e => { e.preventDefault(), initAudio(), t ? upPressed = !0 : downPressed = !0 },
        n = e => { e.preventDefault(), t ? upPressed = !1 : downPressed = !1 };
      a.addEventListener("touchstart", l), a.addEventListener("touchend", n), a.addEventListener("mousedown", l), a.addEventListener("mouseup", n) } window.addEventListener("keydown", e => { initAudio(), "ArrowUp" !== e.code && "KeyW" !== e.code || (e.preventDefault(), upPressed = !0), "ArrowDown" !== e.code && "KeyS" !== e.code || (e.preventDefault(), downPressed = !0) }), window.addEventListener("keyup", e => { "ArrowUp" !== e.code && "KeyW" !== e.code || (upPressed = !1), "ArrowDown" !== e.code && "KeyS" !== e.code || (downPressed = !1) }), bindTouch("btnUp", !0), bindTouch("btnDown", !1), document.getElementById("btnRestart").addEventListener("click", initGame), initGame()
  </script>
</body>

</html>
