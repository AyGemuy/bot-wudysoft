tton></div></div><script>"use strict";let audioCtx=null;function initAudio(){audioCtx||(audioCtx=new(window.AudioContext||window.webkitAudioContext)),"suspended"===audioCtx.state&&audioCtx.resume()}function playSound(e){try{initAudio();const t=audioCtx.createOscillator(),i=audioCtx.createGain();t.connect(i),i.connect(audioCtx.destination);const a=audioCtx.currentTime;"break"===e?(t.type="triangle",t.frequency.setValueAtTime(400,a),t.frequency.exponentialRampToValueAtTime(100,a+.08),i.gain.setValueAtTime(.1,a),i.gain.exponentialRampToValueAtTime(.01,a+.08),t.start(a),t.stop(a+.08)):"fire"===e?(t.type="sawtooth",t.frequency.setValueAtTime(600,a),t.frequency.exponentialRampToValueAtTime(300,a+.12),i.gain.setValueAtTime(.15,a),i.gain.exponentialRampToValueAtTime(.01,a+.12),t.start(a),t.stop(a+.12)):"hit"===e?(t.type="sawtooth",t.frequency.setValueAtTime(120,a),t.frequency.linearRampToValueAtTime(30,a+.3),i.gain.setValueAtTime(.2,a),i.gain.exponentialRampToValueAtTime(.01,a+.3),t.start(a),t.stop(a+.3)):"win"===e&&(t.type="sine",t.frequency.setValueAtTime(523,a),t.frequency.setValueAtTime(659,a+.1),t.frequency.setValueAtTime(783,a+.2),i.gain.setValueAtTime(.2,a),i.gain.exponentialRampToValueAtTime(.01,a+.4),t.start(a),t.stop(a+.4))}catch(e){}}const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),CANVAS_WIDTH=640,CANVAS_HEIGHT=360;let ball,score=0,level=1,gameOver=!1,gameWon=!1,isPressing=!1,stackSlices=[],totalSlices=30,cylinderAngle=0,ballY=40,ballVy=0,isSuperCharged=!1,superChargeTimer=0;class Ball{constructor(){this.x=320,this.y=ballY,this.radius=10,this.vy=0}update(){isPressing||isSuperCharged?this.vy=8:(this.vy+=.4,this.vy>6&&(this.vy=6)),this.y+=this.vy;let e=Math.floor((this.y-60)/12);if(e>=0&&e<stackSlices.length){let t=stackSlices[e];if(t&&!t.broken){let e=!1;for(let i of t.segments)if(i.isBlack){let t=(cylinderAngle%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(i.containsAngle(t)){e=!0;break}}e&&!isSuperCharged?(gameOver=!0,playSound("hit"),show
